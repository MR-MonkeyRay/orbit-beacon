# WebSocket Connection 头映射
map $http_upgrade $orbitbeacon_connection_upgrade {
    default upgrade;
    "" close;
}

# 常规接口与登录接口限流
limit_req_zone $binary_remote_addr zone=orbitbeacon_general:10m rate=20r/s;

map $request_method $orbitbeacon_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $orbitbeacon_login_key zone=orbitbeacon_login:10m rate=5r/m;

server {
    listen 443 ssl http2;
    # 请替换为实际域名与证书路径，并同步修改 server.yaml 的 public_url
    server_name beacon.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 登录接口限流
    location = /api/v1/session {
        limit_req zone=orbitbeacon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 数据库空间整理可能耗时较久，放宽读取超时至 31 分钟并关闭缓冲
    location = /api/v1/data-management/compact {
        limit_req zone=orbitbeacon_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 31m;
        proxy_buffering off;
    }

    # 常规接口及 WebSocket / SSE（须关闭代理缓冲）
    location / {
        limit_req zone=orbitbeacon_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orbitbeacon_connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
