services:
  orbitbeacon:
    image: ghcr.io/mr-monkeyray/orbit-beacon:${ORBITBEACON_IMAGE_TAG:-latest}
    environment:
      ORBITBEACON_LISTEN_ADDR: "${ORBITBEACON_LISTEN_ADDR:-0.0.0.0:8080}"
      ORBITBEACON_PUBLIC_URL: "${ORBITBEACON_PUBLIC_URL:?set ORBITBEACON_PUBLIC_URL}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - orbitbeacon-data:/var/lib/orbitbeacon
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  orbitbeacon-data:
    name: orbitbeacon-data
