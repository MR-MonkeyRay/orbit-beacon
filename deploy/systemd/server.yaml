# 修改后须重启服务；优先级：命令行参数 > ORBITBEACON_* 环境变量 > 本文件。
# HTTP 监听地址；公网暴露请搭配 HTTPS 反向代理。
listen_addr: "127.0.0.1:8080"
# 数据持久化目录：归运行用户所有，权限 0700。
data_dir: /var/lib/orbitbeacon
# 浏览器访问地址（仅协议 + 域名 + 可选端口，不含路径）；须与实际访问一致。
public_url: "http://localhost:8080"
# 节点容量上限（含待注册和已禁用节点）。
max_nodes: 500
# 网页状态推送与轮询间隔（2–60 秒），不影响 Agent 采集频率。
web_update_interval_seconds: 10
# 反向代理 IP / CIDR 列表；无代理留空，禁止填 /0。
trusted_proxies: []
# Prometheus 指标监听地址（留空关闭）；无鉴权，仅限本机或内网访问。
metrics_listen: ""
# 是否开启 HTTP 访问日志（健康检查仅记录 5xx）。
access_log: false
# 允许向本机回环 IP 发送 HTTP Webhook（须同时开启下一项）。
allow_insecure_webhooks: false
# 允许通知与 Webhook 访问内网地址（云元数据地址始终拦截）。
notification_allow_private_networks: false
# 默认 {} 使用本地 SQLite；改用 MySQL 见 deploy/README.md（密码须用 password_file）。
database: {}
