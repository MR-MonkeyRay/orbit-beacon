name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Main-branch runs may already be publishing; do not interrupt them.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.project-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: project-version
        run: |
          set -eu
          version="$(< VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'VERSION must contain a SemVer-like version, such as 0.1.0' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if ! unformatted="$(gofmt -l cmd internal)"; then
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Run uncached tests with coverage
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      # Only trusted main-branch runs can read remote admin credentials; report unconfigured infrastructure explicitly.
      - name: Run isolated-schema remote MySQL integration tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ORBITBEACON_TEST_MYSQL_ADMIN_CONFIG: ${{ secrets.ORBITBEACON_TEST_MYSQL_ADMIN_CONFIG }}
          ORBITBEACON_TEST_MYSQL_ADMIN_PASSWORD: ${{ secrets.ORBITBEACON_TEST_MYSQL_ADMIN_PASSWORD }}
        run: |
          set -eu
          if [ -z "$ORBITBEACON_TEST_MYSQL_ADMIN_CONFIG" ] && [ -z "$ORBITBEACON_TEST_MYSQL_ADMIN_PASSWORD" ]; then
            echo 'Remote MySQL integration was not run: admin configuration and password secrets are not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$ORBITBEACON_TEST_MYSQL_ADMIN_CONFIG" ] || [ -z "$ORBITBEACON_TEST_MYSQL_ADMIN_PASSWORD" ]; then
            echo 'Remote MySQL integration requires both admin configuration and password secrets.' >&2
            exit 1
          fi
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/orbitbeacon-mysql.XXXXXX")"
          trap 'rm -f "$private_dir/admin.json" "$private_dir/admin.password"; rmdir "$private_dir"' EXIT
          printf '%s' "$ORBITBEACON_TEST_MYSQL_ADMIN_PASSWORD" > "$private_dir/admin.password"
          printf '%s' "$ORBITBEACON_TEST_MYSQL_ADMIN_CONFIG" | jq --arg password_file "$private_dir/admin.password" '.database.primary.password_file = $password_file' > "$private_dir/admin.json"
          chmod 0600 "$private_dir/admin.json" "$private_dir/admin.password"
          unset ORBITBEACON_TEST_MYSQL_ADMIN_CONFIG ORBITBEACON_TEST_MYSQL_ADMIN_PASSWORD
          export ORBITBEACON_TEST_MYSQL=1
          export ORBITBEACON_TEST_MYSQL_CONFIG="$private_dir/admin.json"
          go test -p 1 -count=1 -timeout=20m ./internal/server ./internal/server/storage ./internal/server/history ./internal/server/auth ./internal/server/nodes ./internal/server/enrollment ./internal/server/ingest ./internal/server/backup ./internal/server/notify ./internal/server/inbox ./internal/server/alerts ./internal/server/management ./internal/server/app ./cmd/orbitbeacon-server

      - name: Run race tests
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run cross-platform go vet
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - name: Run Staticcheck
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$RUNNER_TEMP/bin/staticcheck" ./...

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Go builds embed committed assets without requiring Node.js.
      - name: Verify embedded web assets match source
        run: npm run check

      - name: Run web tests
        run: npm test

  security:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vulnerability scan
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/bin/govulncheck" ./...

  installer:
    name: Agent installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: shellcheck deploy/install-agent.sh deploy/install-agent.test.sh

      - name: Run installer regression tests
        run: sh deploy/install-agent.test.sh

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, security, installer]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.go.outputs.version }}
