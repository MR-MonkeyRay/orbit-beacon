name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Verify toolchain
        run: test "$(go version)" = "go version go1.27.3 linux/amd64"

      - name: Check formatting
        run: |
          if ! unformatted="$(gofmt -l cmd internal)"; then
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module contents
        run: go mod verify

      - name: Run tests without cache
        env:
          GOTOOLCHAIN: go1.27.3
        run: go test -count=1 ./...

      - name: Run race tests on concurrency-critical packages
        env:
          GOTOOLCHAIN: go1.27.3
        run: go test -race -count=1 ./internal/server/... ./internal/agent/...

      - name: Run vet
        env:
          GOTOOLCHAIN: go1.27.3
        run: go vet ./...

      - name: Run Go vulnerability scan
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOTOOLCHAIN=go1.27.3 "$RUNNER_TEMP/bin/govulncheck" ./...
