name: Release

on:
  workflow_call:
    inputs:
      version:
        description: CI 已校验的项目版本
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Publish image and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录 GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: 检查该版本是否已发布
        id: publication-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          skip=false
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            release_assets="$(gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "$release_assets" | grep -Fxq orbitbeacon-server-linux-amd64 && \
              printf '%s\n' "$release_assets" | grep -Fxq orbitbeacon-server-linux-arm64 && \
              printf '%s\n' "$release_assets" | grep -Fxq orbitbeacon-agent-linux-amd64 && \
              printf '%s\n' "$release_assets" | grep -Fxq orbitbeacon-agent-linux-arm64 && \
              printf '%s\n' "$release_assets" | grep -Fxq SHA256SUMS; then
              skip=true
              echo "版本 $VERSION 的镜像和 Release 资产已存在；跳过发布"
            fi
          fi
          printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"

      - name: 配置 Go
        if: steps.publication-state.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建发布二进制
        if: steps.publication-state.outputs.skip != 'true'
        run: |
          set -eu
          output_dir="$RUNNER_TEMP/release"
          mkdir -p "$output_dir"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            for kind in server agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath \
                -ldflags "-s -w -X orbitbeacon/internal/buildinfo.Version=$VERSION -X orbitbeacon/internal/buildinfo.Commit=$GITHUB_SHA -X orbitbeacon/internal/buildinfo.BuildDate=$build_date" \
                -o "$output_dir/orbitbeacon-$kind-linux-$arch" \
                "./cmd/orbitbeacon-$kind"
            done
          done
          (cd "$output_dir" && sha256sum orbitbeacon-*-linux-* > SHA256SUMS)

      - name: 构建并推送镜像
        if: steps.publication-state.outputs.skip != 'true'
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --file build/server.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --provenance=true \
            --sbom=true \
            --push \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: 发布 GitHub Release 二进制
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PUBLICATION: ${{ steps.publication-state.outputs.skip }}
        run: |
          set -eu
          tag="v$VERSION"
          assets=("$RUNNER_TEMP/release/orbitbeacon-server-linux-amd64" "$RUNNER_TEMP/release/orbitbeacon-server-linux-arm64" "$RUNNER_TEMP/release/orbitbeacon-agent-linux-amd64" "$RUNNER_TEMP/release/orbitbeacon-agent-linux-arm64" "$RUNNER_TEMP/release/SHA256SUMS")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$VERSION"
            if [ "$SKIP_PUBLICATION" != 'true' ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "OrbitBeacon $VERSION 发布。校验和见 SHA256SUMS。"
          fi
          release_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for arch in amd64 arm64; do
            legacy_asset="orbitbeacon-$VERSION-linux-$arch.tar.gz"
            if printf '%s\n' "$release_assets" | grep -Fxq "$legacy_asset"; then
              gh release delete-asset "$tag" "$legacy_asset" --yes
            fi
          done
