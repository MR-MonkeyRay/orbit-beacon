openapi: 3.1.0
info:
  title: OrbitBeacon control plane and agent protocol
  version: 0.1.0
  description: |
    The control plane supports enrollment, agent telemetry, metric history,
    alert rules, encrypted notification channels, encrypted data exports, backup
    plans and a shared notification inbox. Agent upgrades are not available.
    Browser reads require a session unless explicitly marked otherwise; agent
    routes use separate Bearer credentials and never accept browser sessions.
    Every console account is an equal administrator with full management access.
    All browser mutations require the configured HTTPS Origin and a session-bound
    CSRF token; login requires Origin. Backup plans, tasks, downloads, recovery
    passwords and shared task/alert notifications are available to every signed-in
    administrator. Notification read state is independent for each account.
    Canonical origins lowercase DNS names, normalize IPv6 and omit default port 443;
    request Host and forwarded headers do not establish Origin trust. Client IP
    policies use X-Forwarded-For only when the direct peer matches trusted_proxies
    (default empty), scanning right to left past trusted hops. Missing, malformed
    or all-trusted chains fall back to the direct peer. X-Forwarded-Proto is ignored.
    JSON requests must contain one object and are limited to 64 KiB. Telemetry
    reports discard unknown fields, including unknown metric/status/source keys;
    known fields and unmatched disk/network metadata remain validated. Enrollment,
    recovery and management writes reject unknown fields. String limits enforced
    by the server are UTF-8 byte limits.
    Byte-constrained strings use x-minLengthBytes/x-maxLengthBytes, not JSON Schema
    character-count bounds. Validators must opt into these extensions; the Server
    remains authoritative. For example, four CJK characters can satisfy an
    eight-byte password minimum.
    Unsupported methods return 405 with Allow before authentication is checked;
    unknown API routes return structured 404, never the UI shell.
    State changes and actor-attributed audit insertion share one transaction;
    failed audit insertion rolls back the change. Batch nodes use one transaction
    per node and report individual failures rather than committing unaudited changes.
    Sessions expire after 12 hours. Successful login and an hourly retention task
    perform bounded expired-session cleanup; other requests, including anonymous
    public reads, never trigger cleanup. Login (session.create) and logout
    (session.delete) are audited; agent enrollment claims are audited without an
    actor_id and with details.actor_kind "agent". Password changes revoke every
    session of the affected user; renaming an account preserves its sessions.
    HTML responses use a self-only CSP with per-file SHA-256 hashes for inline
    scripts, data images, no inline styles, no objects or base URI, same-origin
    forms, frame-ancestors 'none' and X-Frame-Options DENY. HSTS max-age=31536000
    is sent only when the Server itself terminates TLS; TLS proxies must set HSTS.
    The data directory must be effective-user-owned and private (0700); SQLite,
    its sidecars and secrets.key must be owned regular 0600 files, never symlinks.
    Linux validates that the backing mount is local and writable.
    The main database and archives require schema 19 exactly; previous schemas
    are rejected without migration or automatic removal of existing files.
  license:
    name: GNU General Public License v3.0
    identifier: GPL-3.0
servers:
  - url: https://beacon.example.test
security:
  - session: []
paths:
  /api/public/v1/nodes:
    get:
      operationId: listPublicNodes
      security: []
      description: |
        Anonymous read of explicitly published nodes, identical with absent, valid
        or invalid session cookies. No session, Origin or CSRF token is required;
        no session is created or cleaned up and no CORS access is granted. The
        three exact /api/public/v1 endpoints bypass browser authentication.
        All responses, including errors, use Cache-Control: no-store.

        Includes only nodes with valid enabled public settings, a nonempty public
        name, internal status unknown, an active node credential and completed
        enrollment. Pending, disabled, deleted and unpublished nodes are excluded;
        malformed JSON or invalid public settings are excluded, not backfilled.
        Publication is revalidated before each candidate is projected; a concurrent
        withdrawal or deletion skips that candidate. Other read failures fail the
        entire request rather than returning a partial successful response.
        Disabling, deleting or withdrawing a node excludes it on the next request;
        information already delivered to visitors cannot be recalled.

        Orders candidates by creation time then node UUID, without exposing either
        field. Reads at most limit candidates plus one to determine has_more.
        next_offset advances by the number of candidates consumed, not the number
        of nodes returned, so concurrent withdrawal may yield a short or empty page
        with a next page. This is offset pagination, not a stable collection snapshot
        or a total node count. Invalid pagination parameters return 400. Only GET
        is supported; other methods return 405 with Allow: GET before authentication.

        Returns independently configured public text, four resource values, last_seen
        (server reception time), and four freshness states. Internal metadata, IDs,
        IPs, hostnames, credentials, installation/session IDs, runtime, raw reports,
        source metadata, disk paths and network names are never projected.
        Administrators remain responsible for secrets they enter into public text.
        generated_at is the projection clock for status and source freshness.

        Returns a snapshot frame. server_time is the response clock;
        data.generated_at is the projection clock, which may be cached for the
        effective web_update_interval_seconds (default 10, range 2–60).
        Visibility changes invalidate the cache immediately. Every outbound
        projection checks visibility before and after querying, up to three
        attempts; persistent churn returns 503 snapshot_busy, not an old page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Snapshot frame; an empty successful collection is data.nodes [], never null.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSnapshotFrame'}
        '400': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: Public visibility changed through all three projection attempts; code is snapshot_busy.
          headers:
            Retry-After:
              description: Effective browser update interval in seconds.
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/public/v1/stream:
    get:
      operationId: streamPublicNodes
      security: []
      description: |
        Anonymous server-sent-events stream of the same paginated public node
        projection returned by GET /api/public/v1/nodes. The limit and offset
        parameters have identical defaults and validation. No session, Origin or
        CSRF token is required, and the response is not cacheable.

        Every event is `message`; its data is one PublicLiveFrame JSON object.
        The first snapshot is immediate. Later semantic changes are coalesced to
        web_update_interval_seconds (default 10, range 2–60). Projection and
        response clocks alone do not produce another full snapshot. Quiet streams
        send heartbeat frames every ten seconds; heartbeats do not alter sample
        or reception timestamps. Periodic projections still detect source expiry
        and the 180-second offline boundary.

        Public text edits, publication additions, and first or post-revocation
        credential bindings remain on the ordinary update cadence.

        A committed withdrawal, disable, revoke or active credential replacement
        sends close:renew and ends the stream so the browser rereads the collection.
        Known-stale projections are never sent; persistent visibility churn or
        projection/write failure terminates the stream without an obsolete payload.
        Streams renew after 15 minutes. Shutdown attempts close:shutdown, then
        interrupts blocked writes and waits for tracked streams before draining
        ingestion. A disconnected or forcibly closed peer may receive no close frame.

        WebSocket and SSE share a global limit of 200 and four per resolved client
        IP; capacity is released once on exit. Excess streams receive 503
        stream_busy with Retry-After. Only GET is supported; other methods return
        405 with Allow: GET.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: UTF-8 message events carrying typed snapshots or control frames.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Accel-Buffering:
              schema: {type: string, const: no}
          content:
            text/event-stream; charset=utf-8:
              schema:
                type: string
                description: Each event is message; its compact JSON data matches PublicLiveFrame.
              examples:
                snapshot:
                  summary: Public snapshot frame
                  value: "event: message\ndata: {\"type\":\"snapshot\",\"server_time\":\"2026-01-01T00:00:00Z\",\"update_interval_seconds\":10,\"data\":{\"nodes\":[],\"has_more\":false,\"next_offset\":null,\"generated_at\":\"2026-01-01T00:00:00Z\"}}\n\n"
                heartbeat:
                  summary: Connection clock without new node data
                  value: "event: message\ndata: {\"type\":\"heartbeat\",\"server_time\":\"2026-01-01T00:00:10Z\",\"update_interval_seconds\":10}\n\n"
                close:
                  summary: Immediate renewal
                  value: "event: message\ndata: {\"type\":\"close\",\"server_time\":\"2026-01-01T00:15:00Z\",\"update_interval_seconds\":10,\"code\":\"renew\"}\n\n"
        '400': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: Shared WebSocket/SSE concurrency limit reached; code is stream_busy.
          headers:
            Retry-After:
              description: Delay in seconds before opening another stream.
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                code: stream_busy
                message: Too many public streams.
                request_id: 00000000-0000-4000-8000-000000000001
        default: {$ref: '#/components/responses/Error'}
  /api/public/v1/ws:
    get:
      operationId: websocketPublicNodes
      security: []
      description: |
        Read-only WebSocket for the same public page and PublicLiveFrame messages
        as HTTP/SSE. Pagination, pacing, visibility renewal, capacity and shutdown
        are shared. The raw Origin must exactly equal the configured canonical
        public_url; absent, multiple or different Origins are rejected before
        upgrade. Cookies are ignored and never select a private projection.

        Browser WebSocket APIs may automatically attach same-origin cookies;
        anonymous HTTP/SSE use credentials omit. Compression is disabled, the
        read limit is 1 KiB, application writes are rejected and every write has
        a ten-second deadline. No subscription commands, replay or delta protocol.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '101':
          description: HTTP/1.1 upgrade accepted; subsequent text messages match PublicLiveFrame.
          x-websocket-message-schema:
            $ref: '#/components/schemas/PublicLiveFrame'
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: Shared stream capacity unavailable; code is stream_busy.
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/session:
    post:
      operationId: login
      security: []
      description: |
        Requires the configured public Origin. Before database lookup and Argon2,
        direct-peer and peer/username token budgets bound computation; both must
        allow an attempt before either is charged. IPv4 peers are keyed by address
        and IPv6 peers by /64 prefix. Ports and forwarded headers do not change
        identity. The peer/username budget has burst 10 and refills one token per
        30 seconds. Failed password verification, including for unknown usernames,
        also charges a source-independent username-hash budget with burst 20 and
        one token per 60 seconds. That budget is deleted after successful login.
        Exhaustion rejects before Argon2, except that a peer which successfully
        logged into that username during the previous 24 hours may continue trying,
        preventing a remote attacker from locking out a user's usual network.
        Password work is serialized with at most eight waiters and a one-second
        queue deadline. Admission overload returns 429 with Retry-After of one second.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
                password: {type: string, x-minLengthBytes: 8, x-maxLengthBytes: 1024}
      responses:
        '200':
          description: Session established; Set-Cookie is __Host-orbitbeacon_session with Secure, HttpOnly, SameSite=Lax, Path=/ and a 12-hour expiry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Session revoked and cookie expired.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: currentSession
      responses:
        '200':
          description: Current authenticated session and stable CSRF token, recoverable in a new tab without rotating another tab's token. No session bearer credential is exposed. This read never writes; expired sessions are reclaimed by login and the hourly retention task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserSession'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/password:
    patch:
      operationId: changeOwnPassword
      description: |
        Only the current account can change its password; the current password proves ownership. Attempts
        are limited per user with burst 5 and one token per 60 seconds, charged
        before Argon2. An incorrect current password returns 400
        invalid_old_password and leaves the authenticated session valid. A missing
        or invalid session returns 401 unauthenticated. A successful change
        atomically revokes every session of this user, including the current
        session; log in again.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [old_password, new_password]
              properties:
                old_password: {type: string, x-maxLengthBytes: 1024}
                new_password: {type: string, x-minLengthBytes: 8, x-maxLengthBytes: 1024, examples: [天地玄黄]}
      responses:
        '204': {description: Password changed and all of this user's sessions revoked.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users:
    get:
      operationId: listUsers
      description: Available to every authenticated administrator; credential fields are never returned. Returns the complete, unpaginated user list.
      responses:
        '200':
          description: User collection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createUser
      description: Creates another equal administrator. Usernames are matched exactly without trimming or case folding. An existing username returns 409 username_conflict without creating an account. Unknown request fields return 400 invalid_json.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
                password: {type: string, x-minLengthBytes: 8, x-maxLengthBytes: 1024}
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getUser
      description: Available to every authenticated administrator; no credential fields.
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateUser
      description: Renames an administrator. Username is optional; omission leaves it unchanged. An existing exact username returns 409 username_conflict without changing the account or sessions. Renaming preserves all sessions, including the current one. Unknown request fields return 400 invalid_json. Password changes are available only at /api/v1/me/password with the current password.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
      responses:
        '200':
          description: Updated credential-free user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteUser
      description: Deletes an administrator and revokes all their sessions atomically. The last administrator cannot be deleted and returns 409 last_administrator without changing the account, sessions or audit history. Self deletion is allowed when another administrator remains; after 204 the current session is invalid.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: User deleted and sessions revoked.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups:
    get:
      operationId: listGroups
      description: Available to every authenticated administrator. Returns the complete, unpaginated group list.
      responses:
        '200':
          description: Group collection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createGroup
      description: Administrator only. Groups contain a name, not enrollment credentials or future policy settings.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        $ref: '#/components/requestBodies/GroupName'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getGroup
      description: Available to every authenticated administrator.
      responses:
        '200':
          description: Group found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: renameGroup
      description: Administrator only. Updates the name only.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        $ref: '#/components/requestBodies/GroupName'
      responses:
        '200':
          description: Renamed group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteGroup
      description: Administrator only. Atomically deletes the group and detaches its nodes, setting their group_id to null without deleting the nodes.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Group removed and nodes detached.}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-channels:
    get:
      operationId: listNotificationChannels
      description: Administrators may list channels. Secrets and full webhook URLs are never returned; secret_set and config.url_set indicate encrypted material is present.
      responses:
        '200':
          description: Channels ordered by creation time then ID; at most 20.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels: {type: array, items: {$ref: '#/components/schemas/NotificationChannel'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNotificationChannel
      description: Administrator only. Insertion and notification_channel.create audit commit together. Capacity returns 409 notification_channel_capacity_reached.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NotificationChannelPatch'
                - required: [name, kind, enabled, config]
      responses:
        '201':
          description: Channel created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getNotificationChannel
      description: Administrators may read channel metadata without revealing notification credentials.
      responses:
        '200':
          description: Channel without secret material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchNotificationChannel
      description: Administrator only. Omission retains fields. Webhook config.url is write-only and omission retains the encrypted URL; other config replaces the complete non-secret config. Secret empty string clears credentials; null is rejected. Kind cannot change. Update and notification_channel.update audit commit together.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationChannelPatch'}
      responses:
        '200':
          description: Channel updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNotificationChannel
      description: Administrator only. Deletes channel, routing and delivery records with notification_channel.delete audit in the same transaction.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Channel deleted.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-channels/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: testNotificationChannel
      description: Administrator only. Audits and reserves rate capacity before synchronous delivery (10 seconds maximum). Disabled channels may be tested. Unreadable credentials return 409 secret_unreadable with repair guidance. Transport failures return 200 with ok false and a safe error_code. No credentials or response bodies are returned.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error_code]
                additionalProperties: false
                properties:
                  ok: {type: boolean}
                  error_code: {type: string, description: Empty on success; safe category on failure.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      description: Administrators may read recent deliveries without payloads, credentials or remote response bodies. Ordered by created_at and ID descending; terminal rows retained for 30 days. Floods retain a summary row with coalesced_count.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: before
          in: query
          schema: {type: string}
          description: Opaque next_cursor from the preceding page.
      responses:
        '200':
          description: Delivery log page.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, has_more]
                properties:
                  deliveries: {type: array, items: {$ref: '#/components/schemas/NotificationDelivery'}}
                  has_more: {type: boolean}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      description: Administrators can read all rules. At most 200 rules exist, including disabled rules. Ordered by creation time then UUID.
      responses:
        '200':
          description: Rule collection.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: {type: array, items: {$ref: '#/components/schemas/AlertRule'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAlertRule
      description: Administrator only. Rule insertion and alert_rule.create audit insertion commit atomically. A 201 returns the rule; capacity 200 returns 409 alert_rule_capacity_reached.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRuleCreate'}
      responses:
        '201':
          description: Created rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alert-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAlertRule
      description: Administrators can read a rule. Missing rules return 404.
      responses:
        '200':
          description: Rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchAlertRule
      description: |
        Administrator only. Omitted members retain their previous values. Null is
        accepted only for scope_id, comparator and threshold. The merged rule must
        satisfy all create constraints. Changing channel_ids never resets pending timers or open episodes. Changing condition or scope resets pending
        evaluation and resolves any old episode on the next tick. Disabling also
        resolves open episodes on the next tick. Updates and alert_rule.update
        audit insertion commit atomically.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRulePatch'}
      responses:
        '200':
          description: Updated rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAlertRule
      description: Administrator only. Delete and alert_rule.delete audit insertion commit atomically. Event history survives deletion; open episodes resolve on the next tick.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Rule deleted.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alerts:
    get:
      operationId: listAlerts
      description: |
        Administrators can read alert episodes. Ordered by started_at
        DESC, id DESC with keyset pagination. Names are joined from current rules
        and nodes, falling back to event snapshots after deletion. Unknown,
        repeated or empty query parameters return 400. Resolved events are kept
        for 90 days after resolution with hourly bounded cleanup. Open events are
        never expired. Configured notification channels can deliver alert events.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema: {type: string, enum: [firing, resolved, all], default: all}
        - name: before
          in: query
          description: Opaque next_cursor from the previous page; canonical timestamp/UUID keyset position, strictly older than the last event. Invalid or empty cursors return 400.
          schema: {type: string, minLength: 90, maxLength: 90}
      responses:
        '200':
          description: Paginated alert episodes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, has_more]
                properties:
                  events: {type: array, items: {$ref: '#/components/schemas/AlertEvent'}}
                  has_more: {type: boolean}
                  next_cursor: {type: string, description: Present only when has_more is true; pass as before.}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alerts/summary:
    get:
      operationId: getAlertSummary
      description: Administrators can read firing counts and up to five newest firing episodes from one consistent read snapshot. Severity comes from the stored rule snapshot; missing or unrecognized severity counts as unknown. Newest episodes use the same fields as listAlerts, ordered by started_at DESC, id DESC.
      responses:
        '200':
          description: Firing alert summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertSummary'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAlertEvent
      description: Administrators can read one episode directly, without searching history pages. Uses the same current-name joins and deleted-source snapshot fallbacks as listAlerts. Query parameters are rejected. Reading does not mark any inbox notification read.
      responses:
        '200':
          description: Alert episode.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backups/exports:
    post:
      operationId: createBackupExport
      description: |
        Administrator only; requires Origin and CSRF. Accepts a background export
        of one or more independent categories. Configuration is never implicitly
        added. The committed task survives disconnects and page navigation.
        A single worker executes tasks; at most 32 queued/running tasks exist.
        No automatic download, cancellation or task-retry endpoint is provided.
        Query parameters are rejected. The resulting archive is .tar.gz.age;
        its independent recovery password must be saved separately by an admin.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categories]
              properties:
                categories: {$ref: '#/components/schemas/BackupCategories'}
      responses:
        '202':
          description: Queued export accepted; no plaintext password is returned.
          headers:
            Location:
              schema: {type: string, examples: [/api/v1/tasks/00000000-0000-4000-8000-000000000001]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupTask'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429':
          description: backup_queue_full; wait for an active task to finish before submitting another export.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backup-plans:
    get:
      operationId: listBackupPlans
      description: Available to every authenticated administrator. Credential-free plans ordered by created_at DESC, id DESC. Only limit and before are accepted; unknown, repeated, empty or malformed query parameters return 400 invalid_input. Timezone metadata describes the Server process, not the browser.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventBefore'
      responses:
        '200':
          description: Paginated backup plans and Server timezone metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlanPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBackupPlan
      description: |
        Administrator only; requires Origin and CSRF. New plans default to disabled,
        configuration only, Cron 0 3 * * *, and local retain_count 7. Object plans
        require complete credentials. Local paths must already exist, be writable,
        owned by the running user, mode 0700 and contain no symlinks; the Server
        does not create or chmod the selected directory. Object retention belongs
        to the provider; do not send retain_count. Saving does not test a connection.
        Query parameters and explicit null fields are rejected. Enabling schedules
        the next future run, without immediately replaying historical cycles.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupPlanCreate'}
      responses:
        '201':
          description: Saved plan without credential material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backup-plans/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getBackupPlan
      description: Administrator only. Returns no credentials or ciphertext. Query parameters are rejected. A missing plan returns 404 backup_plan_not_found; unreadable stored credentials return 409 secret_unreadable.
      responses:
        '200':
          description: Backup plan with next-run preview and latest task summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateBackupPlan
      description: |
        Administrator only; requires Origin and CSRF. Omitted fields, including
        individual destination fields, retain their values; explicit null is rejected.
        Kind cannot change. Omitted credentials retain the encrypted credentials.
        Replacement requires access_key_id and secret_access_key together; omitted
        session_token clears the old token. Never submit masked placeholders.
        Changing provider additionally requires endpoint, region and full replacement
        credentials. Enabling or changing Cron schedules the next future run;
        other edits preserve the existing next_run_at. Queued/running plan tasks
        cause 409 backup_plan_busy, including when disabling. Query parameters
        are rejected. Field validation returns 400 validation_failed with fields.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupPlanPatch'}
      responses:
        '200':
          description: Updated credential-free plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteBackupPlan
      description: Administrator only; requires Origin and CSRF. Does not delete history or any saved archives. A queued/running task causes 409 backup_plan_busy; missing plans return 404 backup_plan_not_found. Query parameters are rejected.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Plan deleted; archives and task history remain.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backup-plans/preview:
    post:
      operationId: previewBackupCron
      description: Administrator only; requires Origin and CSRF despite being pure computation. Returns three runs in the Server process timezone; no network access or persistence. Invalid Cron returns 400 validation_failed with fields.cron. Query parameters are rejected.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cron]
              properties:
                cron: {$ref: '#/components/schemas/BackupCron'}
      responses:
        '200':
          description: Next three runs and timezone metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupCronPreview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks:
    get:
      operationId: listBackupTasks
      description: Administrator only. Lists only backup/export tasks, ordered by created_at DESC, id DESC. Terminal tasks are visible for 90 days after completion; active tasks do not expire. Only limit and before are accepted; unknown, repeated, empty or malformed query parameters return 400 invalid_input. No passwords, credential material or internal staging paths are returned or decrypted.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventBefore'
      responses:
        '200':
          description: Safe task page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupTaskPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getBackupTask
      description: Administrator only. Direct safe detail even when absent from the current list page; no password decryption. Missing or no-longer-visible tasks return 404 task_not_found. Query parameters are rejected. Availability is evaluated at read time, independently of retention cleanup.
      responses:
        '200':
          description: Safe task detail with current download/password availability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupTask'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks/{id}/download:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: downloadBackupExport
      description: |
        Administrator session required; ordinary same-origin attachment download,
        not JSON or a public/presigned link. Only succeeded, non-restored manual
        exports have downloadable artifacts, valid until completion plus 24 hours.
        Local/object plan archives are not copied into the download area. The task
        UUID selects the file; result_location is display-only. Range and conditional
        requests use ServeContent. This route alone permits up to 30 minutes for
        writing; client cancellation stops reading. Query parameters are rejected.
      parameters:
        - name: Range
          in: header
          schema: {type: string}
          description: Optional HTTP byte-range request.
      responses:
        '200':
          $ref: '#/components/responses/BackupArchive'
        '206':
          $ref: '#/components/responses/BackupArchive'
        '304': {description: Not modified according to conditional request headers.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: artifact_not_ready; manual export has not succeeded or has no artifact expiry yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: artifact_expired or artifact_missing; also returned for scheduled-plan or restored-history tasks that have no local export artifact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '416': {description: Requested byte range is unsatisfiable; standard ServeContent response, not a JSON API error.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: revealBackupPassword
      description: |
        Administrator only; requires Origin and CSRF. Explicit audited plaintext
        password read; no request body is needed. GET/list/detail never decrypt it.
        Eligible only for non-restored succeeded tasks or failed tasks with
        storage_outcome_unknown, with complete archive name/hash/location and an
        unexpired stored password. An unknown storage result remains failed, not
        successful. Passwords expire 90 days after completion; save each separately.
        Passwords are not uploaded beside archives and cannot be recovered after
        loss of the original Server secrets unless independently saved. Query
        parameters are rejected. Audit records the task ID, never the password.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Explicit recovery password response.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPassword'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404':
          description: task_not_found or password_unavailable; includes prepublication failures and restored history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: secret_unreadable; the current Server key cannot decrypt the stored password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: password_expired; a task outside its history retention instead returns 404 task_not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications:
    get:
      operationId: listInboxNotifications
      description: |
        All administrators see shared task and alert notifications. Each account's
        read state is independent; new accounts can read retained shared events. Notifications are
        retained for 90 days. Ordered by created_at DESC, id DESC, with keyset
        pagination. Unknown, repeated, empty or malformed query parameters return
        400 validation_failed. GET never marks read and never returns passwords,
        credentials or internal sequence numbers. read_through covers ALL retained
        notifications in the same read transaction, not just this page or unread
        filter, and is the UUID at the greatest insertion sequence, not the greatest
        created_at or UUID. Use it unchanged for read-all.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventBefore'
        - name: unread
          in: query
          schema: {type: boolean, default: false}
          description: Only literal true and false are accepted; true filters to the current account's unread notifications.
      responses:
        '200':
          description: Inbox page and read-all watermark.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/summary:
    get:
      operationId: getInboxSummary
      description: Session required. Returns the current account's unread count and greatest insertion-sequence notification UUID in one read transaction, without marking read. This is inbox unread state, not a firing-alert count. Query parameters are rejected.
      responses:
        '200':
          description: Consistent unread summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxSummary'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getInboxNotification
      description: Session required. Missing notifications return 404 not_found. Returns an immutable safe snapshot even when its source task/alert has expired or been deleted; snapshot availability flags are historical, so fetch task detail for current availability. GET never marks read. Query parameters are rejected.
      responses:
        '200':
          description: Notification snapshot and current account's read flag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxNotification'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      operationId: markInboxNotificationRead
      description: Administrators may mark only their own notification read. Requires Origin and CSRF; no client-supplied user identity is accepted. Idempotent; missing notifications return 404 not_found. Only read true is supported. Query parameters are rejected.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read: {type: boolean, const: true}
      responses:
        '204': {description: Read state recorded for the current user only.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/read-all:
    post:
      operationId: markInboxNotificationsRead
      description: |
        Administrators may mark their own notifications read; requires
        Origin and CSRF. through must be a non-null read_through UUID previously
        returned by the list. The Server resolves that retained record's
        insertion sequence and marks only records at or below it. Newer
        insertions remain unread even with identical timestamps, smaller UUIDs or
        a backwards-moving clock. Missing or cleaned-up watermarks return
        404 not_found without marking anything. Invalid UUID returns 400 with
        fields.through. No client user ID is accepted. Query parameters are rejected.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [through]
              properties:
                through: {type: string, format: uuid}
      responses:
        '204': {description: Current account's notifications through the watermark marked read.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      description: Available to every authenticated administrator. Returns persisted events ordered by created_at DESC, id DESC. Use next_cursor as before for stable traversal when newer events arrive; before ignores offset after limit/offset validation. Details are JSON objects and contain no credentials.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: before
          in: query
          description: Opaque next_cursor from the previous page. Returns events strictly older than that event in the sort order and ignores offset. Invalid or empty cursors return 400 validation_failed.
          schema: {type: string, minLength: 90, maxLength: 90}
      responses:
        '200':
          description: Paginated audit events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
                  has_more: {type: boolean, description: Whether another event exists beyond this page.}
                  next_offset: {type: integer, minimum: 0, description: Present only when has_more is true. Continuation offset usable only when before is omitted. Cursor requests must continue with next_cursor because before ignores offset.}
                  next_cursor: {type: string, description: Present only when has_more is true. Opaque cursor for the last returned event; pass as before to fetch older events.}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes:
    get:
      operationId: listNodes
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Ordered by creation time then UUID; includes pending and disabled assets.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, has_more]
                properties:
                  nodes:
                    type: array
                    items: {$ref: '#/components/schemas/Node'}
                  has_more: {type: boolean, description: Whether another node exists beyond this page.}
                  next_offset: {type: integer, minimum: 0, description: Present only when has_more is true. Pass as offset for the next page.}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createPendingNode
      description: Administrator only. Capacity counts all nodes, including pending and disabled.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
      responses:
        '201':
          description: Persistent pending identity created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNode
      responses:
        '200':
          description: Credential-free node view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateNodeMetadata
      description: Administrator only. Omitted fields remain unchanged; null string fields also remain unchanged. Empty notes/region/provider strings clear those fields, group_id null detaches the group and tags [] clears all tags. Metadata changes do not replace node credentials or claim agent activity.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: [string, 'null'], x-minLengthBytes: 1, x-maxLengthBytes: 255, description: Non-whitespace name; null leaves unchanged.}
                notes: {type: [string, 'null'], description: Empty string clears; null leaves unchanged.}
                region: {type: [string, 'null'], description: Empty string clears; null leaves unchanged.}
                provider: {type: [string, 'null'], description: Empty string clears; null leaves unchanged.}
                group_id:
                  type: [string, 'null']
                  format: uuid
                  description: Existing group UUID, or null to clear membership.
                tags:
                  type: [array, 'null']
                  uniqueItems: true
                  items: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255, description: Non-whitespace tag; strings are not trimmed or normalized.}
                  description: Replaces all tags; [] clears and null leaves unchanged. Duplicate exact strings are rejected. Responses sort tags lexicographically.
      responses:
        '200':
          description: Complete updated node metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNode
      description: Administrator only. Atomically revoke identity, cancel active queued work and delete the asset. Update results retain its ID.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
        - name: confirm
          in: query
          required: true
          schema: {type: boolean, const: true}
      responses:
        '204': {description: Asset removed and identity revoked.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/history:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodeHistory
      description: Available to every authenticated administrator. Best-effort history, flushed about once per minute. Missing or failed measurements and gaps produce no points. Network rates sum successful interfaces. Disk percentage uses total used bytes divided by total capacity across successful selected disks. Both query parameters are required exactly once; unknown parameters are rejected. Ranges 1h and 6h use 1-minute buckets, 24h and 7d use 5-minute buckets, and 30d uses 1-hour buckets. Rollup averages are weighted by measurement count. A disabled history store returns an empty points array. Unknown nodes return node_not_found.
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [cpu_percent, memory_used_percent, swap_used_percent, load1, disk_used_percent, net_rx_bytes_per_second, net_tx_bytes_per_second]
        - name: range
          in: query
          required: true
          schema: {type: string, enum: [1h, 6h, 24h, 7d, 30d]}
      responses:
        '200':
          description: Ascending UTC bucket timestamps; no null or synthetic gap points. An intersecting bucket at the start of the range may precede the exact cutoff by less than one step.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricHistory'}
        '400':
          description: validation_failed for invalid or missing query parameters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/traffic:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodeTraffic
      description: Available to every authenticated administrator. Returns UTC daily traffic for the last N days including today and totals for the current UTC billing cycle. The optional days parameter defaults to 30 and must be supplied exactly once as an integer from 1 through 400; unknown parameters are rejected. Daily results merge retained daily rollups with hourly data and include only days with traffic. Unknown nodes return node_not_found.
      parameters:
        - name: days
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 400, default: 30}
      responses:
        '200':
          description: Traffic totals. Byte counters are canonical unsigned decimal strings. Cycle end is exclusive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficSummary'}
        '400':
          description: validation_failed for malformed, repeated, unknown or out-of-range query parameters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/probes:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodeProbes
      description: Available to every authenticated administrator. Returns one entry per currently configured probe target in desired-config order; results for targets removed from configuration are not returned. Latest results and hourly counters are persisted on the coalesced ingest transaction cadence, so responses may lag reports by up to about 30 seconds. The 24-hour window includes UTC hours greater than or equal to the current UTC hour minus 23 hours, with no separate upper cutoff. Unknown nodes return node_not_found.
      responses:
        '200':
          description: Current service-probe states and 24-hour uptime aggregates.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeSummary'}
        '404': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/latest:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodeLatest
      description: Available to every authenticated administrator. Returns the latest accepted in-memory report for the current node identity, without credentials, run_generation or session_id. A missing node, missing report since server startup, disabled node or invalidated identity returns 404 node_not_found. Values are the latest sample and may be stale; received_at is server reception time, not a liveness guarantee. System is null when the report omitted it; agent_version remains available on the persisted node view.
      responses:
        '200':
          description: Latest private telemetry sample.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LatestSample'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/public-settings:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodePublicSettings
      description: Available to every authenticated administrator. Returns the independent public settings, including for pending or disabled nodes; no values are filled from internal node metadata.
      responses:
        '200':
          description: Complete public settings; legacy empty settings default to disabled and empty text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchNodePublicSettings
      description: |
        Administrator only; requires the trusted configured Origin and this
        session's CSRF token. Omitted or null fields remain unchanged; empty
        strings clear text. Text is trimmed before enforcing UTF-8 byte limits;
        invalid UTF-8 and control characters are rejected, not removed by trimming.
        The merged settings must have a nonempty public name when enabled is true. Invalid
        settings return 400 validation_failed with field keys name, region and/or
        provider, leaving all previous settings unchanged. Unknown fields are rejected.

        Reads, merges, validates, persists and inserts the actor-attributed
        node.public_settings.patch audit event in one transaction; audit details
        are {} and audit insertion failure rolls back the settings. A valid
        unchanged patch is also audited. Changes do not modify internal metadata
        or credentials. Disabling publication preserves the public text for reuse.
        Settings may be saved before enrollment or while disabled, but the node
        is not shown until enrolled and enabled; saving does not establish online
        status or prove a report has arrived.

        Publishing exposes the configured name, region and provider plus CPU,
        memory percentage, one-minute load and uptime when valid. Public text is
        intentionally independent and defaults to empty, never private metadata.
        Do not enter IP addresses, hostnames, domains or credentials. No automatic
        secret detection or redaction is promised.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicSettingsPatch'}
      responses:
        '200':
          description: Complete saved public settings, not a claim that the node is online.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/credential:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    delete:
      operationId: revokeNodeCredential
      description: |
        Administrator only; requires the trusted configured Origin and this
        session's CSRF token. Clears credential, installation binding, runtime,
        last_seen, system, report identity and probe observations in one audited
        transaction. Metadata, traffic billing, accumulated traffic, first enrollment
        and public settings are kept. The node becomes pending (disabled stays
        disabled) and disappears from the public page; its agent receives 401 on
        the next request. Issue a new single-node enrollment ticket to bind a
        fresh installation. Revoking an already revoked node succeeds.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Credential revoked}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/runtime:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getAgentRuntime
      description: Last accepted runtime for the current credential, never a server desired configuration. Null before a valid report; credential replacement or revocation clears observations. The removed /config route returns 404.
      responses:
        '200':
          description: Agent-owned runtime observation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runtime]
                properties:
                  runtime:
                    oneOf:
                      - {$ref: '#/components/schemas/RuntimeSettings'}
                      - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/traffic-settings:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getTrafficSettings
      responses:
        '200':
          description: Server-owned billing settings; never sent to the agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficSettings'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchTrafficSettings
      description: Omitted fields remain unchanged; null, unknown keys and wrong types are rejected. Changed values and node.traffic_settings.patch audit commit together; unchanged values create no audit event.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                billing_day: {type: integer, minimum: 1, maximum: 28}
                quota_bytes: {$ref: '#/components/schemas/DecimalCounter'}
      responses:
        '200':
          description: Saved billing settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficSettings'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/batch:
    post:
      operationId: batchNodes
      description: Administrator only. Explicit unique UUIDs required, no implicit all-nodes selection. Each node is a separate transaction and results preserve request order. Disabling keeps the credential but rejects the node's reports and credential recovery with 403 node_disabled until it is enabled again.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node_ids, action]
              properties:
                node_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: {type: string, format: uuid}
                action: {type: string, enum: [disable, enable, delete]}
                confirm: {type: boolean, default: false, description: Must be true for delete.}
      responses:
        '200':
          description: One result per selected ID, including missing nodes and storage failures.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [node_id, status]
                      properties:
                        node_id: {type: string, format: uuid}
                        status: {type: string, enum: [succeeded, failed]}
                        error_code: {type: string, enum: [node_not_found, storage_error]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/enrollments:
    get:
      operationId: listEnrollments
      description: Administrator only. Returns metadata without token plaintext or hashes.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated enrollment metadata.
          content:
            application/json:
              schema:
                type: object
                required: [enrollments, has_more]
                properties:
                  enrollments: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
                  has_more: {type: boolean, description: Whether another enrollment exists beyond this page.}
                  next_offset: {type: integer, minimum: 0, description: Present only when has_more is true. Pass as offset for the next page.}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createEnrollment
      description: Administrator only. A node-bound ticket expires in 15 minutes and has one claim; a batch ticket expires in 30 minutes and has at most 100 claims, constrained by global node capacity. Only this response exposes the raw token.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one UUID target is required. Omitted mode is inferred from the target; an explicit mode must agree with it.
              properties:
                node_id: {type: string, format: uuid}
                group_id: {type: string, format: uuid}
                mode: {type: string, enum: [single, batch]}
              oneOf:
                - required: [node_id]
                  not: {required: [group_id]}
                  properties:
                    mode: {const: single}
                - required: [group_id]
                  not: {required: [node_id]}
                  properties:
                    mode: {const: batch}
      responses:
        '201':
          description: Ticket plus one-time plaintext token.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Enrollment'}
                  - {type: object, required: [token], properties: {token: {type: string, writeOnly: false}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/enrollments/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getEnrollment
      description: Administrator only; no credential material.
      responses:
        '200':
          description: Ticket metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeEnrollment
      description: Administrator only. Immediately blocks all claims and otherwise-valid exact retries.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Revoked.}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/enroll:
    post:
      operationId: enrollAgent
      security: [{enrollmentBearer: []}]
      description: Identity must be saved before sending. Exact successful requests can retry for 24 hours from claim even after natural expiry while the claimed credential remains active; revocation or later credential replacement blocks retry. Different installation/token binding returns enrollment_conflict. A new node-bound ticket can rotate the same installation credential atomically, invalidating the old credential. Changing an existing credential requires previous_node_token to match the current credential inside the claim transaction; a stale/missing proof returns enrollment_conflict without changing credentials, ownership fences, uses or receipts. An already-current candidate remains idempotent. Clients reload durable identity, durably stage a fresh 256-bit candidate separately from the active token, send the active token as the CAS proof, retain the candidate for exact retries across restarts/failures, and promote only after confirmed acceptance. Upgrade the Server before Agents that send rotation proofs. Ticketless recovery uses POST /api/agent/v1/recover, including generation-zero identities. A read-only ticket lookup precedes body reads and writer transactions, with all authorization repeated atomically during claim. Invalid/missing credentials use bounded direct-peer-IP and global token buckets (bursts 32 and 256, one token/second refill); forwarded headers and source ports do not select buckets. Apparently usable tickets bypass invalid buckets. Peer state is capped at 1024 entries with oldest-entry eviction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, installation_id, node_token]
              properties:
                protocol_version: {const: 1}
                installation_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
                node_token: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
                previous_node_token:
                  type: string
                  writeOnly: true
                  x-minLengthBytes: 32
                  x-maxLengthBytes: 256
                  description: Exact current credential proof, required only when replacing an already-enrolled credential. Never returned or logged.
                system:
                  allOf:
                    - {$ref: '#/components/schemas/System'}
                  unevaluatedProperties: false
      responses:
        '200':
          description: Durable server-selected binding.
          content:
            application/json:
              schema:
                type: object
                required: [node_id, server_time]
                properties:
                  node_id: {type: string, format: uuid}
                  server_time: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/enroll/check:
    post:
      operationId: checkAgentEnrollmentClaim
      security: [{enrollmentBearer: []}]
      description: Read-only receipt inspection for a missing local ticket association. Uses the same pre-body ticket admission as enrollment. One SQLite read snapshot verifies revocation, natural expiry/quota for an unclaimed ticket, and the inclusive 24-hour retry window plus exact active credential for a claimed receipt. Does not create nodes, consume tickets, rotate credentials, reset fences, refresh liveness or emit success audits. A fresh ticket returns claimed:false without a node_id; an exact active receipt returns claimed:true with its node_id. Wrong/deleted/superseded receipts conflict. Maximum body size is 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, installation_id, node_token]
              properties:
                protocol_version: {const: 2, description: Receipt inspection version; enrollment and reports remain version 1. Version 1 checks are rejected with 426 before any claim.}
                installation_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
                node_token: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
      responses:
        '200':
          description: Receipt state; the session/node credential is never returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [claimed, credential_state, server_time]
                properties:
                  claimed: {type: boolean}
                  credential_state:
                    type: string
                    enum: [active, unbound]
                    description: Exact credential/installation binding in the same read snapshot. Missing/unknown states are rejected by clients before staging.
                  node_id: {type: string, format: uuid}
                  server_time: {type: string, format: date-time}
                oneOf:
                  - properties: {claimed: {const: true}, credential_state: {const: active}}
                    required: [node_id]
                  - properties: {claimed: {const: false}}
                    not: {required: [node_id]}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/recover:
    post:
      operationId: recoverAgentEnrollment
      security: [{nodeBearer: []}]
      description: Side-effect-free confirmation of a saved node credential and its installation binding, including before the first collection run. Unknown credentials are rejected before body reads. A single read verifies the exact credential and installation together; no liveness, generation, session, report admission, or configuration acknowledgement is updated. A disabled node receives 403 node_disabled. Requests never contain a target node_id. Clients try the durable pending credential first and then the active credential only after 401, validate the returned identity, and promote pending only after confirmation. GET and HEAD are unsupported. Maximum body size is 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
      responses:
        '200':
          description: Authenticated installation binding, without telemetry mutation.
          content:
            application/json:
              schema:
                type: object
                required: [node_id, server_time]
                properties:
                  node_id: {type: string, format: uuid}
                  server_time: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/report:
    post:
      operationId: reportAgent
      security: [{nodeBearer: []}]
      description: POST-only telemetry; recovery uses /api/agent/v1/recover without a report. Target comes exclusively from Bearer authentication. Maximum 64 KiB; one request/second per node, burst three. Authentication/admission precede body reads. Processing rechecks the exact credential transactionally. New generations replace the durable session fence; older generations or same-generation different sessions return 409. Duplicate/old sequences cannot replace latest, last_seen, runtime or re-add removed probe targets. Latest/sequence state is process-local, not durable history. Runtime is required and agent-owned; target results must belong to this report's runtime. Accepted runtime changes persist with existing identity fences and remove obsolete probe observations. Disabled nodes receive 403 before body reads. No desired settings are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Report'}
      responses:
        '200':
          description: Accepted live sequence. Traffic acknowledgements cover committed counters and expired entries discarded by the server.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportResponse'}
        '413': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '429':
          description: Rate limited.
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-orbitbeacon_session
    enrollmentBearer:
      type: http
      scheme: bearer
      description: Short-lived enrollment secret, never put in URLs.
    nodeBearer:
      type: http
      scheme: bearer
      description: Per-node credential, stored only as SHA-256 server-side.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: Must match the canonical configured HTTPS public origin (DNS lowercase, normalized IPv6, default port 443 omitted), never request Host or forwarded headers.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      description: Stable token returned by this session's login or GET /api/v1/me.
    NodeID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    EventBefore:
      name: before
      in: query
      description: Opaque next_cursor from the previous page; canonical created_at/UUID keyset position. Returns records strictly older in created_at DESC, id DESC order. Must be supplied once and nonempty; invalid cursors return 400.
      schema: {type: string, minLength: 90, maxLength: 90}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  requestBodies:
    GroupName:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
  responses:
    BackupArchive:
      description: Encrypted .tar.gz.age attachment, or a requested byte range of it. No recovery password is included.
      headers:
        Content-Disposition:
          schema: {type: string}
          description: attachment with the task's archive filename.
        Cache-Control:
          schema: {type: string, const: no-store}
        X-Content-Type-Options:
          schema: {type: string, const: nosniff}
        Accept-Ranges:
          schema: {type: string, const: bytes}
        Content-Range:
          schema: {type: string}
          description: Present on partial responses.
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    Error:
      description: Structured failure. Invalid JSON/input returns 400, invalid credentials 401, browser Origin/CSRF failures or disabled-node agent requests 403, missing resources 404, plan-busy/secret/enrollment/identity/username or last-administrator conflicts 409, expired or missing backup artifacts/passwords 410, bodies above 64 KiB 413, unsupported agent protocol 426, rate limiting or backup queue capacity 429, and retryable SQLite contention 503 storage_busy. Unsupported methods return 405 with Allow before authentication; unknown API routes return 404. No API error returns the SPA shell.
      headers:
        X-Request-ID:
          schema: {type: string, format: uuid}
        Allow:
          description: Present on 405; lists supported methods for the route.
          schema: {type: string}
        Retry-After:
          description: Present on rate-limiting 429 and retryable storage 503; delay in seconds. backup_queue_full does not include this header.
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    BackupCategories:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: Independent categories; configuration is never added implicitly. Responses use configuration, monitoring, events order. Configuration contains password hashes, persistent Agent identity, credentials and the matching secrets.key, but not deployment configuration, TLS certificates or executables. Monitoring includes persisted observations and metric history, not in-memory reports. Events exclude historical backup passwords, pending deliveries/tasks and download artifacts. Only committed data is snapshotted; main and metrics databases are individually consistent, not one cross-database instant.
      items: {type: string, enum: [configuration, monitoring, events]}
    BackupCron:
      type: string
      default: '0 3 * * *'
      description: Exactly five crontab fields (minute hour day-of-month month day-of-week), interpreted in the Server process timezone captured at startup. Supports lists, ranges, steps and English month/weekday names; Sunday is 0 or 7. Preserves crontab day-of-month/day-of-week OR semantics. No seconds, ?, @ aliases, TZ/CRON_TZ prefix or shell commands. DST gaps are skipped and repeated local times can produce distinct UTC runs. Missed cycles coalesce into one task, not a replay queue.
    BackupTimezone:
      type: object
      required: [timezone_name, utc_offset_seconds, server_time]
      properties:
        timezone_name: {type: string, description: 'Server timezone display label; may be an IANA name or current zone abbreviation, not necessarily an IANA identifier. Never the browser timezone.'}
        utc_offset_seconds: {type: integer, description: Server timezone's current offset at server_time; do not use it to infer offsets for future dates.}
        server_time: {type: string, format: date-time, description: Current Server time in UTC.}
    BackupNextRun:
      type: object
      additionalProperties: false
      required: [at, local]
      properties:
        at: {type: string, format: date-time, description: Run instant in UTC.}
        local: {type: string, format: date-time, description: Server-local RFC3339 representation with the actual offset for this run; display directly rather than converting to browser timezone.}
    BackupCronPreview:
      allOf:
        - $ref: '#/components/schemas/BackupTimezone'
        - type: object
          required: [next_runs]
          properties:
            next_runs: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/BackupNextRun'}}
      unevaluatedProperties: false
    BackupLocalDestinationPatch:
      type: object
      additionalProperties: false
      properties:
        path: {type: string, minLength: 1, description: 'Existing absolute private writable directory, owned by the Server user and mode 0700, without symlinks. Archives use an independent orbitbeacon-<plan_id> subdirectory. Custom systemd paths require an administrator-managed writable unit drop-in; containers require a writable mounted path.'}
    BackupLocalDestination:
      allOf:
        - $ref: '#/components/schemas/BackupLocalDestinationPatch'
        - required: [path]
    BackupObjectDestinationPatch:
      type: object
      additionalProperties: false
      description: |
        One S3-protocol target. COS/OSS/S3 use virtual-host addressing; R2 uses
        region auto and path-style; s3_compatible defaults to path-style.
        Default endpoints for nonempty region are https://cos.<region>.myqcloud.com,
        https://s3.oss-<region>.aliyuncs.com and https://s3.<region>.amazonaws.com.
        R2 requires its account endpoint. Official OSS s3.oss-* endpoints use
        virtual-host addressing; custom OSS endpoints must already be bucket-bound
        CNAMEs with valid TLS and are used without adding bucket to host or path.
        Provider profiles do not imply verification against a real cloud account.
      properties:
        provider: {type: string, enum: [cos, oss, r2, s3, s3_compatible]}
        endpoint: {type: string, format: uri, description: 'HTTPS origin only, with optional port 1–65535; no path (including trailing slash), userinfo, query or fragment. TLS certificate verification is required; no proxy or redirects.'}
        region: {type: string, minLength: 1, description: 'Required nonblank region; defaults to auto for R2, which requires exactly auto.'}
        bucket: {type: string, minLength: 1, description: 'Nonblank bucket; no slash, backslash, CR, LF or NUL. COS bucket includes APPID.'}
        prefix: {type: string, default: '', description: 'Empty or safe relative slash-separated path; no empty/dot/dot-dot components, backslashes or control characters. Object key is <prefix>/orbitbeacon/<plan_id>/<archive_name>, without a leading slash for empty prefix.'}
        path_style: {type: boolean, description: 'Must be false for cos/oss/s3 and true for r2; defaults true for s3_compatible and r2, false otherwise.'}
        allow_private_networks: {type: boolean, default: false, description: 'Explicitly permits private global-unicast addresses; still rejects loopback, link-local, metadata, non-global-unicast and mixed permitted/forbidden DNS answers. Applies to the final virtual-host hostname too.'}
    BackupObjectDestination:
      allOf:
        - $ref: '#/components/schemas/BackupObjectDestinationPatch'
        - required: [provider, endpoint, region, bucket, prefix, path_style, allow_private_networks]
    BackupObjectCredentials:
      type: object
      additionalProperties: false
      required: [access_key_id, secret_access_key]
      description: Write-only full replacement, encrypted at rest. Both keys must be nonblank and unmasked; CR, LF and NUL are rejected. No default cloud credential chain is consulted. Never included in a destination, task or inbox response.
      properties:
        access_key_id: {type: string, minLength: 1, writeOnly: true}
        secret_access_key: {type: string, minLength: 1, writeOnly: true}
        session_token: {type: string, writeOnly: true, description: Optional; omission during a credential replacement clears the previous token.}
    BackupPlanPatch:
      type: object
      additionalProperties: false
      description: Omission preserves existing values; explicit null is rejected. Destination fields merge individually. The final merged plan must satisfy its kind/provider constraints; local plans cannot have credentials and object plans cannot have retain_count.
      properties:
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 100, description: 'Nonblank valid UTF-8 text, without control characters.'}
        enabled: {type: boolean, default: false}
        kind: {type: string, enum: [local, object], description: Immutable after creation.}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        cron: {$ref: '#/components/schemas/BackupCron'}
        destination:
          anyOf:
            - $ref: '#/components/schemas/BackupLocalDestinationPatch'
            - $ref: '#/components/schemas/BackupObjectDestinationPatch'
        retain_count: {type: integer, minimum: 1, maximum: 1000, default: 7, description: 'Local only; remove oldest own archives only after successful publication. Remote retention is managed by provider lifecycle rules.'}
        credentials: {$ref: '#/components/schemas/BackupObjectCredentials'}
    BackupPlanCreate:
      allOf:
        - $ref: '#/components/schemas/BackupPlanPatch'
        - required: [name, kind, destination]
        - oneOf:
            - properties:
                kind: {const: local}
                destination: {$ref: '#/components/schemas/BackupLocalDestination'}
              not: {required: [credentials]}
            - required: [credentials]
              properties:
                kind: {const: object}
                destination:
                  allOf:
                    - $ref: '#/components/schemas/BackupObjectDestinationPatch'
                    - required: [provider, bucket]
                    - if:
                        properties:
                          provider: {const: r2}
                      then:
                        required: [endpoint]
                        properties:
                          region: {const: auto}
                          path_style: {const: true}
                      else:
                        required: [region]
                    - if:
                        properties:
                          provider: {const: s3_compatible}
                      then:
                        required: [endpoint]
                    - if:
                        properties:
                          provider: {enum: [cos, oss, s3]}
                      then:
                        properties:
                          path_style: {const: false}
              not: {required: [retain_count]}
    BackupPlanTaskSummary:
      type: object
      additionalProperties: false
      required: [id, state, created_at, finished_at, error_code, warning_code]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/BackupTaskState'}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        error_code: {$ref: '#/components/schemas/BackupTaskErrorCode'}
        warning_code: {$ref: '#/components/schemas/BackupTaskWarningCode'}
    BackupPlan:
      type: object
      additionalProperties: false
      required: [id, name, enabled, kind, categories, cron, destination, retain_count, next_run_at, created_at, updated_at, credentials_set, session_token_set, next_runs, last_task]
      description: Safe plan projection; never contains access keys, secret tokens or ciphertext. Restoring configuration disables all restored plans. Edits/deletion do not change already captured task destinations or credentials.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        kind: {type: string, enum: [local, object]}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        cron: {$ref: '#/components/schemas/BackupCron'}
        destination:
          oneOf:
            - $ref: '#/components/schemas/BackupLocalDestination'
            - $ref: '#/components/schemas/BackupObjectDestination'
        retain_count: {type: [integer, 'null'], minimum: 1, maximum: 1000, description: Local retention count; null for object storage.}
        next_run_at: {type: [string, 'null'], format: date-time, description: Persisted UTC due time; null when disabled. An overdue time remains until coalesced work can be queued.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        credentials_set: {type: boolean}
        session_token_set: {type: boolean}
        next_runs: {type: array, minItems: 3, maxItems: 3, description: 'Enabled plans start at persisted next_run_at, including overdue work. Disabled plans show a prospective Cron preview.', items: {$ref: '#/components/schemas/BackupNextRun'}}
        last_task:
          oneOf:
            - $ref: '#/components/schemas/BackupPlanTaskSummary'
            - type: 'null'
    BackupPlanPage:
      allOf:
        - $ref: '#/components/schemas/BackupTimezone'
        - type: object
          required: [plans, has_more, next_cursor]
          properties:
            plans: {type: array, items: {$ref: '#/components/schemas/BackupPlan'}}
            has_more: {type: boolean}
            next_cursor: {type: [string, 'null'], description: 'Continuation cursor, or null on the last page.'}
      unevaluatedProperties: false
    BackupTaskKind:
      type: string
      enum: [backup_export, backup_local, backup_remote]
    BackupTaskState:
      type: string
      enum: [queued, running, succeeded, failed]
      description: interrupted and restore_interrupted are failed error codes, never additional states.
    BackupTaskErrorCode:
      type: string
      description: Safe machine code, empty without failure. Never raw SQL/filesystem/SDK errors or credential-bearing URLs. Clients should tolerate future codes.
      examples: ['', snapshot_failed, history_unavailable, archive_too_large, disk_full, storage_permission_denied, storage_unreachable, storage_auth_failed, storage_upload_failed, secret_unreadable, interrupted, restore_interrupted, internal_error]
    BackupTaskWarningCode:
      type: string
      description: Empty without warning. storage_outcome_unknown means publication may have occurred but could not be confirmed; task remains failed and the archive metadata/password may allow recovery. retention_cleanup_failed means successful local publication but retention deletion needs attention.
      examples: ['', storage_outcome_unknown, retention_cleanup_failed]
    BackupTaskDestination:
      type: object
      additionalProperties: false
      required: [plan_name, actor_name, target]
      description: Safe immutable source/target snapshot, independent of later plan or user edits/deletion.
      properties:
        plan_name: {type: string, description: Empty for manual exports.}
        actor_name: {type: string, description: Empty for scheduled plans.}
        target:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [path, retain_count]
              properties:
                path: {type: string}
                retain_count: {type: integer, minimum: 1, maximum: 1000}
            - $ref: '#/components/schemas/BackupObjectDestination'
    BackupTaskFields:
      type: object
      properties:
        id: {type: string, format: uuid, description: Also the archive manifest archive_id and recovery-info archive_id; no second archive identifier.}
        kind: {$ref: '#/components/schemas/BackupTaskKind'}
        state: {$ref: '#/components/schemas/BackupTaskState'}
        phase: {type: string, enum: ['', snapshot, packaging, storing], description: Packaging streams compression and encryption together; no estimated percentage.}
        plan_id: {type: [string, 'null'], format: uuid}
        actor_id: {type: [string, 'null'], format: uuid}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        destination: {$ref: '#/components/schemas/BackupTaskDestination'}
        scheduled_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        artifact_name: {type: [string, 'null'], description: orbitbeacon-<UTC YYYYMMDDTHHMMSSZ>-<task UUID>.tar.gz.age.}
        artifact_bytes: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$', description: 'Final encrypted archive size as a decimal string, never a JSON number.'}
        artifact_sha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$', description: SHA-256 of the final encrypted archive.}
        artifact_expires_at: {type: [string, 'null'], format: date-time, description: 'Manual download expiry, normally completion plus 24 hours; null for scheduled/restored history.'}
        result_location: {type: [string, 'null'], description: 'Display-only local archive path or exact remote object key within destination.target.bucket; not credentials, an internal staging path, a browser download URL or a presigned link.'}
        password_expires_at: {type: [string, 'null'], format: date-time, description: Completion plus 90 days; active tasks have no expiry. Restored event history has no recoverable password.}
        error_code: {$ref: '#/components/schemas/BackupTaskErrorCode'}
        warning_code: {$ref: '#/components/schemas/BackupTaskWarningCode'}
        restored: {type: boolean, description: Restored history retains archive metadata but has neither downloadable artifact nor recovery password.}
        download_available: {type: boolean, description: 'True only for a succeeded, non-restored, unexpired manual export whose private artifact can safely be opened now.'}
        password_available: {type: boolean, description: 'True only for a non-restored succeeded task or failed task with storage_outcome_unknown, with complete archive name/hash/location, unexpired encrypted password and password expiry. Does not prove the current key can decrypt it; explicit POST can still return secret_unreadable.'}
    BackupTask:
      allOf:
        - $ref: '#/components/schemas/BackupTaskFields'
        - required: [id, kind, state, phase, plan_id, actor_id, categories, destination, scheduled_at, created_at, started_at, finished_at, artifact_name, artifact_bytes, artifact_sha256, artifact_expires_at, result_location, password_expires_at, error_code, warning_code, restored, download_available, password_available]
      unevaluatedProperties: false
      description: Credential-free task projection. Never includes password plaintext/ciphertext, input credentials, artifact cleanup bookkeeping or internal work directories. Ordinary GET has no secret-read side effect.
    BackupTaskPage:
      type: object
      additionalProperties: false
      required: [tasks, has_more, next_cursor]
      properties:
        tasks: {type: array, items: {$ref: '#/components/schemas/BackupTask'}}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null'], description: 'Continuation cursor, or null on the last page.'}
    BackupPassword:
      type: object
      additionalProperties: false
      required: [password, archive_name, archive_sha256, password_expires_at]
      properties:
        password: {type: string, pattern: '^[A-Za-z0-9]{16}$', description: Independently generated high-entropy archive password; returned only by an explicit authorized POST.}
        archive_name: {type: string}
        archive_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        password_expires_at: {type: string, format: date-time}
    InboxTaskSnapshot:
      allOf:
        - $ref: '#/components/schemas/BackupTaskFields'
        - type: object
          required: [id, kind, state, phase, plan_id, actor_id, categories, destination, scheduled_at, created_at, started_at, finished_at, artifact_name, artifact_bytes, artifact_sha256, artifact_expires_at, result_location, password_expires_at, error_code, warning_code, restored, download_available, password_available, has_password]
          properties:
            has_password: {type: boolean, description: Historical availability-only indication captured at completion; never the password.}
      unevaluatedProperties: false
      description: Immutable safe completion snapshot; availability fields are not recomputed on inbox reads.
    InboxRestoreInterruptedSnapshot:
      type: object
      additionalProperties: false
      required: [kind, categories, state, phase, error_code, warning_code, finished_at]
      description: Minimal safe notification produced when offline restore interrupts retained queued/running work. Resolve its task using the outer source_id if still available.
      properties:
        kind: {$ref: '#/components/schemas/BackupTaskKind'}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        state: {type: string, const: failed}
        phase: {type: string, enum: ['', snapshot, packaging, storing]}
        error_code: {type: string, const: restore_interrupted}
        warning_code: {$ref: '#/components/schemas/BackupTaskWarningCode'}
        finished_at: {type: string, format: date-time}
    InboxAlertSnapshot:
      type: object
      additionalProperties: false
      required: [rule_id, rule_name, node_id, node_name, metric, severity, transition, value, started_at, resolved_at]
      description: Immutable projection at the firing/resolved transition; survives deleted source entities. Created independently of external notification delivery and contains no channel credentials.
      properties:
        rule_id: {type: string, format: uuid}
        rule_name: {type: string}
        node_id: {type: string, format: uuid}
        node_name: {type: string}
        metric: {type: string}
        severity: {type: string}
        transition: {type: string, enum: [firing, resolved]}
        value: {type: [number, 'null']}
        started_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
    InboxNotification:
      type: object
      additionalProperties: false
      required: [id, kind, source_id, transition, severity, created_at, details, read]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [task, alert]}
        source_id: {type: string, description: Source task or alert episode identifier; may no longer resolve.}
        transition: {type: string, enum: [succeeded, failed, firing, resolved]}
        severity: {type: string}
        created_at: {type: string, format: date-time, description: 'Actual notification creation time, not the beginning of an alert condition.'}
        details:
          oneOf:
            - $ref: '#/components/schemas/InboxTaskSnapshot'
            - $ref: '#/components/schemas/InboxRestoreInterruptedSnapshot'
            - $ref: '#/components/schemas/InboxAlertSnapshot'
        read: {type: boolean, description: Read flag for the authenticated user only.}
    InboxPage:
      type: object
      additionalProperties: false
      required: [notifications, has_more, read_through]
      properties:
        notifications: {type: array, items: {$ref: '#/components/schemas/InboxNotification'}}
        has_more: {type: boolean}
        next_cursor: {type: string, description: Present only when has_more is true; pass as before.}
        read_through: {type: [string, 'null'], format: uuid, description: 'UUID of the maximum insertion-sequence record among ALL retained notifications in the same read transaction, regardless of page or unread filter. Null only when no retained records exist. Not a sortable UUID or timestamp; insertion sequence is never exposed.'}
    InboxSummary:
      type: object
      additionalProperties: false
      required: [unread_count, latest_id]
      properties:
        unread_count: {type: integer, format: int64, minimum: 0, description: 'Count of the current account''s unread notifications, not firing episodes.'}
        latest_id: {type: [string, 'null'], format: uuid, description: 'Greatest insertion-sequence notification UUID, including read records; null when no retained notifications exist. Read in the same transaction as unread_count.'}
    NotificationChannelConfig:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            url: {type: string, format: uri, writeOnly: true, description: Required on webhook creation; encrypted in full and never returned. Omission on PATCH retains URL. HTTPS without userinfo or fragment; HTTP only for literal loopback with allow_insecure_webhooks and notification_allow_private_networks enabled.}
        - type: object
          additionalProperties: false
          required: [chat_id]
          properties:
            chat_id: {type: string, pattern: '^(?:-?[0-9]{1,20}|@[A-Za-z][A-Za-z0-9_]{4,31})$'}
        - type: object
          additionalProperties: false
          required: [host, port, from, to]
          properties:
            host: {type: string, maxLength: 253}
            port: {type: integer, minimum: 1, maximum: 65535}
            username: {type: string, maxLength: 100}
            from: {type: string, format: email}
            to: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: email}}
    NotificationChannelReadConfig:
      oneOf:
        - type: object
          additionalProperties: false
          required: [url_redacted, url_set]
          properties:
            url_redacted: {type: string, description: Origin followed by /…; no original path or query.}
            url_set: {type: boolean}
        - type: object
          additionalProperties: false
          required: [chat_id]
          properties:
            chat_id: {type: string}
        - type: object
          additionalProperties: false
          required: [host, port, from, to]
          properties:
            host: {type: string}
            port: {type: integer}
            username: {type: string}
            from: {type: string, format: email}
            to: {type: array, items: {type: string, format: email}}
    NotificationChannelPatch:
      type: object
      additionalProperties: false
      description: Config must match kind. Webhook secret is an optional HMAC signing key, Telegram requires a bot token, email secret is the SMTP password (required with username). Secret and the full webhook URL are independently encrypted, write-only and never returned. Explicit replacements or clears do not decrypt previous values, allowing repair after a key mismatch; restore the matching key or replace all affected values. Other updates requiring unreadable credentials return 409 secret_unreadable. Omit to retain or empty to clear where the kind permits it.
      properties:
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 100}
        kind: {type: string, enum: [webhook, telegram, email]}
        enabled: {type: boolean}
        config: {$ref: '#/components/schemas/NotificationChannelConfig'}
        secret: {type: string, writeOnly: true, x-maxLengthBytes: 4096}
    NotificationChannel:
      type: object
      additionalProperties: false
      required: [id, name, kind, enabled, config, secret_set, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [webhook, telegram, email]}
        enabled: {type: boolean}
        config: {$ref: '#/components/schemas/NotificationChannelReadConfig'}
        secret_set: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, channel_id, event_id, state, attempts, next_attempt_at, last_error_code, coalesced_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        state: {type: string, enum: [pending, sent, failed]}
        attempts: {type: integer, minimum: 0, maximum: 5}
        next_attempt_at: {type: string, format: date-time}
        last_error_code: {type: string, maxLength: 40}
        coalesced_count: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AlertRulePatch:
      type: object
      additionalProperties: false
      description: |
        Metric rules require comparator and threshold. Percent thresholds are
        finite 0..100; load1 thresholds are finite 0..1000000; probes_down is
        finite 0..5. Offline requires
        comparator and threshold null/omitted and for_seconds at least 180
        (nodes.OnlineWindow). All scope requires null/omitted scope_id; node/group
        scope requires an existing UUID. Scoped rules cascade on scope deletion;
        each cascade deletion is audited with the parent inventory transaction.
        Evaluated every 30 seconds using enrolled, enabled nodes and fresh,
        identity-fenced latest reports. Missing/stale/error metrics reset pending
        duration and never fire or establish recovery. Disk usage is the maximum
        across fresh successful disks; zero-total memory/swap/disks are no data.
        probes_down counts failed results in the latest report; no probe results
        is the numeric value zero so removing targets can resolve an alert.
        Metric conditions must hold continuously for for_seconds. Offline uses
        time since the latest server-received report (or enrollment if no report),
        with no additional pending delay. Recovery uses 2 percent of threshold
        hysteresis, with at least 1 percentage point for percent metrics;
        probes_down uses count hysteresis clamped to 0..5. Pending timers reset after restart;
        firing episodes reload without duplication.
      properties: &alertRuleProperties
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 100, description: Nonblank name.}
        enabled: {type: boolean}
        scope_kind: {type: string, enum: [all, group, node]}
        scope_id: {type: [string, 'null'], format: uuid}
        metric: {type: string, enum: [cpu_percent, memory_used_percent, swap_used_percent, disk_used_percent, load1, probes_down, offline]}
        comparator: {type: [string, 'null'], enum: ['>', '<', null]}
        threshold: {type: [number, 'null'], minimum: 0, maximum: 1000000}
        for_seconds: {type: integer, minimum: 0, maximum: 86400}
        severity: {type: string, enum: [info, warning, critical]}
        channel_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}, description: Existing channels; omitted retains routing on PATCH and defaults to empty on POST.}
    AlertRuleCreate:
      allOf:
        - $ref: '#/components/schemas/AlertRulePatch'
        - required: [name, enabled, scope_kind, metric, for_seconds, severity]
    AlertRule:
      type: object
      additionalProperties: false
      required: [id, name, enabled, scope_kind, scope_id, metric, comparator, threshold, for_seconds, severity, channel_ids, created_at, updated_at]
      properties:
        <<: *alertRuleProperties
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AlertSummary:
      type: object
      additionalProperties: false
      required: [firing, newest]
      properties:
        firing:
          type: object
          additionalProperties: false
          required: [total, info, warning, critical, unknown]
          properties:
            total: {type: integer, format: int64, minimum: 0}
            info: {type: integer, format: int64, minimum: 0}
            warning: {type: integer, format: int64, minimum: 0}
            critical: {type: integer, format: int64, minimum: 0}
            unknown: {type: integer, format: int64, minimum: 0}
        newest:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/AlertEvent'}
    AlertEvent:
      type: object
      additionalProperties: false
      required: [id, rule_id, node_id, rule_name, node_name, metric, severity, state, value, started_at, resolved_at, last_notified_at]
      properties:
        id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        rule_name: {type: string}
        metric: {type: string, description: Rule metric when the episode fired (from the stored rule snapshot); empty if unavailable.}
        severity: {type: string, description: Rule severity when the episode fired (from the stored rule snapshot); empty if unavailable.}
        node_name: {type: string}
        state: {type: string, enum: [firing, resolved]}
        value: {type: [number, 'null'], description: Threshold value at firing or recovery; null for offline and lifecycle resolution.}
        started_at: {type: string, format: date-time, description: Beginning of pending condition, or latest presence for offline episodes.}
        resolved_at: {type: [string, 'null'], format: date-time}
        last_notified_at: {type: [string, 'null'], format: date-time, description: Time of the most recent successful notification delivery.}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Machine-readable failure code; validation_failed may include per-field messages. Clients must tolerate new error codes.
          examples: [unauthenticated, forbidden, not_found, node_not_found, enrollment_not_found, node_capacity_reached, enrollment_conflict, identity_conflict, last_administrator, username_conflict, invalid_json, invalid_input, validation_failed, body_too_large, protocol_unsupported, method_not_allowed, rate_limited, backup_queue_full, backup_plan_busy, backup_plan_not_found, task_not_found, artifact_not_ready, artifact_expired, artifact_missing, password_unavailable, password_expired, secret_unreadable, storage_busy, not_available, internal_error]
        message: {type: string, minLength: 1}
        request_id: {type: string, format: uuid, description: Correlates the response with safe server diagnostic metadata for internal service failures.}
        fields:
          type: object
          additionalProperties: {type: string}
    BrowserSession:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at, user]
      properties:
        csrf_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Session-bound CSRF proof; not a session authentication credential.
        expires_at: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      additionalProperties: false
      required: [id, username, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
    Group:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, target_id, created_at, details]
      properties:
        id: {type: string, format: uuid}
        actor_id:
          type: [string, 'null']
          format: uuid
          description: Acting user UUID; null for local bootstrap or events without a user actor.
        action: {type: string}
        target_id:
          type: [string, 'null']
          format: uuid
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
        details:
          type: object
          additionalProperties: true
          example: {}
    Node:
      type: object
      additionalProperties: false
      required: [id, name, status, notes, region, provider, group_id, tags, created_at, last_seen, presence, agent_version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [pending, online, offline, unknown, disabled]}
        notes: {type: string}
        region: {type: string}
        provider: {type: string}
        group_id:
          type: [string, 'null']
          format: uuid
        tags:
          type: array
          description: Sorted tag strings; an untagged node returns [], never null.
          items: {type: string}
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
        last_seen: {type: [string, 'null'], format: date-time, description: Persisted UTC reception time; null before first report and after credential replacement/revocation. Ordinary writes coalesce so this inventory view may lag about 30 seconds.}
        presence:
          type: string
          enum: [online, offline, never, disabled, pending]
          description: Disabled status takes precedence; pending status or absent credential is pending. An enrolled node without last_seen is never. Otherwise online means last_seen is between zero and 180 seconds ago inclusive; older or future times are offline. The legacy status field is retained unchanged.
        agent_version: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._+\-]*$', description: Agent version from persisted system identity; empty when an older agent did not supply it.}
    MetricHistory:
      type: object
      additionalProperties: false
      required: [metric, unit, range, step_seconds, points]
      properties:
        metric: {type: string, enum: [cpu_percent, memory_used_percent, swap_used_percent, load1, disk_used_percent, net_rx_bytes_per_second, net_tx_bytes_per_second]}
        unit: {type: string, enum: [percent, load, bytes_per_second]}
        range: {type: string, enum: [1h, 6h, 24h, 7d, 30d]}
        step_seconds: {type: integer, enum: [60, 300, 3600]}
        points:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [t, avg, max]
            properties:
              t: {type: string, format: date-time}
              avg: {type: number, minimum: 0}
              max: {type: number, minimum: 0}
    LatestSample:
      allOf:
        - {$ref: '#/components/schemas/LatestSampleView'}
        - type: object
          required: [server_time]
          properties:
            server_time: {type: string, format: date-time, description: UTC response clock; does not change reception or sample time.}
      unevaluatedProperties: false
    LatestSampleView:
      type: object
      required: [received_at, sampled_at, seq, metrics, system, runtime]
      properties:
        received_at: {type: string, format: date-time}
        sampled_at: {type: string, format: date-time}
        seq: {type: integer, minimum: 1}
        metrics: {$ref: '#/components/schemas/Metrics'}
        runtime: {$ref: '#/components/schemas/RuntimeSettings'}
        system:
          oneOf:
            - {$ref: '#/components/schemas/System'}
            - {type: 'null'}
    PublicSettings:
      type: object
      additionalProperties: false
      required: [enabled, name, region, provider]
      description: Independent administrator-published text; never populated from internal metadata. Text is trimmed, valid UTF-8 and free of control characters. Limits are UTF-8 bytes. A nonempty name is required when enabled. Existing empty settings decode to disabled and three empty strings.
      properties:
        enabled: {type: boolean, default: false}
        name: {type: string, x-maxLengthBytes: 255, default: '', pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: Independent public name; empty is allowed only while publication is disabled.}
        region: {type: string, x-maxLengthBytes: 128, default: '', pattern: '^[^\u0000-\u001f\u007f-\u009f]*$'}
        provider: {type: string, x-maxLengthBytes: 128, default: '', pattern: '^[^\u0000-\u001f\u007f-\u009f]*$'}
      allOf:
        - if:
            properties:
              enabled: {const: true}
          then:
            properties:
              name: {x-minLengthBytes: 1}
    PublicSettingsPatch:
      type: object
      additionalProperties: false
      description: All four fields are optional; omission or null leaves the stored value unchanged. Empty strings clear text. UTF-8 byte limits apply after trimming; invalid UTF-8 or control characters are rejected, not trimmed away. The merged stored settings, not just this patch, must have a nonempty name when enabled. An empty object is a valid unchanged patch.
      properties:
        enabled: {type: [boolean, 'null'], description: Enable or disable publication; null leaves unchanged.}
        name: {type: [string, 'null'], x-maxLengthBytes: 255, pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: Trimmed public name; empty clears when the merged settings are disabled; null leaves unchanged.}
        region: {type: [string, 'null'], x-maxLengthBytes: 128, pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: Trimmed public region; empty clears; null leaves unchanged.}
        provider: {type: [string, 'null'], x-maxLengthBytes: 128, pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: Trimmed public provider; empty clears; null leaves unchanged.}
    PublicNode:
      type: object
      additionalProperties: false
      required: [name, region, provider, status, last_seen, metric_status, cpu_percent, memory_percent, load1, uptime_seconds]
      description: |
        A minimal public projection, never the internal node or raw report.
        Public text is explicitly configured, not derived from private metadata.
        Resource keys are always present; null means unavailable, not zero.

        Status is unknown if the current credential has no report generation or
        session, or last_seen is missing or later than the request's server time.
        Otherwise online means an accepted new report was received between zero
        and 180 seconds ago, inclusive; greater than 180 seconds is offline.
        This is recent valid reporting, not ping, service health or availability.
        Rejected, duplicate and old-sequence reports do not refresh last_seen.
        Credential rotation resets report ownership and yields unknown until a
        new report.

        The current process retains the last accepted snapshot under the exact
        credential, binding epoch, generation and session. Offline and source expiry
        do not erase usable numbers or advance uptime. No complete report is
        persisted; server restart retains the asset and persisted last_seen but
        may return null resources until another report.
        Original ok/stale status plus a valid number is usable. Original stale,
        or elapsed source age beyond max(3*interval_ms,45000), yields stale while
        keeping the number. Equality remains fresh. Source-interval overflow uses
        the protocol's overflow-safe freshness rule. Error/unsupported/missing
        values are unavailable/null, never filled from an earlier successful
        report. Raw report statuses are not changed, and stale values do not
        become alert/history observations.
      properties:
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255, description: Explicit public name.}
        region: {type: string, x-maxLengthBytes: 128, description: Explicit public region; empty when unset.}
        provider: {type: string, x-maxLengthBytes: 128, description: Explicit public provider; empty when unset.}
        status: {type: string, enum: [online, offline, unknown]}
        last_seen: {type: [string, 'null'], format: date-time, description: Latest known server reception time for the current identity; may be the coalesced durable observation after restart. Null before reporting or after an identity reset.}
        metric_status:
          type: object
          additionalProperties: false
          required: [cpu_percent, memory_percent, load1, uptime_seconds]
          properties:
            cpu_percent: {$ref: '#/components/schemas/PublicMetricStatus'}
            memory_percent: {$ref: '#/components/schemas/PublicMetricStatus'}
            load1: {$ref: '#/components/schemas/PublicMetricStatus'}
            uptime_seconds: {$ref: '#/components/schemas/PublicMetricStatus'}
        cpu_percent: {type: [number, 'null'], minimum: 0, maximum: 100, description: CPU utilization in percent; a real zero is returned as 0.}
        memory_percent: {type: [number, 'null'], minimum: 0, maximum: 100, description: '100 * (total - available) / total, without integer overflow; both values must be usable and total positive.'}
        load1: {type: [number, 'null'], minimum: 0, description: One-minute system load average; unitless, not a percentage.}
        uptime_seconds: {type: [number, 'null'], minimum: 0, description: System uptime in seconds.}
    PublicMetricStatus:
      type: string
      enum: [ok, stale, unavailable]
    LiveFrameClock:
      type: object
      required: [type, server_time, update_interval_seconds]
      properties:
        type: {type: string, enum: [snapshot, heartbeat, close, error]}
        server_time: {type: string, format: date-time, description: UTC message clock; never a new sample or reception timestamp.}
        update_interval_seconds: {type: integer, minimum: 2, maximum: 60, description: Effective Server browser cadence; restart to apply configuration changes.}
    PublicSnapshotFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [data]
          properties:
            type: {const: snapshot}
            data: {$ref: '#/components/schemas/PublicNodeList'}
      unevaluatedProperties: false
    LiveHeartbeatFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          properties:
            type: {const: heartbeat}
      unevaluatedProperties: false
    LiveCloseFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [code]
          properties:
            type: {const: close}
            code: {type: string, enum: [renew, shutdown]}
      unevaluatedProperties: false
    LiveErrorFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [code]
          properties:
            type: {const: error}
            code: {type: string, const: unauthenticated}
      unevaluatedProperties: false
    PublicLiveFrame:
      oneOf:
        - {$ref: '#/components/schemas/PublicSnapshotFrame'}
        - {$ref: '#/components/schemas/LiveHeartbeatFrame'}
        - {$ref: '#/components/schemas/LiveCloseFrame'}
        - {$ref: '#/components/schemas/LiveErrorFrame'}
    PublicNodeList:
      type: object
      additionalProperties: false
      required: [nodes, has_more, next_offset, generated_at]
      properties:
        nodes:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PublicNode'}
          description: Published projections in candidate order; empty is [], never null. Concurrent withdrawal can reduce the returned count without changing candidate pagination.
        has_more: {type: boolean, description: Whether another candidate page exists; not a total or a promise that the next page will remain published.}
        next_offset: {type: [integer, 'null'], minimum: 0, description: When has_more is true, request offset plus candidate IDs consumed before any concurrent-withdrawal skips; otherwise null. Never derived from the number of returned nodes.}
        generated_at: {type: string, format: date-time, description: UTC projection time shared by status and freshness decisions; may be cached for the effective Server interval and is not refreshed by heartbeats.}
      allOf:
        - if:
            properties:
              has_more: {const: true}
          then:
            properties:
              next_offset: {type: integer}
          else:
            properties:
              next_offset: {type: 'null'}
    InterfaceSelection:
      type: array
      maxItems: 8
      uniqueItems: true
      description: Unique nonblank interface names, each 1–255 UTF-8 bytes, without NUL, CR or LF; shared server/agent/collector validation. Empty selection uses the default route.
      items:
        type: string
        x-minLengthBytes: 1
        x-maxLengthBytes: 255
        allOf:
          - {pattern: '^[^\u0000\r\n]+$'}
          - {pattern: '[^\u0009-\u000d\u0020\u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]'}
    ProbeTargets:
      type: array
      maxItems: 5
      uniqueItems: true
      description: Unique service-probe targets. Each target is at most 1024 UTF-8 bytes and contains no whitespace. Supported forms are tcp://host:port, http:// or https:// URLs without userinfo or fragments, and icmp://host. Targets are visible to every console user; never put secrets in a URL, including its query string.
      items:
        type: string
        x-minLengthBytes: 1
        x-maxLengthBytes: 1024
        pattern: '^\S+$'
    RuntimeSettings:
      type: object
      additionalProperties: true
      required: [report_interval_seconds, disk_interval_seconds, interfaces, disk_paths, probe_targets]
      description: Agent-owned settings. Local JSON is strict and applies defaults 10/60/empty arrays; reports must supply every runtime field without null/default filling. The budget counts four escaped occurrences of paths/interfaces and two of probe targets, reserving 13 KiB for the bounded collector envelope. The final encoded report is still capped at 64 KiB. Empty interfaces use the default route; empty disks use the agent default; empty probes disable probing.
      properties:
        report_interval_seconds: {type: integer, minimum: 5, maximum: 60}
        disk_interval_seconds: {type: integer, minimum: 60, maximum: 3600}
        interfaces: {$ref: '#/components/schemas/InterfaceSelection'}
        disk_paths:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Absolute platform-valid paths, each at most 1024 bytes without NUL. Shared server/agent/collector validation.
          items: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 1024, pattern: '^[^\u0000]+$'}
        probe_targets: {$ref: '#/components/schemas/ProbeTargets'}
    TrafficSettings:
      type: object
      additionalProperties: false
      required: [billing_day, quota_bytes]
      properties:
        billing_day: {type: integer, minimum: 1, maximum: 28}
        quota_bytes: {$ref: '#/components/schemas/DecimalCounter', description: Zero means unlimited; server business setting only.}
    Enrollment:
      type: object
      required: [id, expires_at, max_uses, uses]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: [string, 'null'], format: uuid}
        group_id: {type: [string, 'null'], format: uuid}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, minimum: 1, maximum: 100}
        uses: {type: integer, minimum: 0}
        revoked_at: {type: [string, 'null'], format: date-time}
    System:
      type: object
      properties:
        hostname: {type: string, x-maxLengthBytes: 255}
        os: {type: string, x-maxLengthBytes: 64}
        arch: {type: string, x-maxLengthBytes: 64}
        agent_version: {type: string, maxLength: 64, x-maxLengthBytes: 64, pattern: '^[A-Za-z0-9._+\-]*$', description: Optional agent build version; omitted by older agents.}
    DecimalCounter:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Canonical unsigned decimal in 0..18446744073709551615; JSON numbers, signs, exponents and leading zeroes are rejected.
    TrafficTotal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Exact unsigned decimal traffic aggregate; sums may exceed uint64.
    TrafficDaily:
      type: object
      additionalProperties: false
      required: [day, rx_bytes, tx_bytes]
      properties:
        day: {type: string, format: date, description: UTC calendar day.}
        rx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        tx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
    TrafficCycle:
      type: object
      additionalProperties: false
      required: [start, end, rx_bytes, tx_bytes, total_bytes]
      properties:
        start: {type: string, format: date-time, description: Inclusive UTC billing-cycle start at 00:00.}
        end: {type: string, format: date-time, description: Exclusive UTC start of the next billing cycle.}
        rx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        tx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        total_bytes: {$ref: '#/components/schemas/TrafficTotal'}
    TrafficSummary:
      type: object
      additionalProperties: false
      required: [billing_day, quota_bytes, cycle, daily, updated_at]
      properties:
        billing_day: {type: [integer, 'null'], minimum: 1, maximum: 28}
        quota_bytes:
          description: Null when the node has no quota; a configured quota of 0 means unlimited.
          oneOf:
            - {$ref: '#/components/schemas/DecimalCounter'}
            - {type: 'null'}
        cycle: {$ref: '#/components/schemas/TrafficCycle'}
        daily:
          type: array
          description: Ascending UTC days with data, limited to the requested window including today.
          items: {$ref: '#/components/schemas/TrafficDaily'}
        updated_at: {type: [string, 'null'], format: date-time, description: Latest hourly-row update time, or null when no hourly row exists.}
    ProbeSummary:
      type: object
      additionalProperties: false
      required: [probes]
      properties:
        probes:
          type: array
          maxItems: 5
          description: One entry per configured target, preserving desired-config order.
          items: {$ref: '#/components/schemas/ProbeStatus'}
    ProbeStatus:
      type: object
      additionalProperties: false
      required: [target, status, latency_ms, error, status_code, checked_at, uptime_24h, checks_24h]
      properties:
        target: {type: string, x-maxLengthBytes: 1024}
        status: {type: string, enum: [up, down, pending], description: Pending means no stored latest result exists.}
        latency_ms: {type: [number, 'null'], minimum: 0, maximum: 60000}
        error: {type: string, enum: ['', timeout, refused, dns, tls, http_status, unreachable, unsupported, error]}
        status_code: {type: [integer, 'null'], minimum: 100, maximum: 599, description: HTTP response status when applicable.}
        checked_at: {type: [string, 'null'], format: date-time}
        uptime_24h: {type: [number, 'null'], minimum: 0, maximum: 100, description: 100 * (checks - failures) / checks, or null when checks is zero.}
        checks_24h: {type: integer, minimum: 0}
    Source:
      type: object
      additionalProperties: true
      required: [sample_id, age_ms, source_interval_ms]
      properties:
        sample_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
        age_ms: {type: integer, minimum: 0}
        source_interval_ms: {type: integer, minimum: 1}
        measurement_window_ms: {type: integer, minimum: 0}
      description: Monotonic age/window; fresh while age <= max(3*interval,45000). Repeated sample IDs are not new observations.
    DifferentialSource:
      allOf:
        - {$ref: '#/components/schemas/Source'}
        - {required: [measurement_window_ms]}
      description: CPU and every network source require a nonnegative measurement window for every status, including warm-up and failure; zero is allowed.
    Metrics:
      type: object
      additionalProperties: true
      required: [cpu_percent, load1, load5, load15, memory_total_bytes, memory_available_bytes, swap_total_bytes, swap_used_bytes, uptime_seconds, disks, networks, metric_status, sources]
      properties:
        cpu_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        load1: {type: [number, 'null'], minimum: 0}
        load5: {type: [number, 'null'], minimum: 0}
        load15: {type: [number, 'null'], minimum: 0}
        memory_total_bytes: {type: [integer, 'null'], minimum: 0}
        memory_available_bytes: {type: [integer, 'null'], minimum: 0}
        swap_total_bytes: {type: [integer, 'null'], minimum: 0}
        swap_used_bytes: {type: [integer, 'null'], minimum: 0}
        uptime_seconds: {type: [number, 'null'], minimum: 0}
        disks:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: true
            required: [path, total_bytes, used_bytes, sampled_at]
            properties:
              path: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 1024}
              total_bytes: {type: [integer, 'null'], minimum: 0}
              used_bytes: {type: [integer, 'null'], minimum: 0}
              sampled_at: {type: string, format: date-time}
        networks:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: true
            required: [name, rx_bytes_per_sec, tx_bytes_per_sec]
            properties:
              name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
              rx_bytes_per_sec: {type: [number, 'null'], minimum: 0}
              tx_bytes_per_sec: {type: [number, 'null'], minimum: 0}
        metric_status:
          type: object
          required: [cpu_percent, load1, load5, load15, memory_total_bytes, memory_available_bytes, swap_total_bytes, swap_used_bytes, uptime_seconds]
          description: 'The nine known scalar keys and each reported disk/network key are validated. Unknown extension keys and values are discarded; unmatched disk:/network: keys are rejected.'
          properties:
            cpu_percent: {$ref: '#/components/schemas/MetricStatus'}
            load1: {$ref: '#/components/schemas/MetricStatus'}
            load5: {$ref: '#/components/schemas/MetricStatus'}
            load15: {$ref: '#/components/schemas/MetricStatus'}
            memory_total_bytes: {$ref: '#/components/schemas/MetricStatus'}
            memory_available_bytes: {$ref: '#/components/schemas/MetricStatus'}
            swap_total_bytes: {$ref: '#/components/schemas/MetricStatus'}
            swap_used_bytes: {$ref: '#/components/schemas/MetricStatus'}
            uptime_seconds: {$ref: '#/components/schemas/MetricStatus'}
          patternProperties:
            '^(disk:|network:)': {$ref: '#/components/schemas/MetricStatus'}
          additionalProperties: true
        sources:
          type: object
          required: [cpu, load, memory, swap, uptime]
          description: 'Known source families and each reported disk/network source remain required and validated. Unknown family keys and values are discarded; unmatched disk:/network: keys are rejected.'
          properties:
            cpu: {$ref: '#/components/schemas/DifferentialSource'}
            load: {$ref: '#/components/schemas/Source'}
            memory: {$ref: '#/components/schemas/Source'}
            swap: {$ref: '#/components/schemas/Source'}
            uptime: {$ref: '#/components/schemas/Source'}
          patternProperties:
            '^network:': {$ref: '#/components/schemas/DifferentialSource'}
            '^disk:': {$ref: '#/components/schemas/Source'}
          additionalProperties: true
    MetricStatus:
      type: string
      enum: [ok, unsupported, permission_denied, disabled, error, stale]
    Traffic:
      type: object
      additionalProperties: true
      required: [epoch, period_start, rx_bytes, tx_bytes]
      properties:
        epoch: {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9a-f]{1,64}$'}
        period_start: {type: string, format: date-time, description: Hour-aligned UTC timestamp.}
        rx_bytes: {$ref: '#/components/schemas/DecimalCounter', description: Cumulative received bytes in 0..9223372036854775807.}
        tx_bytes: {$ref: '#/components/schemas/DecimalCounter', description: Cumulative sent bytes in 0..9223372036854775807.}
    ProbeResult:
      type: object
      additionalProperties: true
      required: [target, ok, latency_ms, error, status_code, checked_at]
      properties:
        target: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 1024, description: Validated service-probe target.}
        ok: {type: boolean}
        latency_ms: {type: [number, 'null'], minimum: 0, maximum: 60000, description: Non-null for a successful result and null for a failure.}
        error: {type: string, enum: ['', timeout, refused, dns, tls, http_status, unreachable, unsupported, error], description: Empty if and only if ok is true; http_status requires status_code.}
        status_code: {type: [integer, 'null'], minimum: 100, maximum: 599, description: Present only for HTTP probes; required when error is http_status.}
        checked_at: {type: string, format: date-time}
    Report:
      type: object
      additionalProperties: true
      required: [protocol_version, run_generation, session_id, seq, sampled_at, runtime, metrics, traffic]
      properties:
        protocol_version: {const: 1}
        run_generation: {type: integer, minimum: 1, description: Monotonic within the current node credential; changing the credential resets server fencing.}
        session_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
        seq: {type: integer, minimum: 1}
        sampled_at: {type: string, format: date-time}
        runtime: {$ref: '#/components/schemas/RuntimeSettings'}
        system: {$ref: '#/components/schemas/System'}
        metrics: {$ref: '#/components/schemas/Metrics'}
        traffic: {type: array, maxItems: 24, description: Unique epoch/period_start pairs with cumulative per-process hourly byte counters., items: {$ref: '#/components/schemas/Traffic'}}
        probe_results: {type: array, maxItems: 5, description: Latest result for each currently configured target; target values are unique., items: {$ref: '#/components/schemas/ProbeResult'}}
    ReportResponse:
      type: object
      additionalProperties: true
      required: [node_id, accepted_seq, server_time]
      properties:
        node_id: {type: string, format: uuid, description: Authenticated node identity; never a request target.}
        accepted_seq: {type: integer, minimum: 1}
        server_time: {type: string, format: date-time}
        traffic_acks: {type: array, maxItems: 24, description: Committed counters for entries in this report; values may lag. Buckets older than 35 days are acknowledged and discarded. Future buckets beyond one hour are neither stored nor acknowledged., items: {$ref: '#/components/schemas/Traffic'}}
