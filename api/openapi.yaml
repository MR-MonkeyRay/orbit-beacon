openapi: 3.1.0
info:
  title: OrbitBeacon 服务端与 Agent API
  version: 0.5.0
  description: |
    定义管理、Agent 与匿名 API 的字段、认证和错误码；各端点说明各自的访问要求。
    info.version 是接口契约版本，独立于程序发布版本，仅随契约变更更新；说明文字修订不升版。
    JSON 请求限单个对象、64 KiB；字符串长度按 UTF-8 字节计算。
    x-minLengthBytes / x-maxLengthBytes 为扩展，客户端须显式支持，服务端仍执行校验。
    使用与安全边界见[架构](../docs/architecture.md)、[部署](../deploy/README.md)、
    [Agent](../docs/agent.md)及[术语与约定](../docs/conventions.md)。
  license:
    name: GNU General Public License v3.0
    identifier: GPL-3.0
servers:
  - url: http://localhost:8080
    description: 默认本地 HTTP 部署
  - url: https://beacon.example.test
    description: 可选的外部 HTTPS 代理
security:
  - session: []
paths:
  /api/v1/data-management:
    get:
      operationId: getDataManagement
      description: 管理员会话专用。统计当前活动业务及历史数据库，不包含备库、本地控制库、SQLite WAL 或备份文件。MySQL 分配空间是引擎估计值；不返回数据库地址或凭据。
      parameters:
        - name: keep_days
          in: query
          schema: {type: integer, enum: [7, 30, 90, 180, 365], default: 30}
      responses:
        '200':
          description: 当前统计；缺少历史数据库时省略该域及其类别。before 是本次预览的 UTC 清理边界。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [databases, categories, before]
                properties:
                  before: {type: string, format: date-time}
                  databases:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [domain, driver, size_bytes, reusable_bytes, compact_supported]
                      properties:
                        domain: {type: string, enum: [main, history]}
                        driver: {type: string, enum: [sqlite, mysql]}
                        size_bytes: {type: integer, minimum: 0, description: SQLite page_count × page_size；MySQL DATA_LENGTH + INDEX_LENGTH 估计值。}
                        reusable_bytes: {type: [integer, 'null'], minimum: 0, description: SQLite 空闲页大小；MySQL 为 null，不保证等于操作系统可回收空间。}
                        compact_supported: {type: boolean, description: SQLite 与 MySQL 均为 true；仅针对当前活动域。}
                  categories:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, domain, rows, eligible_rows]
                      properties:
                        id: {type: string, enum: [metric_history, probe_history, availability_history, resolved_alerts, notification_history, delivery_history, audit_events]}
                        domain: {type: string, enum: [main, history]}
                        rows: {type: integer, minimum: 0}
                        eligible_rows: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/data-management/cleanup:
    post:
      operationId: cleanupManagedData
      description: |
        管理员会话、Origin 与 CSRF 校验。只删除所选类别中早于 before 的记录；客户端传入预览的 before，服务端验证不晚于当前 keep_days 边界。
        指标按桶时间、探测按小时、可用率按完整 UTC 日、告警按恢复时间、站内通知及审计按创建时间、终态投递按更新时间判断。
        保留触发中告警、pending 投递、账户、节点、设置、会话、流量及备份。站内通知同时级联删除已读关系，不重置通知序号。
        每类别最多删除 5000 行，分短事务提交；has_more=true 时需刷新后由管理员再次确认。类别间及批次间不承诺原子性，失败可能已有部分提交，必须刷新核实，禁止自动重发未知提交。
        逻辑删除不承诺立即缩小数据库文件；本接口不执行 VACUUM、OPTIMIZE 或 TRUNCATE，空间整理须另行调用 compact 接口。
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categories, keep_days, before, confirmation]
              properties:
                categories:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: {type: string, enum: [metric_history, probe_history, availability_history, resolved_alerts, notification_history, delivery_history, audit_events]}
                keep_days: {type: integer, enum: [7, 30, 90, 180, 365]}
                before: {type: string, format: date-time}
                confirmation: {type: string, const: CLEAN}
      responses:
        '200':
          description: 已完成的各类别清理结果；按请求顺序返回。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results, before]
                properties:
                  before: {type: string, format: date-time}
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, deleted_rows, has_more]
                      properties:
                        id: {type: string}
                        deleted_rows: {type: integer, minimum: 0, maximum: 5000}
                        has_more: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/data-management/compact:
    post:
      operationId: compactManagedDatabase
      description: |
        管理员会话、Origin 与 CSRF 校验。只整理所选当前活动逻辑域，应用不直接操作备库，不删除业务行。
        稳定租约和写 gate 内、事务外执行：SQLite 使用 VACUUM 与 WAL checkpoint；MySQL 对所选当前活动逻辑域的 InnoDB 实体表逐表执行 OPTIMIZE TABLE，包含该域内部元数据，不遍历其他 schema，不操作视图或非 InnoDB 表。
        MySQL 需具备所整理表的 SELECT、INSERT 权限。物理维护不通过应用行复制同步备库；若配置 MySQL 原生 binlog 复制，语句按既有原生复制规则传播。
        整理会阻塞应用写入，MySQL 还可能等待或持有元数据锁，并需要额外磁盘空间；应在低峰且空间充足时执行。不保证归还操作系统空间，MySQL 取决于独立 .ibd 或共享表空间等配置，不承诺缩小系统表空间 ibdata1。
        整理请求最长执行 30 分钟。MySQL 逐表完成后不可整体回滚，失败、取消或超时不能撤销已完成的表整理。失败、超时或响应中断后先刷新核实，禁止自动重发。
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain, confirmation]
              properties:
                domain: {type: string, enum: [main, history]}
                confirmation: {type: string, const: COMPACT}
      responses:
        '200':
          description: 整理成功；重新读取统计获取最新空间。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [domain]
                properties:
                  domain: {type: string, enum: [main, history]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/api-tokens:
    get:
      operationId: listAPITokens
      security: [{session: []}]
      responses:
        '200':
          description: 全部令牌，包括过期令牌。
          content:
            application/json:
              schema:
                type: object
                required: [api_tokens]
                additionalProperties: false
                properties:
                  api_tokens: {type: array, items: {$ref: '#/components/schemas/APIToken'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAPIToken
      security: [{session: []}]
      description: 当前密码确认；事务内重新检查会话有效性和密码哈希。总数上限 20，过期令牌也计数。仅此响应返回明文令牌。
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expires_in_days, password]
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, x-maxLengthBytes: 100}
                expires_in_days: {type: [integer, 'null'], enum: [30, 90, 365, null]}
                password: {type: string, writeOnly: true, x-maxLengthBytes: 1024}
      responses:
        '201':
          description: 一次性明文令牌；Cache-Control 为 no-store。
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/APIToken'}
                  - type: object
                    required: [token]
                    properties:
                      token: {type: string, pattern: '^obt_[A-Za-z0-9_-]{43}$'}
        '409':
          description: api_token_limit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/api-tokens/{id}:
    patch:
      operationId: updateAPITokenRateLimit
      security: [{session: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rate_limit_per_minute]
              properties:
                rate_limit_per_minute: {type: [integer, 'null'], minimum: 1, maximum: 100000}
      responses:
        '200':
          description: Saved token override; null uses the global limit.
          content:
            application/json:
              schema:
                type: object
                required: [rate_limit_per_minute]
                properties:
                  rate_limit_per_minute: {type: [integer, 'null'], minimum: 1, maximum: 100000}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeAPIToken
      security: [{session: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: 令牌立即撤销。}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/settings/api-tokens:
    get:
      operationId: getAPITokenSettings
      security: [{session: []}]
      responses:
        '200':
          description: Effective global API token limit; defaults to 600 requests per minute.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenSettings'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAPITokenSettings
      security: [{session: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/APITokenSettings'}
      responses:
        '200':
          description: Saved global limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenSettings'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/settings/public-page:
    get:
      operationId: getPublicPageSettings
      description: |
        仅限不受限管理员。返回根路由与匿名传输使用的运行时发布状态；
        未存储的设置默认启用。不改变各节点的公开白名单。
      responses:
        '200':
          description: 当前全局公开访问设置。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicPageSettings'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: setPublicPageEnabled
      description: |
        仅限不受限管理员。请求体须恰好包含布尔值 enabled；
        空对象、null、错误类型或未知键返回 400 且不变更。
        设置与 public_page.update 审计在同一事务提交，随后更新运行时发布状态、
        使公开可见性缓存失效，再返回成功。值未变时不产生审计事件，也不续接流。
        失败时存储与运行时状态均不变。禁用会停止所有匿名 API/流；
        启用不会发布任何私有节点。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicPageSettings'}
      responses:
        '200':
          description: 已保存并发布的全局公开访问设置。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicPageSettings'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/public/v1/nodes:
    get:
      operationId: listPublicNodes
      security: []
      description: |
        匿名读取已显式发布的节点；无论会话 Cookie 缺失、有效或无效，行为完全一致。
        不需要会话、Origin 或 CSRF 令牌；不创建或清理会话，也不授予 CORS 访问。
        仅三个精确的 /api/public/v1 端点绕过浏览器认证。
        所有响应（含错误）均使用 Cache-Control: no-store。
        全局公开页禁用时，无论会话 Cookie 如何，本端点返回 403
        public_page_disabled 且不含节点数据。全局开关不改变各节点的发布状态。

        仅包含公开设置有效且启用、公开名称非空、内部状态为 unknown、
        持有有效节点凭据且已完成注册的节点。待注册、已禁用、已删除与未发布的节点被排除；
        JSON 格式错误或无效的公开设置同样被排除，不会回填。
        每个候选节点投影前都重新校验发布状态；并发撤销或删除会跳过该候选。
        其他读取失败会使整个请求失败，而非返回部分成功的响应。
        禁用、删除或撤销节点后，下次请求即排除该节点；已送达访问者的信息无法撤回。

        候选按创建时间再按节点 UUID 排序，但不暴露这两个字段。
        最多读取 limit+1 个候选以判定 has_more。
        next_offset 按消耗的候选数前进，而非按返回的节点数，
        因此并发撤销可能产生短页或空页但仍存在下一页。这是偏移分页，
        不是稳定集合快照，也不是节点总数。无效的分页参数返回 400。
        仅支持 GET；其他方法在认证前返回 405 并附 Allow: GET。

        返回独立配置的公开文本、四个资源值、last_seen（服务端接收时间）
        与四个新鲜度状态。内部元数据、ID、IP、主机名、凭据、安装/会话 ID、
        运行时、原始上报、来源元数据、磁盘路径与网络名称一律不投影。
        管理员须对填入公开文本的机密自行负责。generated_at 是状态与来源新鲜度的投影时钟。

        返回一个快照帧。server_time 为响应时钟；
        data.generated_at 为投影时钟，可按生效的 web_update_interval_seconds
        （默认 10，范围 2–60）缓存。可见性变更会立即使缓存失效。
        每次出站投影在查询前后各检查一次可见性，最多三次尝试；
        持续变动时返回 503 snapshot_busy，而非过期页面。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 快照帧；空的成功集合为 data.nodes []，绝不为 null。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSnapshotFrame'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/PublicPageDisabled'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: 三次投影尝试中公开可见性均发生变化；code 为 snapshot_busy。
          headers:
            Retry-After:
              description: 生效的浏览器更新间隔（秒）。
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/public/v1/stream:
    get:
      operationId: streamPublicNodes
      security: []
      description: |
        匿名 SSE 流，投影与 GET /api/public/v1/nodes 相同的分页公开节点。
        limit 和 offset 参数的默认值与校验规则一致。不需要会话、Origin 或
        CSRF 令牌，响应不可缓存。

        每个事件均为 `message`；其 data 为一个 PublicLiveFrame JSON 对象。
        首个快照立即发送。后续语义变化按 web_update_interval_seconds
        （默认 10，范围 2–60）合并发送。仅投影时钟或响应时钟变化不会产生新的完整快照。
        静默流每十秒发送一次心跳帧；心跳不改变采样或接收时间戳。
        定期投影仍会检测来源过期与 180 秒离线边界。

        公开文本编辑、新增发布以及首次或吊销后的凭据绑定仍遵循常规更新节奏。

        已提交的撤销、禁用、吊销或活跃凭据替换会发送 close:renew 并结束流，
        浏览器随即重新读取集合。已知失效的投影不会发送；持续可见性变动或
        投影/写入失败会终止流，不发送失效载荷。
        流在 15 分钟后重新建立。服务器关闭时先尝试 close:shutdown，然后中断阻塞的写入，
        并在排空上报队列前等待已跟踪的流结束。断开或被强制关闭的对端可能收不到关闭帧。
        全局公开页禁用时拒绝建立连接，返回 403 public_page_disabled。
        已有流会尝试发送 code 为 public_page_disabled、含 server_time 与
        update_interval_seconds 且无 data 的 error 帧，然后结束。
        被阻塞或已断开的对端可能仅观察到连接断开；后续请求返回显式的 403。
        已知禁用是终态，不是可重试的故障：浏览器清除公开数据并通过 location.replace('/') 重新路由。
        普通网络/5xx/其他 403 故障不意味着公开已禁用。

        WebSocket 与 SSE 共享全局上限 200 及每个解析后客户端 IP 四条；
        容量在退出时释放一次。超出的流收到 503 stream_busy 与 Retry-After。
        仅支持 GET；其他方法返回 405 并附 Allow: GET。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 携带类型化快照或控制帧的 UTF-8 message 事件。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Accel-Buffering:
              schema: {type: string, const: no}
          content:
            text/event-stream; charset=utf-8:
              schema:
                type: string
                description: 每个事件为 message；其紧凑 JSON data 符合 PublicLiveFrame。
              examples:
                snapshot:
                  summary: 公开快照帧
                  value: "event: message\ndata: {\"type\":\"snapshot\",\"server_time\":\"2026-01-01T00:00:00Z\",\"update_interval_seconds\":10,\"data\":{\"nodes\":[],\"has_more\":false,\"next_offset\":null,\"generated_at\":\"2026-01-01T00:00:00Z\"}}\n\n"
                heartbeat:
                  summary: 连接时钟，无新节点数据
                  value: "event: message\ndata: {\"type\":\"heartbeat\",\"server_time\":\"2026-01-01T00:00:10Z\",\"update_interval_seconds\":10}\n\n"
                close:
                  summary: 立即刷新
                  value: "event: message\ndata: {\"type\":\"close\",\"server_time\":\"2026-01-01T00:15:00Z\",\"update_interval_seconds\":10,\"code\":\"renew\"}\n\n"
                disabled:
                  summary: 全局公开访问已禁用；终态，无节点数据
                  value: "event: message\ndata: {\"type\":\"error\",\"server_time\":\"2026-01-01T00:00:10Z\",\"update_interval_seconds\":10,\"code\":\"public_page_disabled\"}\n\n"
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/PublicPageDisabled'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: 共享 WebSocket/SSE 并发上限已达；code 为 stream_busy。
          headers:
            Retry-After:
              description: 再次开启流之前需等待的秒数。
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                code: stream_busy
                message: Too many public streams.
                request_id: 00000000-0000-4000-8000-000000000001
        default: {$ref: '#/components/responses/Error'}
  /api/public/v1/ws:
    get:
      operationId: websocketPublicNodes
      security: []
      description: |
        只读 WebSocket，与 HTTP/SSE 使用相同的公开页和 PublicLiveFrame 消息。
        分页、节奏、可见性刷新、容量与关闭逻辑共享。
        原始 Origin 必须与配置的规范 public_url 完全一致；
        缺失、多个或不一致的 Origin 在升级前被拒绝。
        Cookie 被忽略，绝不选择私有投影。

        浏览器 WebSocket API 可能自动附带同源 Cookie；
        匿名 HTTP/SSE 使用 credentials omit。压缩已禁用，
        读取限制 1 KiB，拒绝应用写入，每次写入有十秒截止时间。
        无订阅命令、重放或增量协议。
        全局禁用时，升级前返回 403 public_page_disabled。
        已接纳的连接尝试发送与 SSE 相同的终态无数据
        error:public_page_disabled 帧后关闭。浏览器无法检查失败的 WS 握手，
        因此回退到 HTTP/SSE 以获取显式错误码。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '101':
          description: HTTP/1.1 升级已接受；后续文本消息符合 PublicLiveFrame。
          x-websocket-message-schema:
            $ref: '#/components/schemas/PublicLiveFrame'
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: 共享流容量不可用；code 为 stream_busy。
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/live:
    get:
      operationId: getConsoleLive
      description: |
        认证后的只读快照，使用与公开传输相同的帧结构与服务端节奏。
        省略 node_id 返回完整资产的紧凑状态；提供则返回该节点的详情、
        最新采样与观测到的运行时。集群接收时间合并当前身份的内存上报与
        持久化观测，无需解码每个节点的完整上报。
        已删除节点的详情是成功的快照，node/latest/runtime 为 null；
        存在但尚无当前采样的节点有 node 而 latest 为 null。
        不接受订阅、重放、增量或 Agent 配置写入。
      parameters:
        - $ref: '#/components/parameters/LiveNodeID'
      responses:
        '200':
          description: 当前认证的集群或详情快照。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsoleSnapshotFrame'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: 投影/编码期间快照身份已变更；code 为 snapshot_busy。不返回过期载荷。
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/live/stream:
    get:
      operationId: streamConsoleLive
      description: |
        Cookie 认证的 SSE；每个事件为 message，携带 ConsoleLiveFrame。
        数据选择与 GET /api/v1/live 一致。首个快照立即发送；变化合并到
        web_update_interval_seconds，静默流每十秒仅发送心跳。采样时间不随心跳更新。
        每次快照与心跳前都校验会话。过期、吊销或账户删除时发出
        error:unauthenticated 并终止；浏览器须清除私有状态，而非继续常规回退。
        流的生命周期取会话过期与十五分钟中的较早者。
        准入、中断写入与关闭跟踪与公开 SSE/WS 共享：每个解析出的客户端 IP 四条，全局 200 条。
        已送达的数据无法撤回，断开的对端可能收不到终止帧。
      parameters:
        - $ref: '#/components/parameters/LiveNodeID'
      responses:
        '200':
          description: 无缓冲的只读认证事件流。
          headers:
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              schema: {type: string, description: 每个 message 的 data 符合 ConsoleLiveFrame。}
              example: |
                event: message
                data: {"type":"heartbeat","server_time":"2026-10-28T12:00:10Z","update_interval_seconds":10}

        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: 共享流容量不可用；code 为 stream_busy。
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/live/ws:
    get:
      operationId: websocketConsoleLive
      description: |
        Cookie 认证的只读 WebSocket，文本消息为 ConsoleLiveFrame，
        选择、节奏、逐帧认证与过期逻辑与 SSE 一致。
        升级前，原始 Origin 必须与配置的 public_url 完全一致。
        压缩已禁用，读取限制 1 KiB，拒绝应用写入，每次写入有十秒截止时间。
        共享的准入控制与关闭流程也覆盖经 HTTP Hijack 接管的连接。

        浏览器 API 不暴露被拒绝握手的 HTTP 状态。在未打开的 WS 回退之前，
        控制台无条件 GET /me；无效会话是终态，而非传输可用性失败。
      parameters:
        - $ref: '#/components/parameters/LiveNodeID'
        - $ref: '#/components/parameters/Origin'
      responses:
        '101':
          description: HTTP/1.1 升级已接受；后续文本消息符合 ConsoleLiveFrame。
          x-websocket-message-schema:
            $ref: '#/components/schemas/ConsoleLiveFrame'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503':
          description: 共享流容量不可用；code 为 stream_busy。
          headers:
            Retry-After:
              schema: {type: string, pattern: '^[1-9][0-9]*$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/totp:
    get:
      operationId: getTOTPStatus
      description: 返回当前管理员的两步验证状态与剩余恢复码数量。
      responses:
        '200':
          description: 已完成。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPStatus'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/totp/setup:
    post:
      operationId: setupTOTP
      description: 校验当前密码，生成 20 字节密钥并暂存 10 分钟。已启用返回 409 totp_already_enabled。返回的 Base32 密钥、otpauth URI 和 QR 模块仅用于当前设置流程；响应禁止缓存。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, x-maxLengthBytes: 1024}
      responses:
        '200':
          description: 已完成。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPSetup'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/totp/confirm:
    post:
      operationId: confirmTOTP
      description: 校验待确认密钥的六位验证码与独立失败预算；待确认状态缺失或超过 10 分钟返回 totp_setup_expired。在同一事务启用密钥、记录已使用步长、替换十个恢复码、删除其他会话并审计 user.totp.enable。恢复码只在此响应返回一次。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, x-maxLengthBytes: 64}
      responses:
        '200':
          description: 已完成。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/totp/disable:
    post:
      operationId: disableTOTP
      description: 要求当前密码与未使用的 TOTP 或恢复码。在同一事务消费第二因素、清除密钥与恢复码、删除其他会话并审计 user.totp.disable；保留当前会话。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, otp]
              properties:
                password: {type: string, x-maxLengthBytes: 1024}
                otp: {type: string, x-maxLengthBytes: 64}
      responses:
        '204':
          description: 已完成。
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      description: 要求当前密码与未使用的 TOTP 或恢复码。在同一事务消费第二因素、替换全部恢复码并审计 user.totp.recovery_codes。旧恢复码立即失效；十个新恢复码只在此响应返回一次。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, otp]
              properties:
                password: {type: string, x-maxLengthBytes: 1024}
                otp: {type: string, x-maxLengthBytes: 64}
      responses:
        '200':
          description: 已完成。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users/{id}/totp/reset:
    post:
      operationId: resetUserTOTP
      description: 要求操作者本人的当前密码；目标为本人返回 400。事务内清空目标全部 TOTP 状态、恢复码与会话，审计 user.totp.reset。所有写操作要求 Origin 与 CSRF。
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, x-maxLengthBytes: 1024}
      responses:
        '204':
          description: 已完成。
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/session:
    post:
      operationId: login
      security: []
      description: |
        密码通过后，已启用两步验证的账户须提交 otp；缺失返回 401 totp_required，错误返回 401 totp_invalid。
        otp 接受 TOTP 或一次性恢复码；未启用时忽略。TOTP 失败桶独立于登录成功记录，每 300 秒补一个，突发为 10。
        要求配置的公开 Origin。在数据库查询与 Argon2 之前，
        直连对端与对端/用户名的令牌预算限制计算量；两项预算均允许尝试时才各自扣除令牌。
        IPv4 对端以地址为键，IPv6 对端以 /64 前缀为键。端口与转发头不改变身份。
        对端/用户名预算的突发容量为 10，每 30 秒补充一个令牌。
        密码验证失败（包括未知用户名）还会消耗与来源无关、以用户名哈希为键的预算，
        突发容量为 20，每 60 秒补充一个令牌。该预算在成功登录后删除。
        耗尽时在 Argon2 之前拒绝，除非该对端在过去 24 小时内成功登录过该用户名，
        可以继续尝试，防止远程攻击者锁定用户常用网络。
        密码运算串行执行，最多八个请求排队等待，排队超时为一秒。
        准入过载返回 429，Retry-After 为一秒。
        需要改密的账户仍收到 200 与会话；
        user.must_change_password=true 标识其受限权限。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
                password: {type: string, x-minLengthBytes: 8, x-maxLengthBytes: 1024}
                otp: {type: string, x-maxLengthBytes: 64}
      responses:
        '200':
          description: 会话已建立；Set-Cookie 为 orbitbeacon_session，无 Domain（仅主机）、HttpOnly、SameSite=Lax、Path=/，有效期 12 小时。仅当配置的规范公开 Origin 使用 HTTPS 时才设置 Secure，与上游请求或转发头无关。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: logout
      description: 受限与不受限会话均可用；须携带 Origin 与 CSRF。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: >
            会话已吊销。不发送 Set-Cookie，因此延迟的响应不会清除后续登录的 Cookie。
            已吊销的凭据无法再认证。
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: currentSession
      description: 受限与不受限会话均可用；不清除也不改变改密要求。
      responses:
        '200':
          description: 当前认证会话与稳定 CSRF 令牌，可在新标签页恢复而不轮换其他标签页的令牌。不暴露会话承载凭据。本读取从不写入；过期会话由登录与每小时保留任务回收。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserSession'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/password:
    patch:
      operationId: changeOwnPassword
      description: |
        仅当前账户可修改自身密码；允许受限会话。当前密码用于证明所有权。
        尝试按用户限流：突发容量为 5，每 60 秒补充一个令牌，在 Argon2 运算前消耗令牌。
        当前密码错误返回 400 invalid_old_password。验证通过后，
        新密码与旧密码相同返回 400 password_unchanged。
        任一失败都保留改密要求与会话。会话缺失或无效返回 401 unauthenticated。
        成功时原子地更换哈希、清除 must_change_password 并吊销该用户的全部会话（含当前会话）。
        不创建新会话，也不发送 Set-Cookie，因此延迟的响应不会清除后续登录的 Cookie。
        浏览器返回 /login?password-changed，须重新登录。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [old_password, new_password]
              properties:
                old_password: {type: string, x-maxLengthBytes: 1024}
                new_password: {type: string, x-minLengthBytes: 8, x-maxLengthBytes: 1024, examples: [天地玄黄]}
      responses:
        '204': {description: 密码已修改，改密要求已清除，该用户全部会话已吊销。无响应体或 Set-Cookie；须重新登录。}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users:
    get:
      operationId: listUsers
      description: 所有不受限管理员均可用；从不返回凭据字段。返回完整、不分页的用户列表。
      responses:
        '200':
          description: 用户集合。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createUser
      description: 创建另一个同等权限的管理员。可选的 must_change_password 为布尔值，默认 false；为 true 时要求在访问管理功能前修改密码。显式的 null、字符串或数字返回 400 invalid_json。用户名精确匹配，不去除首尾空白，也不忽略大小写。用户名已存在时返回 409 username_conflict 且不创建账户。未知的请求字段返回 400 invalid_json。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
                password: {type: string, x-minLengthBytes: 8, x-maxLengthBytes: 1024}
                must_change_password: {type: boolean, default: false, description: 要求首次访问管理功能前修改密码；null 无效。}
      responses:
        '201':
          description: 用户已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getUser
      description: 所有已认证管理员均可用；不含凭据字段。
      responses:
        '200':
          description: 找到用户。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateUser
      description: 重命名管理员。username 是唯一可接受的字段且为可选；省略则保持不变。已存在的精确用户名返回 409 username_conflict，不更改账户或会话。重命名保留全部会话（含当前会话）。must_change_password 与其他未知请求字段返回 400 invalid_json。修改密码仅可通过 /api/v1/me/password 并提供当前密码完成。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
      responses:
        '200':
          description: 已更新的不含凭据的用户。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteUser
      description: 原子地删除管理员并吊销其全部会话。最后一名管理员不可删除，返回 409 last_administrator，账户、会话与审计历史均不变。仍有其他管理员时允许自我删除；204 后当前会话失效。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 用户已删除，会话已吊销。}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups:
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: listGroups
      description: 所有已认证管理员均可用。返回完整、不分页的分组列表。
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 分组集合。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createGroup
      description: 仅限管理员。分组仅包含名称，不含注册凭据或未来的策略设置。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        $ref: '#/components/requestBodies/GroupName'
      responses:
        '201':
          description: 分组已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getGroup
      description: 所有已认证管理员均可用。
      responses:
        '200':
          description: 找到分组。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: renameGroup
      description: 仅限管理员。仅更新名称。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        $ref: '#/components/requestBodies/GroupName'
      responses:
        '200':
          description: 已重命名的分组。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteGroup
      description: 仅限管理员。原子地删除分组并解绑其节点，将节点的 group_id 置为 null，不删除节点。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 分组已删除，节点已解绑。}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/storage:
    get:
      operationId: getStorageStatus
      security: [{session: []}]
      description: 管理员会话读取两个逻辑域的当前状态；不接受 API 令牌。状态与服务角色分开，ready 仅表示副本完整，不表示可提升。健康业务库的通知偏好读取失败时，保留控制记录中的偏好并返回 snapshot_ready=false，允许 PATCH 修复；业务库不可用或请求世代失效仍返回 503，无匿名恢复旁路。
      responses:
        '200':
          description: 当前状态；Cache-Control 为 no-store。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/storage/notifications:
    patch:
      operationId: updateStorageNotifications
      security: [{session: []}]
      description: 替换故障通知订阅。频道必须存在且已启用；inbox 默认 true、外部频道默认空。频道快照按业务世代与缓存修订双重校准；snapshot_ready=false 时外发暂停，但允许保存修复配置。
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageNotificationPreferences'}
      responses:
        '200':
          description: 已提交的订阅与快照状态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageNotificationSettings'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/storage/operations/preview:
    post:
      operationId: previewStorageRecovery
      security: [{session: []}]
      description: 创建五分钟有效的确认，绑定当前用户、域、方向、实例、epoch 与修订；不执行恢复。只可替换尚未接受的确认，queued/running 时拒绝。目标不得是当前活动成员，不能清空陌生或身份不符的数据库。
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageRecoveryRequest'}
      responses:
        '200':
          description: 源为保留数据的当前权威，目标为本次恢复对象；确认值必须原样提交。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageRecoveryPreview'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/storage/operations/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getStorageRecoveryOperation
      security: [{session: []}]
      description: 仅原确认用户可查，包括 awaiting_confirmation；过期或无权限均返回 404。接受后终态保留 30 天且最多 1000 条。卡片中操作消失不代表成功，只认此端点的终态。
      responses:
        '200':
          description: 操作的持久状态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageRecoveryOperation'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: acceptStorageRecovery
      security: [{session: []}]
      description: 原子排队后立即返回 202，由协调器执行，不在认证租约中等待切换。精确确认值为 domain/target/instance_uuid；人工提升必须显式接受数据丢失。重复提交已接受操作只返回原记录，不重做。409 storage_confirmation_stale 须重新预览；503 storage_commit_unknown 或网络结果不明时只能 GET 此 ID 核实，不自动重发。
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation, accept_data_loss]
              properties:
                confirmation: {type: string, minLength: 1}
                accept_data_loss: {type: boolean}
      responses:
        '202':
          description: 已接受，或返回之前已接受的操作；关闭客户端不取消工作。
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageRecoveryOperation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-channels:
    get:
      operationId: listNotificationChannels
      description: 管理员可列出通道。密钥与完整通道 URL 从不返回；secret_set 与 config.url_set 表示存在加密材料。
      responses:
        '200':
          description: 通道按创建时间再按 ID 排序；最多 20 个。
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels: {type: array, items: {$ref: '#/components/schemas/NotificationChannel'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNotificationChannel
      description: 仅限管理员。插入与 notification_channel.create 审计在同一事务提交。容量满时返回 409 notification_channel_capacity_reached。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NotificationChannelPatch'
                - required: [name, kind, enabled, config]
      responses:
        '201':
          description: 通道已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getNotificationChannel
      description: 管理员可读取通道元数据，不暴露通知凭据。
      responses:
        '200':
          description: 不含密钥材料的通道。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchNotificationChannel
      description: 仅限管理员。省略保留原值。Webhook 的 config.url 为只写字段，省略保留加密 URL；其他 config 替换完整的非密钥配置。secret 空字符串清除凭据；null 被拒绝。kind 不可变更。更新与 notification_channel.update 审计在同一事务提交。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationChannelPatch'}
      responses:
        '200':
          description: 通道已更新。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNotificationChannel
      description: 仅限管理员。在同一事务中删除通道、路由与投递记录，并写入 notification_channel.delete 审计。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 通道已删除。}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-channels/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: testNotificationChannel
      description: 仅限管理员。在同步投递（最长 10 秒）前审计并预留速率容量。已禁用的通道也可测试。凭据不可读时返回 409 secret_unreadable 并附修复指引。传输失败返回 200，ok 为 false 并附安全的 error_code。不返回凭据或响应体。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: 测试结果。
          content:
            application/json:
              schema:
                type: object
                required: [ok, error_code]
                additionalProperties: false
                properties:
                  ok: {type: boolean}
                  error_code: {type: string, description: 成功时为空；失败时为安全分类。}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      description: 管理员可读取近期投递记录，不含载荷、凭据或远端响应体。按 created_at 与 ID 降序；终态行保留 30 天。洪泛时保留带 coalesced_count 的摘要行。
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: before
          in: query
          schema: {type: string}
          description: 上一页的不透明 next_cursor。
      responses:
        '200':
          description: 投递日志页。
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, has_more]
                properties:
                  deliveries: {type: array, items: {$ref: '#/components/schemas/NotificationDelivery'}}
                  has_more: {type: boolean}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alert-silences:
    get:
      operationId: listAlertSilences
      description: 仅限管理员。返回尚未结束的静默窗口，按 starts_at、id 升序，名称来自当前分组或节点。
      responses:
        '200':
          description: 静默窗口集合。
          content:
            application/json:
              schema:
                type: object
                required: [silences]
                properties:
                  silences: {type: array, items: {$ref: '#/components/schemas/AlertSilence'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAlertSilence
      description: 仅限管理员。与 alert_silence.create 审计原子提交。静默仅在触发事务内判定，不回溯已有事件。结束或提前删除窗口后，下一轮评估补发仍在触发的静默事件。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertSilenceCreate'}
      responses:
        '201':
          description: 已创建的静默窗口。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertSilence'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alert-silences/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: deleteAlertSilence
      description: 仅限管理员。立即删除窗口，与 alert_silence.delete 审计原子提交。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 已删除。}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      description: 管理员可读取所有规则。最多 200 条规则（含已禁用的）。按创建时间再按 UUID 排序。
      responses:
        '200':
          description: 规则集合。
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: {type: array, items: {$ref: '#/components/schemas/AlertRule'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAlertRule
      description: 仅限管理员。规则插入与 alert_rule.create 审计原子提交。201 返回规则；容量 200 时返回 409 alert_rule_capacity_reached。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRuleCreate'}
      responses:
        '201':
          description: 已创建的规则。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alert-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAlertRule
      description: 管理员可读取规则。不存在的规则返回 404。
      responses:
        '200':
          description: 规则。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchAlertRule
      description: |
        仅限管理员。省略的成员保留原值。仅 scope_id、comparator 与 threshold 接受 null。
        合并后的规则须满足所有创建约束。变更 channel_ids 不重置待触发计时器或尚未恢复的事件。
        变更条件或作用域会重置待触发评估，并在下一次评估时将旧事件标记为已恢复。
        禁用同样在下一次评估时将尚未恢复的事件标记为已恢复。更新与 alert_rule.update 审计原子提交。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRulePatch'}
      responses:
        '200':
          description: 已更新的规则。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAlertRule
      description: 仅限管理员。删除与 alert_rule.delete 审计原子提交。事件历史在删除后保留；尚未恢复的事件在下一次评估时标记为已恢复。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 规则已删除。}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alerts:
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: listAlerts
      description: |
        管理员可读取告警事件。按 started_at DESC、id DESC 排序，使用键集分页。
        名称从当前规则与节点关联，删除后回退到事件快照。未知、重复或空的查询参数返回 400。
        已恢复的事件在恢复后保留 90 天，每小时限量清理。尚未恢复的事件永不过期。
        已配置的通知通道可投递告警事件。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema: {type: string, enum: [firing, resolved, all], default: all}
        - name: before
          in: query
          description: 上一页的不透明 next_cursor；规范的 timestamp/UUID 键集位置，严格早于最后一条事件。无效或空的游标返回 400。
          schema: {type: string, minLength: 90, maxLength: 90}
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 分页的告警事件。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, has_more]
                properties:
                  events: {type: array, items: {$ref: '#/components/schemas/AlertEvent'}}
                  has_more: {type: boolean}
                  next_cursor: {type: string, description: 仅当 has_more 为 true 时存在；作为 before 传入。}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alerts/summary:
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: getAlertSummary
      description: 管理员可从一次一致性读取快照中获取触发计数与最多五条最新触发事件。严重级别来自存储的规则快照；缺失或无法识别的严重级别计为 unknown。最新事件使用与 listAlerts 相同的字段，按 started_at DESC、id DESC 排序。
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 触发中的告警摘要。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertSummary'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: getAlertEvent
      description: 管理员可直接读取单条事件，无需搜索历史页。使用与 listAlerts 相同的当前名称关联与已删除来源的快照回退。拒绝查询参数。读取不标记任何站内通知为已读。
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 告警事件。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backups/exports:
    post:
      operationId: createBackupExport
      description: |
        仅限管理员；须携带 Origin 与 CSRF。接受一个或多个独立类别的后台导出。
        配置不会隐式添加。已提交的任务在断连与页面导航后仍存活。
        单 worker 执行任务；最多 32 个排队/运行中的任务。
        不提供自动下载、取消或任务重试端点。
        拒绝查询参数。生成的归档为 .tar.gz.age；
        其独立的恢复密码须由管理员另行保存。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categories]
              properties:
                categories: {$ref: '#/components/schemas/BackupCategories'}
      responses:
        '202':
          description: 排队的导出已接受；不返回明文密码。
          headers:
            Location:
              schema: {type: string, examples: [/api/v1/tasks/00000000-0000-4000-8000-000000000001]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupTask'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429':
          description: backup_queue_full；须等待活跃任务完成后再提交新导出。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backup-plans:
    get:
      operationId: listBackupPlans
      description: 所有已认证管理员均可用。不含凭据的计划按 created_at DESC、id DESC 排序。仅接受 limit 与 before；未知、重复、空或格式错误的查询参数返回 400 invalid_input。时区元数据描述服务器进程，而非浏览器。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventBefore'
      responses:
        '200':
          description: 分页的备份计划与服务器时区元数据。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlanPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBackupPlan
      description: |
        仅限管理员；须携带 Origin 与 CSRF。新计划默认禁用、仅配置类、
        Cron 0 3 * * *、本地 retain_count 7。对象存储计划须完整凭据。
        本地路径须已存在、可写、属运行用户、权限 0700 且无符号链接；
        服务器不创建所选目录，也不修改其权限。对象存储保留策略由服务商管理，
        不要发送 retain_count。保存不测试连接。
        拒绝查询参数与显式 null 字段。启用后安排下一次未来运行，不立即重放历史周期。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupPlanCreate'}
      responses:
        '201':
          description: 已保存的计划，不含凭据材料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backup-plans/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getBackupPlan
      description: 仅限管理员。不返回凭据或密文。拒绝查询参数。计划不存在返回 404 backup_plan_not_found；存储凭据不可读返回 409 secret_unreadable。
      responses:
        '200':
          description: 含下次运行预览与最新任务摘要的备份计划。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateBackupPlan
      description: |
        仅限管理员；须携带 Origin 与 CSRF。省略的字段（含 destination 内各字段）保留原值；
        显式 null 被拒绝。kind 不可变更。省略凭据保留加密凭据。
        替换须同时提供 access_key_id 与 secret_access_key；省略 session_token 清除旧令牌。
        切勿提交脱敏占位符。变更 provider 还须同时提供 endpoint、region 与完整替换凭据。
        启用或变更 Cron 会安排下一次未来运行；其他编辑保留现有 next_run_at。
        排队/运行中的计划任务导致 409 backup_plan_busy（含禁用时）。
        拒绝查询参数。字段校验返回 400 validation_failed 并附 fields。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupPlanPatch'}
      responses:
        '200':
          description: 已更新的不含凭据的计划。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteBackupPlan
      description: 仅限管理员；须携带 Origin 与 CSRF。不删除历史或已保存的归档。排队/运行中的任务导致 409 backup_plan_busy；计划不存在返回 404 backup_plan_not_found。拒绝查询参数。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 计划已删除；归档与任务历史保留。}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/backup-plans/preview:
    post:
      operationId: previewBackupCron
      description: 仅限管理员；虽为纯计算仍须携带 Origin 与 CSRF。返回服务器进程时区的三次运行时间；无网络访问或持久化。无效 Cron 返回 400 validation_failed 并附 fields.cron。拒绝查询参数。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cron]
              properties:
                cron: {$ref: '#/components/schemas/BackupCron'}
      responses:
        '200':
          description: 未来三次运行与时区元数据。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupCronPreview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks:
    get:
      operationId: listBackupTasks
      description: 仅限管理员。仅列出备份/导出任务，按 created_at DESC、id DESC 排序。终态任务在完成后 90 天内可见；活跃任务不过期。仅接受 limit 与 before；未知、重复、空或格式错误的查询参数返回 400 invalid_input。不返回或解密密码、凭据材料或内部暂存路径。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventBefore'
      responses:
        '200':
          description: 安全的任务页。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupTaskPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getBackupTask
      description: 仅限管理员。即使不在当前列表页也可直接安全读取详情；不解密密码。不存在或不再可见的任务返回 404 task_not_found。拒绝查询参数。可用性在读取时评估，独立于保留清理。
      responses:
        '200':
          description: 含当前下载/密码可用性的安全任务详情。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupTask'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks/{id}/download:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: downloadBackupExport
      description: |
        须管理员会话；普通同源附件下载，非 JSON 也非公开/预签名链接。
        仅成功且非恢复的手动导出有可下载产物，有效期至完成后 24 小时。
        本地/对象存储计划归档不复制到下载区。任务 UUID 选择文件；
        result_location 仅供展示。Range 与条件请求使用 ServeContent。
        仅此路由允许最长 30 分钟的写入；客户端取消即停止读取。拒绝查询参数。
      parameters:
        - name: Range
          in: header
          schema: {type: string}
          description: 可选的 HTTP 字节范围请求。
      responses:
        '200':
          $ref: '#/components/responses/BackupArchive'
        '206':
          $ref: '#/components/responses/BackupArchive'
        '304': {description: 根据条件请求头未修改。}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: artifact_not_ready；手动导出尚未成功或尚无产物过期时间。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: artifact_expired 或 artifact_missing；计划任务或恢复历史任务无本地导出产物时同样返回。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '416': {description: 请求的字节范围无法满足；标准 ServeContent 响应，非 JSON API 错误。}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tasks/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: revealBackupPassword
      description: |
        仅限管理员；须携带 Origin 与 CSRF。显式的受审计明文密码读取；无需请求体。
        GET/列表/详情从不解密密码。仅非恢复的成功任务或 storage_outcome_unknown 的失败任务可申请，
        且须归档名称/哈希/位置完整、存储密码未过期。存储结果未知仍为失败而非成功。
        密码在完成后 90 天过期；须分别保存。密码不随归档上传，
        原始服务器密钥丢失后无法恢复，除非已独立保存。
        拒绝查询参数。审计仅记录任务 ID，不记录密码。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: 显式的恢复密码响应。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPassword'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404':
          description: task_not_found 或 password_unavailable；包括发布前失败与恢复历史。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: secret_unreadable；当前服务器密钥无法解密存储的密码。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: password_expired；超出历史保留期的任务返回 404 task_not_found。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications:
    get:
      operationId: listInboxNotifications
      description: |
        所有管理员共享任务、告警与存储故障通知。各账户的已读状态独立；
        新账户可读取保留的共享事件。通知保留 90 天。
        按 created_at DESC、id DESC 排序，使用键集分页。
        未知、重复、空或格式错误的查询参数返回 400 validation_failed。
        GET 从不标记已读，也不返回密码、凭据或内部序列号。
        read_through 覆盖同一读事务中所有保留通知（非仅本页或未读过滤），
        且是插入序号最大的 UUID，而非 created_at 或 UUID 最大的。
        全部已读时原样使用。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventBefore'
        - name: unread
          in: query
          schema: {type: boolean, default: false}
          description: 仅接受字面量 true 和 false；true 过滤为当前账户的未读通知。
      responses:
        '200':
          description: 收件箱页与全部已读水位线。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/summary:
    get:
      operationId: getInboxSummary
      description: 须会话。在一次读事务中返回当前账户的未读计数与插入序号最大的通知 UUID，不标记已读。这是收件箱未读状态，非触发告警计数。拒绝查询参数。
      responses:
        '200':
          description: 一致的未读摘要。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxSummary'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getInboxNotification
      description: 须会话。通知不存在返回 404 not_found。即使来源任务或告警已过期或删除，仍返回不可变的安全快照；存储故障快照不对应任务或告警 ID。快照的可用性标志是历史的，须获取任务详情了解当前可用性。GET 从不标记已读。拒绝查询参数。
      responses:
        '200':
          description: 通知快照与当前账户的已读标志。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxNotification'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      operationId: markInboxNotificationRead
      description: 管理员仅可标记自己的通知为已读。须携带 Origin 与 CSRF；不接受客户端提供的用户身份。幂等；通知不存在返回 404 not_found。仅支持 read true。拒绝查询参数。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read: {type: boolean, const: true}
      responses:
        '204': {description: 仅为当前用户记录已读状态。}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications/read-all:
    post:
      operationId: markInboxNotificationsRead
      description: |
        管理员可标记自己的通知为已读；须携带 Origin 与 CSRF。
        through 须为列表先前返回的非空 read_through UUID。
        服务器解析该保留记录的插入序号，仅标记序号小于等于它的记录。
        即使时间戳相同、UUID 更小或时钟回拨，更新的插入仍保持未读。
        不存在或已清理的水位线返回 404 not_found，不标记任何内容。
        无效 UUID 返回 400 并附 fields.through。不接受客户端用户 ID。拒绝查询参数。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [through]
              properties:
                through: {type: string, format: uuid}
      responses:
        '204': {description: 当前账户水位线及之前的通知已标记为已读。}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      description: 所有已认证管理员均可用。返回按 created_at DESC、id DESC 排序的持久化事件。有新事件到达时用 next_cursor 作为 before 实现稳定遍历；before 在 limit/offset 校验后忽略 offset。details 为 JSON 对象，不含凭据。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: before
          in: query
          description: 上一页的不透明 next_cursor。按排序返回严格早于该事件的事件，忽略 offset。无效或空的游标返回 400 validation_failed。
          schema: {type: string, minLength: 90, maxLength: 90}
      responses:
        '200':
          description: 分页的审计事件。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
                  has_more: {type: boolean, description: 本页之后是否还有其他事件。}
                  next_offset: {type: integer, minimum: 0, description: 仅当 has_more 为 true 时存在。续接偏移仅在省略 before 时可用。游标请求须用 next_cursor 续接，因为 before 忽略 offset。}
                  next_cursor: {type: string, description: 仅当 has_more 为 true 时存在。最后一条返回事件的不透明游标；作为 before 传入以获取更早事件。}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes:
    get:
      x-read-only-token: true
      x-read-only-token-response:
        $ref: "#/components/schemas/TokenNodePage"
      security:
        - session: []
        - bearerAuth: []
      operationId: listNodes
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 按创建时间再按 UUID 排序；包含待注册与已禁用的资产。
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TokenNodePage'
                  - type: object
                    required: [nodes, has_more]
                    properties:
                      nodes:
                        type: array
                        items: {$ref: '#/components/schemas/Node'}
                      has_more: {type: boolean, description: 本页之后是否还有其他节点。}
                      next_offset: {type: integer, minimum: 0, description: 仅当 has_more 为 true 时存在。作为 offset 传入获取下一页。}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createPendingNode
      description: 仅限管理员。容量计入所有节点（含待注册与已禁用的）。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
      responses:
        '201':
          description: 已创建持久的待注册身份。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      x-read-only-token: true
      x-read-only-token-response:
        $ref: "#/components/schemas/TokenNode"
      security:
        - session: []
        - bearerAuth: []
      operationId: getNode
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 不含凭据的节点视图。
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/Node'}
                  - {$ref: '#/components/schemas/TokenNode'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateNodeMetadata
      description: 仅限管理员。省略的字段不变；null 字符串字段也不变。空字符串清除 notes/region/provider，group_id null 解绑分组，tags [] 清除全部标签。元数据变更不替换节点凭据，也不声明 Agent 活动。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: [string, 'null'], x-minLengthBytes: 1, x-maxLengthBytes: 255, description: 非空白名称；null 保持不变。}
                expires_on: {type: [string, 'null'], format: date, description: 真实的 YYYY-MM-DD 日期；省略保持不变，null 清除。}
                notes: {type: [string, 'null'], description: 空字符串清除；null 保持不变。}
                region: {type: [string, 'null'], description: 空字符串清除；null 保持不变。}
                provider: {type: [string, 'null'], description: 空字符串清除；null 保持不变。}
                group_id:
                  type: [string, 'null']
                  format: uuid
                  description: 已有分组的 UUID，或 null 清除归属。
                tags:
                  type: [array, 'null']
                  uniqueItems: true
                  items: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255, description: 非空白标签；字符串不去除首尾空白，也不做规范化。}
                  description: 替换全部标签；[] 清除，null 保持不变。拒绝完全重复的字符串。响应按字典序排序标签。
      responses:
        '200':
          description: 完整的已更新节点元数据。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNode
      description: 仅限管理员。原子地吊销身份、取消尚在排队的工作并删除资产。更新结果保留其 ID。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
        - name: confirm
          in: query
          required: true
          schema: {type: boolean, const: true}
      responses:
        '204': {description: 资产已删除，身份已吊销。}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/history:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: getNodeHistory
      description: 所有已认证管理员均可用。尽力而为的历史，约每分钟刷盘一次。缺失或失败的测量与间隙不产生数据点。网络速率对成功接口求和。磁盘百分比为所有成功选定磁盘的已用字节总量除以总容量。metric 和 range 各须恰好出现一次；disk 可选且最多一次，仅用于 disk_used_percent 和 inode_used_percent，值为绝对路径。不指定 disk 时按成功磁盘的容量加权聚合；不存在的路径返回空 points。拒绝未知参数。1h 与 6h 使用 1 分钟桶，24h 与 7d 使用 5 分钟桶，30d 使用 1 小时桶。聚合平均值按测量次数加权。已禁用的历史存储返回空 points 数组。未知节点返回 node_not_found。
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [cpu_percent, memory_used_percent, swap_used_percent, load1, load5, load15, disk_used_percent, inode_used_percent, net_rx_bytes_per_second, net_tx_bytes_per_second, disk_read_bytes_per_second, disk_write_bytes_per_second, disk_busy_percent, pressure_cpu_percent, pressure_memory_percent, pressure_io_percent, temperature_celsius]
        - name: range
          in: query
          required: true
          schema: {type: string, enum: [1h, 6h, 24h, 7d, 30d, 90d]}
        - name: disk
          in: query
          required: false
          description: 绝对磁盘路径，仅适用于 disk_used_percent 和 inode_used_percent；省略时返回聚合。
          schema: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 升序的 UTC 桶时间戳；无 null 或合成的间隙点。范围起点处的相交桶可能早于精确截止点不到一个步长。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricHistory'}
        '400':
          description: 查询参数无效或缺失时返回 validation_failed。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: getNodeAvailability
      description: 管理员读取连续 UTC 天的可用性，包含今天。缺失观测为未知；百分比仅统计在线和离线秒数，未观测时为 null。有离线秒数时最高为 99.99。未知节点返回 node_not_found。
      parameters:
        - name: days
          in: query
          schema: {type: integer, enum: [30, 90], default: 30}
          description: 只接受 30 或 90；拒绝重复或未知参数。
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 旧到新排列的每日可用性及按秒加权汇总。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilitySummary'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/traffic:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      x-read-only-token: true
      security:
        - session: []
        - bearerAuth: []
      operationId: getNodeTraffic
      description: 所有已认证管理员均可用。返回最近 N 天（含今天）的 UTC 每日流量及当前 UTC 计费周期总计。可选 days 参数默认 30；提供时须恰好出现一次且为 1 到 400 的整数。拒绝未知参数。每日结果合并保留的日聚合与小时数据，仅包含有流量的天。未知节点返回 node_not_found。
      parameters:
        - name: days
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 400, default: 30}
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 流量总计。字节计数为规范的无符号十进制字符串。计费周期不含结束时刻。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficSummary'}
        '400':
          description: 查询参数格式错误、重复、未知或超出范围时返回 validation_failed。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/probes:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      x-read-only-token: true
      x-read-only-token-response:
        $ref: "#/components/schemas/TokenProbeSummary"
      security:
        - session: []
        - bearerAuth: []
      operationId: getNodeProbes
      description: 所有已认证管理员均可用。按期望配置顺序为每个当前配置的探测目标返回一条；已从配置移除的目标不返回结果。最新结果与小时计数按合并的接收事务节奏持久化，响应可能滞后上报约 30 秒。24 小时窗口包含大于等于当前 UTC 小时减 23 小时的 UTC 小时，无单独的上截止。未知节点返回 node_not_found。
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 当前服务探测状态与 24 小时可用率聚合。
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/ProbeSummary'}
                  - {$ref: '#/components/schemas/TokenProbeSummary'}
        '404': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/probes/history:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      security:
        - session: []
      operationId: getNodeProbeHistory
      description: Hourly latency for a target configured under the current node identity. Read-only API tokens are forbidden. Windows include hours at or after the current UTC hour minus 23 hours (24h) or 167 hours (7d), with no separate upper cutoff. Removed targets and fenced identities return an empty array. Missing nodes return node_not_found.
      parameters:
        - name: target
          in: query
          required: true
          schema: {type: string, minLength: 1, x-maxLengthBytes: 1024}
          description: Target validated with the service-probe target rules.
        - name: range
          in: query
          required: true
          schema: {type: string, enum: [24h, 7d]}
      responses:
        '200':
          description: Stored hours in ascending order; latency values are null for all-failed hours.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeHistory'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/latest:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      x-read-only-token: true
      x-read-only-token-response:
        $ref: "#/components/schemas/TokenLatestSample"
      security:
        - session: []
        - bearerAuth: []
      operationId: getNodeLatest
      description: 所有已认证管理员均可用。返回当前节点身份最新接受的内存上报，不含凭据、run_generation 或 session_id。节点不存在、服务器启动后无上报、节点已禁用或身份已失效均返回 404 node_not_found。值为最新采样，可能已过期；received_at 是服务端接收时间，非存活保证。上报省略 system 时为 null；agent_version 在持久化节点视图中仍可用。
      responses:
        '429':
          description: rate_limited; whole seconds until one request is available.
          headers:
            Retry-After: {schema: {type: string, pattern: '^[1-9][0-9]*$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: 最新的私有遥测采样。
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/LatestSample'}
                  - {$ref: '#/components/schemas/TokenLatestSample'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/public-settings:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodePublicSettings
      description: 所有已认证管理员均可用。返回独立的公开设置，包括待注册或已禁用的节点；不从内部节点元数据填充任何值。
      responses:
        '200':
          description: 完整的公开设置；遗留的空设置默认为禁用且文本为空。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchNodePublicSettings
      description: |
        仅限管理员；须携带受信任的配置 Origin 与本会话的 CSRF 令牌。
        省略或 null 的字段保持不变；空字符串清除文本。
        文本先去除首尾空白，再校验 UTF-8 字节长度；无效 UTF-8 与控制字符会被拒绝，不会被静默移除。
        合并后的设置在 enabled 为 true 时须有非空的公开名称。无效设置返回 400
        validation_failed，字段键为 name、region 和/或 provider，
        原有设置全部保持不变。未知字段被拒绝。

        在一个事务中读取、合并、校验、持久化并插入带操作者的
        node.public_settings.patch 审计事件；审计 details 为 {}，
        审计插入失败回滚设置。有效的无变更补丁同样审计。
        变更不修改内部元数据或凭据。停用发布保留公开文本供复用。
        设置可在注册前或禁用时保存，但节点须注册且启用后才会展示；
        保存不建立在线状态，也不证明已收到上报。

        发布时暴露配置的名称、区域与服务商，以及有效时的 CPU、
        内存百分比、一分钟负载与运行时长。公开文本刻意独立且默认为空，
        绝不来自私有元数据。不要输入 IP 地址、主机名、域名或凭据。
        不承诺自动机密检测或脱敏。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicSettingsPatch'}
      responses:
        '200':
          description: 完整的已保存公开设置，不声明节点在线。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/credential:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    delete:
      operationId: revokeNodeCredential
      description: |
        仅限管理员；须携带受信任的配置 Origin 与本会话的 CSRF 令牌。
        在一个受审计的事务中清除凭据、安装绑定、运行时、last_seen、system、
        上报身份与探测观测。元数据、流量计费、累计流量、首次注册与公开设置保留。
        节点变为待注册（已禁用的保持禁用）并从公开页消失；其 Agent 下次请求收到 401。
        签发新的单节点注册票据以绑定新安装。对已吊销节点再次吊销仍成功。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 凭据已吊销}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{id}/commands:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: 为分组节点创建 upgrade、restart 或 stop 指令
      description: confirm 必须等于分组名。每节点独立事务；已运行目标版本、不允许、已有活动指令或不可用的节点计入 skipped，单节点失败不影响其他节点。upgrade 有效期十五分钟，restart/stop 五分钟。节点数不设接口上限。
      security: [{session: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, confirm]
              allOf: [{$ref: '#/components/schemas/CommandTargetConstraint'}]
              properties:
                kind: {type: string, enum: [upgrade, restart, stop]}
                target_version: {$ref: '#/components/schemas/Command/properties/target_version'}
                confirm: {type: string}
      responses:
        '200':
          description: 批量结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [created, skipped]
                properties:
                  created: {type: integer, minimum: 0}
                  skipped: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/commands:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 最近 20 条 Agent 指令
      security: [{session: []}]
      responses:
        '200':
          description: 按创建时间倒序，最多 20 条。
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/CommandRecord'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: 创建 upgrade、restart 或 stop 指令
      description: upgrade 有效期十五分钟，restart/stop 五分钟；目标版本必须是无前导零的 MAJOR.MINOR.PATCH。stop 的 confirm 必须等于节点名。未观测 runtime 或本地不允许返回 409 command_not_allowed；已有活动指令返回 409 command_active；禁用、已关闭或未注册返回 409 node_unavailable。upgrade 已是目标版本返回 409 command_same_version。
      security: [{session: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              allOf: [{$ref: '#/components/schemas/CommandTargetConstraint'}]
              properties:
                kind: {type: string, enum: [upgrade, restart, stop]}
                target_version: {$ref: '#/components/schemas/Command/properties/target_version'}
                confirm: {type: string}
      responses:
        '201':
          description: 已排队
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandRecord'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/commands/{command_id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: command_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: 仅取消 pending 指令
      security: [{session: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '204': {description: 已取消}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/runtime:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getAgentRuntime
      description: 当前凭据最后接受的运行时，绝非服务端期望配置。有效上报前为 null；凭据替换或吊销清除观测。已移除的 /config 路由返回 404。
      responses:
        '200':
          description: Agent 持有的运行时观测。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runtime]
                properties:
                  runtime:
                    oneOf:
                      - {$ref: '#/components/schemas/RuntimeSettings'}
                      - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/traffic-settings:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getTrafficSettings
      responses:
        '200':
          description: 由服务器管理的计费设置；从不发送给 Agent。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficSettings'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchTrafficSettings
      description: 省略的字段保持不变；null、未知键与错误类型被拒绝。变更的值与 node.traffic_settings.patch 审计一起提交；未变更的值不产生审计事件。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                billing_mode: {$ref: '#/components/schemas/BillingMode'}
                billing_day: {type: integer, minimum: 1, maximum: 28}
                quota_bytes: {$ref: '#/components/schemas/DecimalCounter'}
      responses:
        '200':
          description: 已保存的计费设置。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficSettings'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/batch:
    post:
      operationId: batchNodes
      description: 仅限管理员。须显式提供唯一 UUID，不支持隐式全选。每个节点独立事务，结果保持请求顺序。禁用保留凭据但拒绝该节点的上报与凭据恢复（403 node_disabled），直至重新启用。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node_ids, action]
              properties:
                node_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: {type: string, format: uuid}
                action: {type: string, enum: [disable, enable, delete]}
                confirm: {type: boolean, default: false, description: 删除时须为 true。}
      responses:
        '200':
          description: 每个选定 ID 一条结果，包括不存在的节点与存储失败。
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [node_id, status]
                      properties:
                        node_id: {type: string, format: uuid}
                        status: {type: string, enum: [succeeded, failed]}
                        error_code: {type: string, enum: [node_not_found, storage_error]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/enrollments:
    get:
      operationId: listEnrollments
      description: 仅限管理员。返回元数据，不含令牌明文或哈希。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 分页的注册票据元数据。
          content:
            application/json:
              schema:
                type: object
                required: [enrollments, has_more]
                properties:
                  enrollments: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
                  has_more: {type: boolean, description: 本页之后是否还有其他注册票据。}
                  next_offset: {type: integer, minimum: 0, description: 仅当 has_more 为 true 时存在。作为 offset 传入获取下一页。}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createEnrollment
      description: 仅限管理员。节点及分组部署票据均在 30 分钟后过期，仅可成功激活一次，受全局节点容量约束。仅此响应暴露原始令牌和服务端构建版本。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: 须恰好提供 node_id 或 group_id，未知字段会被拒绝。
              properties:
                node_id: {type: string, format: uuid}
                group_id: {type: string, format: uuid}
              oneOf:
                - required: [node_id]
                  not: {required: [group_id]}
                - required: [group_id]
                  not: {required: [node_id]}
      responses:
        '201':
          description: 票据及一次性明文令牌。
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Enrollment'}
                  - {type: object, required: [token, server_version], properties: {token: {type: string, writeOnly: false}, server_version: {type: string, description: 服务端构建版本；仅签发响应提供。}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/enrollments/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getEnrollment
      description: 仅限管理员；不含凭据材料。
      responses:
        '200':
          description: 票据元数据。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeEnrollment
      description: 仅限管理员。立即阻止尚未消费票据的激活。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: 已吊销。}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/enroll:
    post:
      operationId: enrollAgent
      security: [{enrollmentBearer: []}]
      description: |
        发送前须先保存身份。票据仅允许一次成功激活，以完整事务提交为准；同一请求重放也会失败。
        缺失、过长、未知、过期、吊销或已消费的票据统一返回 403 forbidden，
        消息固定为 Enrollment ticket is unavailable。旧多次票据只要 uses 大于 0 也立即失效。
        有效且未消费票据的安装/令牌绑定冲突返回 409 enrollment_conflict。
        新的节点绑定票据可原子地轮换同一安装的凭据并使旧凭据失效。
        替换已有凭据时，previous_node_token 须在领取事务内与当前凭据完全匹配；
        证明已失效或缺失返回 enrollment_conflict，不更改凭据、所有权隔离标记（fence）、使用次数或认领记录。
        客户端将新的 256-bit 候选令牌与当前令牌分别持久化暂存，以当前令牌作为 CAS 证明，
        仅在确认接受后才将候选令牌设为当前令牌。响应丢失时可单独使用 POST /api/agent/v1/recover
        确认已保存的凭据，包括 run_generation 为 0 的身份；显式票据的 403 不自动转为恢复。
        只读票据查找先于请求体读取与写事务，领取时会在事务中重新执行全部授权校验。
        无效/缺失凭据使用有界的客户端 IP 令牌桶与全局令牌桶
        （突发容量分别为 32 与 256，均每秒补充一个令牌）；客户端 IP 遵循可信代理配置，源端口不参与选择桶。
        耗尽无效凭据预算仍返回相同的 403 forbidden，并附 Retry-After。
        初步判定可用的票据绕过这些无效凭据限流桶。对端状态最多 1024 条，超出时逐出最旧条目。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, installation_id, node_token]
              properties:
                protocol_version: {const: 1}
                installation_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
                node_token: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
                previous_node_token:
                  type: string
                  writeOnly: true
                  x-minLengthBytes: 32
                  x-maxLengthBytes: 256
                  description: 精确的当前凭据证明，仅在替换已注册的凭据时必填。从不返回或记录日志。
                system:
                  allOf:
                    - {$ref: '#/components/schemas/System'}
                  unevaluatedProperties: false
      responses:
        '200':
          description: 由服务器选定并持久化的绑定。
          content:
            application/json:
              schema:
                type: object
                required: [node_id, server_time]
                properties:
                  node_id: {type: string, format: uuid}
                  server_time: {type: string, format: date-time}
        '403':
          description: forbidden；票据不可用，消息固定为 Enrollment ticket is unavailable。无效凭据预算耗尽时附 Retry-After。
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 有效且未消费票据的身份或当前凭据证明冲突，或节点容量不足。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/enroll/check:
    post:
      operationId: checkAgentEnrollmentClaim
      security: [{enrollmentBearer: []}]
      description: 只读票据预检，用于识别本地 NodeID 丢失但凭据已绑定的情况。在读取请求体前执行与注册相同的票据准入检查；在一个读取快照中验证票据未消费、未吊销且未过期，并检查精确的凭据/安装绑定。不创建节点、不消耗票据、不轮换凭据、不重置隔离标记（fence）、不刷新在线状态、不产生成功审计。成功仅返回 claimed 为 false、credential_state 为 active 或 unbound 及 server_time，不返回 node_id。失效票据与注册相同，统一返回 403 forbidden 及固定消息 Enrollment ticket is unavailable；无效凭据预算耗尽时仍为 403 并附 Retry-After。预检成功不保证稍后的激活成功，激活事务会重新授权。请求体上限 64 KiB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, installation_id, node_token]
              properties:
                protocol_version: {const: 2, description: 票据预检版本；注册与上报仍为版本 1。版本 1 的检查在任何领取前以 426 拒绝。}
                installation_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
                node_token: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
      responses:
        '200':
          description: 可用票据及凭据绑定状态；从不返回节点 ID、会话或节点凭据。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [claimed, credential_state, server_time]
                properties:
                  claimed: {type: boolean, const: false}
                  credential_state:
                    type: string
                    enum: [active, unbound]
                    description: 同一读取快照中精确的凭据/安装绑定。缺失/未知状态由客户端在暂存前拒绝。
                  server_time: {type: string, format: date-time}
        '403':
          description: forbidden；票据不可用，消息固定为 Enrollment ticket is unavailable。无效凭据预算耗尽时附 Retry-After。
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/recover:
    post:
      operationId: recoverAgentEnrollment
      security: [{nodeBearer: []}]
      description: 无副作用地确认已保存的节点凭据及其安装绑定，包括首次采集之前。未知凭据在读取请求体前即被拒绝。一次读取同时验证凭据与安装是否完全匹配；不更新在线状态、代次、会话、上报准入或配置确认。已禁用的节点收到 403 node_disabled。请求从不包含目标 node_id。客户端先尝试已持久化的候选凭据，仅在 401 后才尝试当前凭据，校验返回的身份，且仅在确认后才将候选凭据设为当前凭据。不支持 GET 与 HEAD。请求体上限 64 KiB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
      responses:
        '200':
          description: 已认证的安装绑定，不变更遥测。
          content:
            application/json:
              schema:
                type: object
                required: [node_id, server_time]
                properties:
                  node_id: {type: string, format: uuid}
                  server_time: {type: string, format: date-time}
        '401':
          description: unauthenticated；已保存的节点凭据或安装绑定无效。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent/v1/report:
    post:
      operationId: reportAgent
      security: [{nodeBearer: []}]
      description: |
        仅限 POST 的遥测上报；恢复使用 /api/agent/v1/recover，无需上报。
        目标完全来自 Bearer 认证。请求体上限 64 KiB；每节点每秒一个请求，突发容量为三。
        认证与准入先于请求体读取，处理时在事务中重新校验凭据是否完全匹配。
        新代次替换持久化的会话隔离标记（fence）；旧代次或同代次不同会话返回 409。
        重复/旧序号无法替换 latest、last_seen、runtime，也无法重新添加已移除的探测目标。
        latest/序号状态仅存于当前进程，不属于持久历史。runtime 必填且由 Agent 管理；
        探测结果须属于本次上报的 runtime。接受的 runtime 变更受现有身份隔离标记约束，
        持久化时移除已过时的探测观测。已禁用节点在读取请求体前收到 403。不返回期望配置。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Report'}
      responses:
        '200':
          description: 已接受的实时序号。流量确认覆盖已提交的计数器与服务器丢弃的过期条目。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportResponse'}
        '413': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '429':
          description: 已限流。
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: obt_ + base64url(32 random bytes)
      description: 只读 API 令牌，仅允许显式标记的 GET 操作；携带 obt_ 令牌时优先于 Cookie，其他管理路由返回 token_forbidden。每个令牌桶容量等于每分钟限额，每秒补充限额的 1/60；覆盖值优先于全局值（默认 600，范围 1–100000）。重启重置；禁止路由也计费。
    session:
      type: apiKey
      in: cookie
      name: orbitbeacon_session
      description: 仅主机（无 Domain）、HttpOnly、SameSite=Lax、Path=/；仅当配置的公开 Origin 为 HTTPS 时设置 Secure，从不从 Host 或转发头推断。
    enrollmentBearer:
      type: http
      scheme: bearer
      description: 短生命周期的注册密钥，切勿放入 URL。
    nodeBearer:
      type: http
      scheme: bearer
      description: 每节点凭据，服务端仅存储 SHA-256。
  parameters:
    LiveNodeID:
      name: node_id
      in: query
      required: false
      description: 省略返回集群状态；提供一个 UUID 返回详情。重复与未知的查询参数无效。
      schema: {type: string, format: uuid}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: 须匹配配置的规范 HTTP/HTTPS 公开 Origin（DNS 小写、IPv6 规范化、省略默认 HTTP 80 或 HTTPS 443 端口），从不使用请求 Host 或转发头。
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      description: 本会话登录或 GET /api/v1/me 返回的稳定令牌。
    NodeID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    EventBefore:
      name: before
      in: query
      description: 上一页的不透明 next_cursor；规范的 created_at/UUID 键集位置。按 created_at DESC、id DESC 返回严格更早的记录。须恰好提供一次且非空；无效游标返回 400。
      schema: {type: string, minLength: 90, maxLength: 90}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  requestBodies:
    GroupName:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
  responses:
    PublicEntryRedirect:
      description: 公开页已禁用；按当前会话选择重定向。
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
        Location:
          schema: {type: string, enum: [/login, /overview, /change-password]}
    PublicPageDisabled:
      description: 全局公开页已禁用；code 为 public_page_disabled，无节点数据，与会话 Cookie 无关。
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: public_page_disabled
            message: Public page is disabled.
            request_id: 00000000-0000-4000-8000-000000000001
    BackupArchive:
      description: 加密的 .tar.gz.age 附件，或其请求字节范围。不含恢复密码。
      headers:
        Content-Disposition:
          schema: {type: string}
          description: 以任务归档文件名作为 attachment。
        Cache-Control:
          schema: {type: string, const: no-store}
        X-Content-Type-Options:
          schema: {type: string, const: nosniff}
        Accept-Ranges:
          schema: {type: string, const: bytes}
        Content-Range:
          schema: {type: string}
          description: 部分响应时存在。
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    Error:
      description: 结构化失败。无效 JSON/输入或未变更的新密码（password_unchanged）返回 400，无效凭据返回 401，浏览器 Origin/CSRF 失败、受限管理会话（password_change_required）、全局禁用的匿名访问（public_page_disabled）或已禁用节点的 Agent 请求返回 403，资源不存在返回 404，计划忙碌/密钥/注册/身份/用户名或最后管理员冲突返回 409，过期或缺失的备份产物/密码返回 410，超过 64 KiB 的请求体返回 413，不支持的 Agent 协议返回 426，限流或备份队列容量返回 429。存储锁争用返回 503 storage_busy，准入暂不可用返回 503 storage_unavailable，均附 Retry-After。COMMIT 结果未知返回 503 storage_commit_unknown，不附重试提示，客户端先核对当前状态，不直接重发写入。不支持的方法在认证前返回 405 并附 Allow；未知 API 路由返回 404。API 错误不返回 SPA 外壳。
      headers:
        X-Request-ID:
          schema: {type: string, format: uuid}
        Allow:
          description: 405 时存在；列出该路由支持的方法。
          schema: {type: string}
        Retry-After:
          description: 限流 429 与可重试存储 503 时存在；延迟秒数。backup_queue_full 和 storage_commit_unknown 不包含此头。
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    APITokenSettings:
      type: object
      additionalProperties: false
      required: [rate_limit_per_minute]
      properties:
        rate_limit_per_minute: {type: integer, minimum: 1, maximum: 100000}
    APIToken:
      type: object
      required: [id, name, created_by, created_by_username, created_at, expires_at, last_used_at, rate_limit_per_minute]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_by: {type: string, format: uuid}
        created_by_username: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        rate_limit_per_minute: {type: [integer, 'null'], minimum: 1, maximum: 100000}
    TokenNodePage:
      type: object
      additionalProperties: false
      required: [nodes, has_more]
      properties:
        nodes: {type: array, items: {$ref: '#/components/schemas/TokenNode'}}
        has_more: {type: boolean}
        next_offset: {type: integer}
    TokenLatestSample:
      type: object
      additionalProperties: false
      required: [received_at, sampled_at, seq, metrics, server_time]
      properties:
        received_at: {type: string, format: date-time}
        sampled_at: {type: string, format: date-time}
        seq: {type: integer, minimum: 0}
        metrics: {$ref: '#/components/schemas/Metrics'}
        server_time: {type: string, format: date-time}
    TokenProbeSummary:
      type: object
      additionalProperties: false
      required: [probes]
      properties:
        probes: {type: array, items: {$ref: '#/components/schemas/TokenProbeStatus'}}
    TokenProbeStatus:
      type: object
      additionalProperties: false
      required: [status, latency_ms, status_code, checked_at, tls_expires_at, uptime_24h, checks_24h]
      properties:
        status: {type: string}
        latency_ms: {type: [number, 'null']}
        status_code: {type: [integer, 'null']}
        tls_expires_at: {type: [string, 'null'], format: date-time, description: HTTPS leaf certificate expiry when a response arrived.}
        checked_at: {type: [string, 'null'], format: date-time}
        uptime_24h: {type: [number, 'null']}
        checks_24h: {type: integer}
    TokenNode:
      type: object
      additionalProperties: false
      required: [id, name, status, expires_on, region, provider, group_id, tags, created_at, last_seen, presence, agent_version, stopped]
      properties:
        stopped: {type: boolean, description: 最新 stop 成功，且收到它的进程和凭据仍是节点当前值；任何新进程上报后清除。}
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [pending, online, offline, unknown, disabled]}
        expires_on: {type: [string, 'null'], format: date}

        region: {type: string}
        provider: {type: string}
        group_id:
          type: [string, 'null']
          format: uuid
        tags:
          type: array
          description: 已排序的标签字符串；无标签节点返回 []，绝不为 null。
          items: {type: string}
        created_at: {type: string, format: date-time, description: UTC RFC3339。}
        last_seen: {type: [string, 'null'], format: date-time, description: 持久化的 UTC 接收时间；首次上报前及凭据替换/吊销后为 null。常规写入合并，故该资产视图可能滞后约 30 秒。}
        presence:
          type: string
          enum: [online, offline, never, disabled, pending]
          description: 已禁用状态优先；待注册状态或缺凭据为 pending。已注册但无 last_seen 的节点为 never。否则 online 表示 last_seen 在 0 到 180 秒之间（含边界）；更早或未来的时间为 offline。遗留 status 字段保持不变。
        agent_version: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._+\-]*$', description: 来自持久化系统身份的 Agent 版本；旧版 Agent 未提供时为空。}
    BackupCategories:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: |
        各类别相互独立；不会隐式添加 configuration。响应按 configuration、monitoring、events 排序。
        configuration 包含密码哈希、持久化的 Agent 身份、凭据、全局 public_page_enabled 与 api_token_rate_limit_per_minute 设置
        及对应的 secrets.key，但不含部署配置、TLS 证书或可执行文件。
        仅接受 public_page_enabled 的文本 true/false 与 api_token_rate_limit_per_minute 的 1–100000 整数文本；允许缺少设置。
        恢复 configuration 会替换设置（缺少时分别表示启用及限额 600）；仅恢复数据时保留原设置。monitoring 包含持久化观测与指标历史，
        不含内存上报。events 不含历史备份密码、待投递通知、待执行任务与下载产物。
        仅为已提交的数据生成快照；主库与指标库各自保持一致，不保证跨库为同一时刻的快照。
      items: {type: string, enum: [configuration, monitoring, events]}
    BackupCron:
      type: string
      default: '0 3 * * *'
      description: 恰好五个 crontab 字段（分钟、小时、月内日期、月份、星期），按启动时确定的服务器进程时区解释。支持列表、范围、步长与英文月份/星期名；周日为 0 或 7。保留 crontab 月内日期与星期之间的 OR（或）语义。不支持秒、?、@ 别名、TZ/CRON_TZ 前缀或 shell 命令。跳过夏令时（DST）造成的本地时间空档，重复的本地时间可能对应不同的 UTC 运行时刻。错过的周期合并为一个任务，不排队逐次补跑。
    BackupTimezone:
      type: object
      required: [timezone_name, utc_offset_seconds, server_time]
      properties:
        timezone_name: {type: string, description: '服务器时区显示标签；可能是 IANA 名称或当前时区缩写，不一定是 IANA 标识符。不是浏览器时区。'}
        utc_offset_seconds: {type: integer, description: server_time 时刻服务器时区的 UTC 偏移；勿用于推断未来日期的偏移。}
        server_time: {type: string, format: date-time, description: 当前服务器 UTC 时间。}
    BackupNextRun:
      type: object
      additionalProperties: false
      required: [at, local]
      properties:
        at: {type: string, format: date-time, description: UTC 运行时刻。}
        local: {type: string, format: date-time, description: 含本次运行实际偏移的服务器本地 RFC3339 表示；直接展示，勿转换为浏览器时区。}
    BackupCronPreview:
      allOf:
        - $ref: '#/components/schemas/BackupTimezone'
        - type: object
          required: [next_runs]
          properties:
            next_runs: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/BackupNextRun'}}
      unevaluatedProperties: false
    BackupLocalDestinationPatch:
      type: object
      additionalProperties: false
      properties:
        path: {type: string, minLength: 1, description: '已存在的私有可写目录，须使用绝对路径、归服务器运行用户所有、权限为 0700 且不含符号链接。归档使用独立的 orbitbeacon-<plan_id> 子目录。自定义 systemd 路径须由管理员通过服务单元的 drop-in 配置授予写权限；容器须挂载可写路径。'}
    BackupLocalDestination:
      allOf:
        - $ref: '#/components/schemas/BackupLocalDestinationPatch'
        - required: [path]
    BackupObjectDestinationPatch:
      type: object
      additionalProperties: false
      description: |
        一个 S3 协议目标。COS/OSS/S3 使用 virtual-host（虚拟主机）寻址；R2 使用
        region=auto 与 path-style（路径式）寻址；s3_compatible 默认使用 path-style。
        非空 region 的默认端点为 https://cos.<region>.myqcloud.com、
        https://s3.oss-<region>.aliyuncs.com 与 https://s3.<region>.amazonaws.com。
        R2 须使用其账户端点。官方 OSS s3.oss-* 端点使用虚拟主机寻址；
        自定义 OSS 端点须为已绑定 bucket 的 CNAME，且 TLS 有效，
        使用时不向主机名或路径添加 bucket。提供这些服务商配置不表示已通过真实云账户验证。
      properties:
        provider: {type: string, enum: [cos, oss, r2, s3, s3_compatible]}
        endpoint: {type: string, format: uri, description: '仅 HTTPS Origin，可选端口 1–65535；不含路径（含尾斜杠）、用户信息、查询参数或片段。须验证 TLS 证书；不使用代理，也不跟随重定向。'}
        region: {type: string, minLength: 1, description: '必填且不能仅含空白；R2 默认 auto，且只允许 auto。'}
        bucket: {type: string, minLength: 1, description: '不能仅含空白，不含斜杠、反斜杠、CR、LF 或 NUL。COS bucket 包含 APPID。'}
        prefix: {type: string, default: '', description: '可为空，否则须为以斜杠分隔的安全相对路径；不含空路径段、. 或 .. 路径段、反斜杠或控制字符。对象键为 <prefix>/orbitbeacon/<plan_id>/<archive_name>，空前缀无前导斜杠。'}
        path_style: {type: boolean, description: 'cos/oss/s3 须为 false，r2 须为 true；s3_compatible 与 r2 默认 true，其余默认 false。'}
        allow_private_networks: {type: boolean, default: false, description: '显式允许私网中的全局单播地址；仍拒绝回环、链路本地、云元数据服务地址、非全局单播地址，以及混合包含允许和禁止地址的 DNS 应答。同样适用于最终虚拟主机名。'}
    BackupObjectDestination:
      allOf:
        - $ref: '#/components/schemas/BackupObjectDestinationPatch'
        - required: [provider, endpoint, region, bucket, prefix, path_style, allow_private_networks]
    BackupObjectCredentials:
      type: object
      additionalProperties: false
      required: [access_key_id, secret_access_key]
      description: 只写字段，整体替换，落盘加密。两个密钥字段须非空且未使用脱敏占位符；拒绝 CR、LF 与 NUL。不使用默认云凭据链。从不出现在目标、任务或站内通知响应中。
      properties:
        access_key_id: {type: string, minLength: 1, writeOnly: true}
        secret_access_key: {type: string, minLength: 1, writeOnly: true}
        session_token: {type: string, writeOnly: true, description: 可选；凭据替换时省略即清除原令牌。}
    BackupPlanPatch:
      type: object
      additionalProperties: false
      description: 省略保留现有值；显式 null 被拒绝。目标字段逐个合并。最终合并的计划须满足其 kind/provider 约束；local 计划不能有凭据，object 计划不能有 retain_count。
      properties:
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 100, description: '非空的有效 UTF-8 文本，不含控制字符。'}
        enabled: {type: boolean, default: false}
        kind: {type: string, enum: [local, object], description: 创建后不可变。}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        cron: {$ref: '#/components/schemas/BackupCron'}
        destination:
          anyOf:
            - $ref: '#/components/schemas/BackupLocalDestinationPatch'
            - $ref: '#/components/schemas/BackupObjectDestinationPatch'
        retain_count: {type: integer, minimum: 1, maximum: 1000, default: 7, description: '仅本地；仅在成功发布后删除最旧的自有归档。远端保留由服务商生命周期规则管理。'}
        credentials: {$ref: '#/components/schemas/BackupObjectCredentials'}
    BackupPlanCreate:
      allOf:
        - $ref: '#/components/schemas/BackupPlanPatch'
        - required: [name, kind, destination]
        - oneOf:
            - properties:
                kind: {const: local}
                destination: {$ref: '#/components/schemas/BackupLocalDestination'}
              not: {required: [credentials]}
            - required: [credentials]
              properties:
                kind: {const: object}
                destination:
                  allOf:
                    - $ref: '#/components/schemas/BackupObjectDestinationPatch'
                    - required: [provider, bucket]
                    - if:
                        properties:
                          provider: {const: r2}
                      then:
                        required: [endpoint]
                        properties:
                          region: {const: auto}
                          path_style: {const: true}
                      else:
                        required: [region]
                    - if:
                        properties:
                          provider: {const: s3_compatible}
                      then:
                        required: [endpoint]
                    - if:
                        properties:
                          provider: {enum: [cos, oss, s3]}
                      then:
                        properties:
                          path_style: {const: false}
              not: {required: [retain_count]}
    BackupPlanTaskSummary:
      type: object
      additionalProperties: false
      required: [id, state, created_at, finished_at, error_code, warning_code]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/BackupTaskState'}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        error_code: {$ref: '#/components/schemas/BackupTaskErrorCode'}
        warning_code: {$ref: '#/components/schemas/BackupTaskWarningCode'}
    BackupPlan:
      type: object
      additionalProperties: false
      required: [id, name, enabled, kind, categories, cron, destination, retain_count, next_run_at, created_at, updated_at, credentials_set, session_token_set, next_runs, last_task]
      description: 安全的计划投影；从不包含访问密钥、秘密令牌或密文。恢复配置会禁用所有恢复的计划。编辑/删除不改变已捕获的任务目标或凭据。
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        kind: {type: string, enum: [local, object]}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        cron: {$ref: '#/components/schemas/BackupCron'}
        destination:
          oneOf:
            - $ref: '#/components/schemas/BackupLocalDestination'
            - $ref: '#/components/schemas/BackupObjectDestination'
        retain_count: {type: [integer, 'null'], minimum: 1, maximum: 1000, description: 本地保留数量；对象存储为 null。}
        next_run_at: {type: [string, 'null'], format: date-time, description: 持久化的 UTC 到期时间；禁用时为 null。逾期时间保留到合并的工作可入队为止。}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        credentials_set: {type: boolean}
        session_token_set: {type: boolean}
        next_runs: {type: array, minItems: 3, maxItems: 3, description: '启用的计划从持久化的 next_run_at 开始，含逾期工作。禁用的计划展示预期的 Cron 预览。', items: {$ref: '#/components/schemas/BackupNextRun'}}
        last_task:
          oneOf:
            - $ref: '#/components/schemas/BackupPlanTaskSummary'
            - type: 'null'
    BackupPlanPage:
      allOf:
        - $ref: '#/components/schemas/BackupTimezone'
        - type: object
          required: [plans, has_more, next_cursor]
          properties:
            plans: {type: array, items: {$ref: '#/components/schemas/BackupPlan'}}
            has_more: {type: boolean}
            next_cursor: {type: [string, 'null'], description: '续接游标；最后一页为 null。'}
      unevaluatedProperties: false
    BackupTaskKind:
      type: string
      enum: [backup_export, backup_local, backup_remote]
    BackupTaskState:
      type: string
      enum: [queued, running, succeeded, failed]
      description: interrupted 与 restore_interrupted 是 failed 的错误码，绝非额外状态。
    BackupTaskErrorCode:
      type: string
      description: 安全的机器码，无失败时为空。绝非原始 SQL/文件系统/SDK 错误或含凭据的 URL。客户端应容忍未来的新码。
      examples: ['', snapshot_failed, history_unavailable, archive_too_large, disk_full, storage_permission_denied, storage_unreachable, storage_auth_failed, storage_upload_failed, secret_unreadable, interrupted, restore_interrupted, internal_error]
    BackupTaskWarningCode:
      type: string
      description: 无警告时为空。storage_outcome_unknown 表示发布可能已发生但无法确认；任务仍为 failed，归档元数据/密码可能允许恢复。retention_cleanup_failed 表示本地发布成功但保留删除需关注。
      examples: ['', storage_outcome_unknown, retention_cleanup_failed]
    BackupTaskDestination:
      type: object
      additionalProperties: false
      required: [plan_name, actor_name, target]
      description: 安全的不可变来源/目标快照，独立于后续的计划或用户编辑/删除。
      properties:
        plan_name: {type: string, description: 手动导出时为空。}
        actor_name: {type: string, description: 计划任务时为空。}
        target:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [path, retain_count]
              properties:
                path: {type: string}
                retain_count: {type: integer, minimum: 1, maximum: 1000}
            - $ref: '#/components/schemas/BackupObjectDestination'
    BackupTaskFields:
      type: object
      properties:
        id: {type: string, format: uuid, description: 同时是归档清单的 archive_id 与恢复信息的 archive_id；无第二个归档标识符。}
        kind: {$ref: '#/components/schemas/BackupTaskKind'}
        state: {$ref: '#/components/schemas/BackupTaskState'}
        phase: {type: string, enum: ['', snapshot, packaging, storing], description: packaging 将压缩与加密一并流式处理；无预估百分比。}
        plan_id: {type: [string, 'null'], format: uuid}
        actor_id: {type: [string, 'null'], format: uuid}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        destination: {$ref: '#/components/schemas/BackupTaskDestination'}
        scheduled_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        artifact_name: {type: [string, 'null'], description: '文件名格式为 orbitbeacon-<UTC YYYYMMDDTHHMMSSZ>-<task UUID>.tar.gz.age。'}
        artifact_bytes: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$', description: '最终加密归档大小，十进制字符串，绝非 JSON 数字。'}
        artifact_sha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$', description: 最终加密归档的 SHA-256。}
        artifact_expires_at: {type: [string, 'null'], format: date-time, description: '手动下载过期时间，通常为完成后 24 小时；计划任务/恢复历史为 null。'}
        result_location: {type: [string, 'null'], description: '仅供展示的本地归档路径或 destination.target.bucket 内的精确远端对象键；非凭据、内部暂存路径、浏览器下载 URL 或预签名链接。'}
        password_expires_at: {type: [string, 'null'], format: date-time, description: 完成后 90 天；活跃任务无过期时间。恢复的事件历史无可恢复密码。}
        error_code: {$ref: '#/components/schemas/BackupTaskErrorCode'}
        warning_code: {$ref: '#/components/schemas/BackupTaskWarningCode'}
        restored: {type: boolean, description: 恢复的历史保留归档元数据，但既无可下载产物也无恢复密码。}
        download_available: {type: boolean, description: '仅当成功、非恢复、未过期且私有产物当前可安全打开的手动导出时为 true。'}
        password_available: {type: boolean, description: '仅当非恢复的成功任务或 storage_outcome_unknown 的失败任务，且归档名称/哈希/位置完整、加密密码未过期且有密码过期时间时为 true。不证明当前密钥可解密；显式 POST 仍可能返回 secret_unreadable。'}
    BackupTask:
      allOf:
        - $ref: '#/components/schemas/BackupTaskFields'
        - required: [id, kind, state, phase, plan_id, actor_id, categories, destination, scheduled_at, created_at, started_at, finished_at, artifact_name, artifact_bytes, artifact_sha256, artifact_expires_at, result_location, password_expires_at, error_code, warning_code, restored, download_available, password_available]
      unevaluatedProperties: false
      description: 不含凭据的任务投影。从不包含密码明文/密文、输入凭据、产物清理记录或内部工作目录。普通 GET 不会触发敏感信息读取。
    BackupTaskPage:
      type: object
      additionalProperties: false
      required: [tasks, has_more, next_cursor]
      properties:
        tasks: {type: array, items: {$ref: '#/components/schemas/BackupTask'}}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null'], description: '续接游标；最后一页为 null。'}
    BackupPassword:
      type: object
      additionalProperties: false
      required: [password, archive_name, archive_sha256, password_expires_at]
      properties:
        password: {type: string, pattern: '^[A-Za-z0-9]{16}$', description: 独立生成的高熵归档密码；仅通过显式的授权 POST 返回。}
        archive_name: {type: string}
        archive_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        password_expires_at: {type: string, format: date-time}
    InboxTaskSnapshot:
      allOf:
        - $ref: '#/components/schemas/BackupTaskFields'
        - type: object
          required: [id, kind, state, phase, plan_id, actor_id, categories, destination, scheduled_at, created_at, started_at, finished_at, artifact_name, artifact_bytes, artifact_sha256, artifact_expires_at, result_location, password_expires_at, error_code, warning_code, restored, download_available, password_available, has_password]
          properties:
            has_password: {type: boolean, description: 完成时捕获的历史可用性指示；绝非密码本身。}
      unevaluatedProperties: false
      description: 不可变的安全完成快照；收件箱读取时不重新计算可用性字段。
    InboxRestoreInterruptedSnapshot:
      type: object
      additionalProperties: false
      required: [kind, categories, state, phase, error_code, warning_code, finished_at]
      description: 离线恢复中断保留的排队/运行中工作时生成的最小安全通知。若仍可用，用外层 source_id 解析其任务。
      properties:
        kind: {$ref: '#/components/schemas/BackupTaskKind'}
        categories: {$ref: '#/components/schemas/BackupCategories'}
        state: {type: string, const: failed}
        phase: {type: string, enum: ['', snapshot, packaging, storing]}
        error_code: {type: string, const: restore_interrupted}
        warning_code: {$ref: '#/components/schemas/BackupTaskWarningCode'}
        finished_at: {type: string, format: date-time}
    InboxAlertSnapshot:
      type: object
      additionalProperties: false
      required: [rule_id, rule_name, node_id, node_name, metric, severity, transition, value, started_at, resolved_at]
      description: 告警触发/恢复时的不可变投影；来源实体删除后仍保留。独立于外部通知投递创建，不含通道凭据。
      properties:
        rule_id: {type: string, format: uuid}
        rule_name: {type: string}
        node_id: {type: string, format: uuid}
        node_name: {type: string}
        metric: {type: string}
        severity: {type: string}
        transition: {type: string, enum: [firing, resolved]}
        value: {type: [number, 'null']}
        started_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
    StorageRole:
      type: string
      enum: [primary, standby]
    StorageAction:
      type: string
      enum: [rebuild, resume, promote]
    StorageTransition:
      type: string
      enum: [replica_unavailable, standby_activated, manual_required, recovery_failed, primary_restored]
    StorageEndpoint:
      type: object
      additionalProperties: false
      required: [role, driver, label, instance_id, reachable, ready]
      properties:
        role: {$ref: '#/components/schemas/StorageRole'}
        driver: {type: string, enum: [sqlite, mysql]}
        label: {type: string, description: 不含用户、密码或连接字符串的显示名称。}
        instance_id: {type: string, description: 已登记实例 UUID；未登记时为空。}
        reachable: {type: boolean}
        ready: {type: boolean, description: 仅表示完整副本，不表示满足 RPO 或可提升。}
    StorageRecoveryAction:
      type: object
      additionalProperties: false
      required: [action, target]
      properties:
        action: {$ref: '#/components/schemas/StorageAction'}
        target: {$ref: '#/components/schemas/StorageRole'}
    StorageRecoveryRequest:
      type: object
      additionalProperties: false
      required: [domain, action, target]
      properties:
        domain: {type: string, enum: [main, history]}
        action: {$ref: '#/components/schemas/StorageAction'}
        target: {$ref: '#/components/schemas/StorageRole'}
    StorageRecoveryPreview:
      type: object
      additionalProperties: false
      required: [operation_id, expires_at, revision, source, target, confirmation, requires_data_loss_acceptance]
      properties:
        operation_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        revision: {type: integer, minimum: 0}
        source:
          oneOf: [{$ref: '#/components/schemas/StorageEndpoint'}, {type: 'null'}]
        target: {$ref: '#/components/schemas/StorageEndpoint'}
        confirmation: {type: string, description: 精确的 domain/target/instance_uuid，不裁剪或忽略大小写。}
        requires_data_loss_acceptance: {type: boolean}
    StorageRecoveryOperation:
      type: object
      additionalProperties: false
      required: [id, action, target, status, phase, rows_copied, error_code]
      properties:
        id: {type: string, format: uuid}
        action: {$ref: '#/components/schemas/StorageAction'}
        target: {$ref: '#/components/schemas/StorageRole'}
        status: {type: string, enum: [awaiting_confirmation, queued, running, succeeded, failed]}
        phase: {type: [string, 'null'], enum: [validating, clearing, copying, catching_up, switching, done, null]}
        rows_copied: {type: integer, minimum: 0, description: 已复制行数，不是总量或百分比。}
        error_code: {type: string, description: 稳定失败码；无错误时为空。}
    StorageDomain:
      type: object
      additionalProperties: false
      required: [domain, state, active_role, primary, standby, replication_status, last_synced_at, proven_loss_seconds, failure_since, manual_deadline_at, manual_required, reason_code, operation, available_actions]
      properties:
        domain: {type: string, enum: [main, history]}
        state: {type: string, enum: [initializing, healthy, suspect, standby_active, resyncing, rebuilding, manual_required, unavailable]}
        active_role: {type: [string, 'null'], enum: [primary, standby, null]}
        primary: {$ref: '#/components/schemas/StorageEndpoint'}
        standby:
          oneOf: [{$ref: '#/components/schemas/StorageEndpoint'}, {type: 'null'}]
        replication_status: {type: string, enum: [unconfigured, initializing, caught_up, lagging, offline, rebuild_required, error]}
        last_synced_at: {type: [string, 'null'], format: date-time, description: 最后完整 ACK 的服务端墙钟时间，仅用于展示，不能推算丢失界。}
        proven_loss_seconds: {type: [number, 'null'], minimum: 0, description: 有效冻结点及屏障证明的非负秒数上界；未知或正常健康时为 null，不代表零丢失。}
        failure_since: {type: [string, 'null'], format: date-time}
        manual_deadline_at: {type: [string, 'null'], format: date-time, description: 人工处理期限的绝对时间，不是持续时长。}
        manual_required: {type: boolean}
        reason_code: {type: string}
        operation:
          description: 仅包含已接受操作；未接受预览仅由操作 GET 查询。
          oneOf: [{$ref: '#/components/schemas/StorageRecoveryOperation'}, {type: 'null'}]
        available_actions: {type: array, items: {$ref: '#/components/schemas/StorageRecoveryAction'}, description: 服务端判断的合法动作；客户端不得从 state 或 ready 推算资格。}
    StorageNotificationPreferences:
      type: object
      additionalProperties: false
      required: [inbox, channel_ids]
      properties:
        inbox: {type: boolean, default: true}
        channel_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
    StorageNotificationSettings:
      type: object
      additionalProperties: false
      required: [inbox, channel_ids, snapshot_ready]
      properties:
        inbox: {type: boolean}
        channel_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
        snapshot_ready: {type: boolean, description: 所选频道快照已完成当前世代校准；false 时外发暂停，站内开关独立生效。}
    StorageStatus:
      type: object
      additionalProperties: false
      required: [enabled, revision, server_time, notification_settings, domains]
      properties:
        enabled: {type: boolean}
        revision: {type: integer, minimum: 0}
        server_time: {type: string, format: date-time}
        observed_at: {type: string, format: date-time, description: 仅离线 CLI 的本地记录观测时间，不证明远端此刻健康。}
        notification_settings: {$ref: '#/components/schemas/StorageNotificationSettings'}
        domains: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/StorageDomain'}}
    InboxStorageSnapshot:
      type: object
      additionalProperties: false
      required: [domain, transition, active_role, reason_code, occurred_at]
      properties:
        domain: {type: string, enum: [main, history]}
        transition: {$ref: '#/components/schemas/StorageTransition'}
        active_role: {type: [string, 'null'], enum: [primary, standby, null]}
        reason_code: {type: string}
        occurred_at: {type: string, format: date-time}
    StorageWebhookPayload:
      type: object
      additionalProperties: false
      description: 存储故障专用固定 Webhook；使用原 HMAC 签名，不改变普通告警格式，不含连接字符串或频道凭据。
      required: [kind, event_id, domain, transition, active_role, reason_code, occurred_at]
      properties:
        kind: {type: string, const: storage}
        event_id: {type: string, format: uuid}
        domain: {type: string, enum: [main, history]}
        transition: {$ref: '#/components/schemas/StorageTransition'}
        active_role: {type: [string, 'null'], enum: [primary, standby, null]}
        reason_code: {type: string}
        occurred_at: {type: string, format: date-time}
    InboxNotification:
      type: object
      additionalProperties: false
      required: [id, kind, source_id, transition, severity, created_at, details, read]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [task, alert, storage]}
        source_id: {type: string, description: 来源任务、告警或本地控制事件的 UUID；可能已无法解析。}
        transition: {type: string, enum: [succeeded, failed, firing, resolved, replica_unavailable, standby_activated, manual_required, recovery_failed, primary_restored]}
        severity: {type: string}
        created_at: {type: string, format: date-time, description: '通知的实际创建时间，非告警条件的起始时间。'}
        details:
          oneOf:
            - $ref: '#/components/schemas/InboxTaskSnapshot'
            - $ref: '#/components/schemas/InboxRestoreInterruptedSnapshot'
            - $ref: '#/components/schemas/InboxAlertSnapshot'
            - $ref: '#/components/schemas/InboxStorageSnapshot'
        read: {type: boolean, description: 仅针对已认证用户的已读标志。}
    InboxPage:
      type: object
      additionalProperties: false
      required: [notifications, has_more, read_through]
      properties:
        notifications: {type: array, items: {$ref: '#/components/schemas/InboxNotification'}}
        has_more: {type: boolean}
        next_cursor: {type: string, description: 仅当 has_more 为 true 时存在；作为 before 传入。}
        read_through: {type: [string, 'null'], format: uuid, description: '同一读事务中所有保留通知里插入序号最大的记录的 UUID，与页面或未读过滤无关。仅当无保留记录时为 null。非可排序的 UUID 或时间戳；插入序号从不暴露。'}
    InboxSummary:
      type: object
      additionalProperties: false
      required: [unread_count, latest_id]
      properties:
        unread_count: {type: integer, format: int64, minimum: 0, description: '当前账户的未读通知数，非触发事件数。'}
        latest_id: {type: [string, 'null'], format: uuid, description: '插入序号最大的通知 UUID，含已读记录；无保留通知时为 null。与 unread_count 在同一事务读取。'}
    NotificationChannelConfig:
      anyOf:
        - type: object
          additionalProperties: false
          properties:
            url: {type: string, format: uri, writeOnly: true, description: 创建 webhook 时必填；整体加密且从不返回。PATCH 省略则保留 URL。HTTPS 不含 userinfo 或 fragment；仅当 allow_insecure_webhooks 与 notification_allow_private_networks 启用时，字面回环地址才可用 HTTP。}
        - type: object
          additionalProperties: false
          required: [chat_id]
          properties:
            chat_id: {type: string, pattern: '^(?:-?[0-9]{1,20}|@[A-Za-z][A-Za-z0-9_]{4,31})$'}
            template: {type: string, x-maxLengthBytes: 1000, description: "最多 1000 字节；占位符：{state} {rule} {node} {metric} {severity} {value} {started_at} {resolved_at} {event_id}。"}
        - type: object
          additionalProperties: false
          required: [host, port, from, to]
          properties:
            host: {type: string, maxLength: 253}
            port: {type: integer, minimum: 1, maximum: 65535}
            username: {type: string, maxLength: 100}
            from: {type: string, format: email}
            to: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: email}}
            template: {type: string, x-maxLengthBytes: 1000, description: "最多 1000 字节；占位符：{state} {rule} {node} {metric} {severity} {value} {started_at} {resolved_at} {event_id}。"}
        - type: object
          additionalProperties: false
          properties:
            url: {type: string, format: uri, writeOnly: true, description: 飞书、钉钉、企业微信、Bark、ntfy 的 URL；整体加密且从不返回，PATCH 省略则保留。}
            template: {type: string, x-maxLengthBytes: 1000}
    NotificationChannelReadConfig:
      anyOf:
        - type: object
          additionalProperties: false
          required: [url_redacted, url_set]
          properties:
            url_redacted: {type: string, description: Origin 后跟 /…；不含原始路径或 query。}
            url_set: {type: boolean}
        - type: object
          additionalProperties: false
          required: [chat_id]
          properties:
            chat_id: {type: string}
            template: {type: string, x-maxLengthBytes: 1000, description: "最多 1000 字节；占位符：{state} {rule} {node} {metric} {severity} {value} {started_at} {resolved_at} {event_id}。"}
        - type: object
          additionalProperties: false
          required: [host, port, from, to]
          properties:
            host: {type: string}
            port: {type: integer}
            username: {type: string}
            from: {type: string, format: email}
            to: {type: array, items: {type: string, format: email}}
            template: {type: string, x-maxLengthBytes: 1000, description: "最多 1000 字节；占位符：{state} {rule} {node} {metric} {severity} {value} {started_at} {resolved_at} {event_id}。"}
        - type: object
          additionalProperties: false
          required: [url_redacted, url_set]
          properties:
            url_redacted: {type: string, description: Origin 后跟 /…；不含原始路径或 query。}
            url_set: {type: boolean}
            template: {type: string, x-maxLengthBytes: 1000}
    NotificationChannelPatch:
      type: object
      additionalProperties: false
      description: config 须与 kind 匹配。Webhook 的 secret 为可选 HMAC 签名键，Telegram 须机器人令牌，邮件的 secret 为 SMTP 密码（有 username 时必填）。飞书和钉钉可选签名密钥，企业微信必须为空，Bark 必填设备密钥（1..128 字节，仅字母、数字、下划线、连字符），ntfy 可选访问令牌。secret 与完整通道 URL 独立加密、只写且从不返回。显式替换或清除不解密旧值，允许在密钥不匹配后修复；恢复匹配的密钥或替换所有受影响的值。其他需要不可读凭据的更新返回 409 secret_unreadable。省略以保留，或在 kind 允许时用空值清除。
      properties:
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 100}
        kind: {type: string, enum: [webhook, telegram, email, feishu, dingtalk, wecom, bark, ntfy]}
        enabled: {type: boolean}
        config: {$ref: '#/components/schemas/NotificationChannelConfig'}
        secret: {type: string, writeOnly: true, x-maxLengthBytes: 4096}
    NotificationChannel:
      type: object
      additionalProperties: false
      required: [id, name, kind, enabled, config, secret_set, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [webhook, telegram, email, feishu, dingtalk, wecom, bark, ntfy]}
        enabled: {type: boolean}
        config: {$ref: '#/components/schemas/NotificationChannelReadConfig'}
        secret_set: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, channel_id, event_id, state, attempts, next_attempt_at, last_error_code, coalesced_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        state: {type: string, enum: [pending, sent, failed]}
        attempts: {type: integer, minimum: 0, maximum: 5}
        next_attempt_at: {type: string, format: date-time}
        last_error_code: {type: string, maxLength: 40}
        coalesced_count: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AlertRulePatch:
      type: object
      additionalProperties: false
      description: |
        指标规则须有 comparator 与 threshold。流量配额阈值为 (0,1000]，其他百分比阈值为 0..100；
        load1 阈值须为 0..1000000 的有限数值；probes_down 阈值须为 0..5 的有限数值。
        probe_failed 仅允许 comparator 为 > 且 threshold 为 0。probe_latency_ms 支持 > 或 <，阈值须 > 0 且 <= 60000，失败结果无数据。probe_tls_expiry_days 仅允许 <，阈值须 > 0 且 <= 3650，剩余天数可含小数且下限为 0，无 TLS 到期时间则无数据。三种指标须指定有效 target，其他指标 target 须为 null；按原始目标精确匹配。目标移除或关闭探测时，新鲜报告可恢复事件。
        node_expiry_days 仅允许 comparator 为 <，阈值 > 0 且 <= 365。按到期日次日 UTC 零点计算连续剩余天数，下限 0；不依赖 Agent 上报，亦为下述最新报告时效限制的例外。无日期不匹配，并恢复已有事件。
        流量配额按账期计费用量评估，可超过 100%；不依赖在线状态。读取失败保留事件，移除配额或账期回落可恢复。
        offline 须 comparator 与 threshold 为 null/省略，且 for_seconds 至少 180（nodes.OnlineWindow）。
        all 作用域须 scope_id 为 null/省略；node/group 作用域须已有 UUID。
        指定节点或分组的规则在对应节点或分组删除时级联删除；每次级联删除随父级资产事务审计。
        每 30 秒评估已注册且启用的节点；除流量配额外，指标须来自新鲜且通过身份隔离校验的最新上报。
        缺失/已过期/错误的指标会重置待触发时长，既不触发告警，也不能作为恢复依据。
        磁盘使用率取新鲜且采集成功的磁盘中的最大值；总量为零的内存、交换空间或磁盘视为无数据。
        probes_down 统计最新上报中的失败结果；无探测结果即数值零，因此移除目标可使告警恢复。
        指标条件须持续满足 for_seconds。offline 使用距最近一次服务端收到上报
        （无上报则为注册）的时长，无额外待触发延迟。恢复判断采用阈值 2% 的回差，
        百分比指标的回差至少为 1 个百分点；probes_down 使用限制在 0..5 的计数回差。probe_failed 无回差；probe_latency_ms 仅使用阈值 2% 的回差；probe_tls_expiry_days 使用阈值 2% 且至少 1 天的回差。
        重启后重置待触发计时器；已触发的事件重新加载，不重复创建。
      properties: &alertRuleProperties
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 100, description: 非空名称。}
        enabled: {type: boolean}
        scope_kind: {type: string, enum: [all, group, node]}
        scope_id: {type: [string, 'null'], format: uuid}
        metric: {type: string, enum: [cpu_percent, memory_used_percent, swap_used_percent, disk_used_percent, load1, probes_down, probe_failed, probe_latency_ms, probe_tls_expiry_days, traffic_quota_percent, node_expiry_days, offline]}
        target: {type: [string, 'null'], x-maxLengthBytes: 1024, description: 三个单目标探测指标必填且须为有效探测目标；其他指标须为 null。}
        comparator: {type: [string, 'null'], enum: ['>', '<', null]}
        threshold: {type: [number, 'null'], minimum: 0, maximum: 1000000}
        for_seconds: {type: integer, minimum: 0, maximum: 86400}
        severity: {type: string, enum: [info, warning, critical]}
        channel_ids: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}, description: 已有通道；PATCH 省略保留路由，POST 默认空。}
    AlertRuleCreate:
      allOf:
        - $ref: '#/components/schemas/AlertRulePatch'
        - required: [name, enabled, scope_kind, metric, for_seconds, severity]
    AlertRule:
      type: object
      additionalProperties: false
      required: [id, name, enabled, scope_kind, scope_id, metric, target, comparator, threshold, for_seconds, severity, channel_ids, created_at, updated_at]
      properties:
        <<: *alertRuleProperties
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AlertSummary:
      type: object
      additionalProperties: false
      required: [firing, newest]
      properties:
        firing:
          type: object
          additionalProperties: false
          required: [total, info, warning, critical, unknown]
          properties:
            total: {type: integer, format: int64, minimum: 0}
            info: {type: integer, format: int64, minimum: 0}
            warning: {type: integer, format: int64, minimum: 0}
            critical: {type: integer, format: int64, minimum: 0}
            unknown: {type: integer, format: int64, minimum: 0}
        newest:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/AlertEvent'}
    AlertSilenceCreate:
      type: object
      additionalProperties: false
      required: [reason, scope_kind, ends_at]
      properties:
        reason: {type: string, minLength: 1, maxLength: 255, description: 去除首尾空白后为 1–255 UTF-8 字节。}
        scope_kind: {type: string, enum: [all, group, node]}
        scope_id: {type: [string, 'null'], format: uuid, description: all 时必须为空；group 或 node 时必须指向现有实体。}
        starts_at: {type: string, format: date-time, description: 缺省为当前时间。}
        ends_at: {type: string, format: date-time, description: 必须晚于开始及当前时间，时长不超过 30 天。}
    AlertSilence:
      type: object
      additionalProperties: false
      required: [id, reason, scope_kind, scope_id, scope_name, starts_at, ends_at, created_at, active]
      properties:
        id: {type: string, format: uuid}
        reason: {type: string}
        scope_kind: {type: string, enum: [all, group, node]}
        scope_id: {type: [string, 'null'], format: uuid}
        scope_name: {type: string, description: 当前名称；all 时为空字符串。}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        active: {type: boolean, description: starts_at <= now < ends_at。}
    AlertEvent:
      type: object
      additionalProperties: false
      required: [id, rule_id, node_id, rule_name, node_name, metric, target, severity, state, value, started_at, resolved_at, last_notified_at, silenced]
      properties:
        id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        rule_name: {type: string}
        target: {type: [string, 'null'], description: 事件触发时的规则目标；无目标时为 null。}
        metric: {type: string, description: 事件触发时的规则指标（来自存储的规则快照）；不可用时为空。}
        severity: {type: string, description: 事件触发时的规则严重级别（来自存储的规则快照）；不可用时为空。}
        node_name: {type: string}
        state: {type: string, enum: [firing, resolved]}
        value: {type: [number, 'null'], description: 触发或恢复时的指标值；offline 告警或因生命周期变更而恢复的事件为 null。}
        started_at: {type: string, format: date-time, description: 待触发条件的起始时间；offline 事件为最近一次在线依据的时间。}
        resolved_at: {type: [string, 'null'], format: date-time}
        last_notified_at: {type: [string, 'null'], format: date-time, description: 最近一次成功通知投递的时间。}
        silenced: {type: boolean, description: 持久化的静默状态；补发触发通知后清零。}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 机器可读的失败码；validation_failed 可包含逐字段信息。客户端须容忍新的错误码。
          examples: [totp_required, totp_invalid, totp_already_enabled, totp_setup_expired, unauthenticated, forbidden, password_change_required, public_page_disabled, invalid_old_password, password_unchanged, not_found, node_not_found, enrollment_not_found, node_capacity_reached, enrollment_conflict, identity_conflict, last_administrator, username_conflict, invalid_json, invalid_input, validation_failed, body_too_large, protocol_unsupported, method_not_allowed, rate_limited, backup_queue_full, backup_plan_busy, backup_plan_not_found, task_not_found, artifact_not_ready, artifact_expired, artifact_missing, password_unavailable, password_expired, secret_unreadable, storage_busy, storage_unavailable, storage_commit_unknown, storage_confirmation_stale, storage_manual_required, storage_identity_mismatch, storage_transaction_too_large, not_available, internal_error]
        message: {type: string, minLength: 1}
        request_id: {type: string, format: uuid, description: 将响应与内部服务失败的安全服务端诊断元数据关联。}
        fields:
          type: object
          additionalProperties: {type: string}
    BrowserSession:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at, user]
      properties:
        csrf_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 与会话绑定的 CSRF 证明，不是会话认证凭据。
        expires_at: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    TOTPStatus:
      type: object
      additionalProperties: false
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled: {type: boolean}
        recovery_codes_remaining: {type: integer, minimum: 0, maximum: 10}
    TOTPSetup:
      type: object
      additionalProperties: false
      required: [secret, uri, qr]
      properties:
        secret: {type: string, pattern: '^[A-Z2-7]{32}$'}
        uri: {type: string, format: uri}
        qr:
          type: object
          additionalProperties: false
          required: [size, modules]
          properties:
            size: {type: integer, minimum: 21}
            modules: {type: string, pattern: '^[01]+$', description: 长度为 size 的平方，按行排列，不含静区。}
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: {type: string, pattern: '^[a-z2-7]{5}(-[a-z2-7]{5}){3}$'}
    User:
      type: object
      additionalProperties: false
      required: [id, username, created_at, must_change_password, totp_enabled]
      properties:
        id: {type: string, format: uuid}
        username: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 128}
        created_at: {type: string, format: date-time, description: UTC RFC3339。}
        totp_enabled: {type: boolean}
        must_change_password: {type: boolean, description: 始终存在。为 true 时限制管理访问，直至成功改密并重新登录。}
    Group:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, target_id, created_at, details]
      properties:
        id: {type: string, format: uuid}
        actor_id:
          type: [string, 'null']
          format: uuid
          description: 操作用户 UUID；本地初始化或无用户操作者的事件为 null。
        action: {type: string}
        target_id:
          type: [string, 'null']
          format: uuid
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
        details:
          type: object
          description: 变更时的少量事实快照；alert_rule.create/update/delete 的 name 为规则名称。历史事件可能缺少这些字段。
          additionalProperties: true
          properties:
            name: {type: string, description: 告警规则名称（alert_rule.*）。}
          example: {}
    Node:
      type: object
      additionalProperties: false
      required: [id, name, status, expires_on, notes, region, provider, group_id, tags, created_at, last_seen, presence, agent_version, stopped]
      properties:
        stopped: {type: boolean, description: 最新 stop 成功，且收到它的进程和凭据仍是节点当前值；任何新进程上报后清除。}
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [pending, online, offline, unknown, disabled]}
        expires_on: {type: [string, 'null'], format: date}
        notes: {type: string}
        region: {type: string}
        provider: {type: string}
        group_id:
          type: [string, 'null']
          format: uuid
        tags:
          type: array
          description: 已排序的标签字符串；无标签节点返回 []，绝不为 null。
          items: {type: string}
        created_at: {type: string, format: date-time, description: UTC RFC3339。}
        last_seen: {type: [string, 'null'], format: date-time, description: 持久化的 UTC 接收时间；首次上报前及凭据替换/吊销后为 null。常规写入合并，故该资产视图可能滞后约 30 秒。}
        presence:
          type: string
          enum: [online, offline, never, disabled, pending]
          description: 已禁用状态优先；待注册状态或缺凭据为 pending。已注册但无 last_seen 的节点为 never。否则 online 表示 last_seen 在 0 到 180 秒之间（含边界）；更早或未来的时间为 offline。遗留 status 字段保持不变。
        agent_version: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._+\-]*$', description: 来自持久化系统身份的 Agent 版本；旧版 Agent 未提供时为空。}
    MetricHistory:
      type: object
      additionalProperties: false
      required: [metric, unit, range, step_seconds, points]
      properties:
        metric: {type: string, enum: [cpu_percent, memory_used_percent, swap_used_percent, load1, load5, load15, disk_used_percent, inode_used_percent, net_rx_bytes_per_second, net_tx_bytes_per_second, disk_read_bytes_per_second, disk_write_bytes_per_second, disk_busy_percent, pressure_cpu_percent, pressure_memory_percent, pressure_io_percent, temperature_celsius]}
        unit: {type: string, enum: [percent, load, bytes_per_second, celsius]}
        range: {type: string, enum: [1h, 6h, 24h, 7d, 30d, 90d]}
        step_seconds: {type: integer, enum: [60, 300, 3600]}
        points:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [t, avg, max]
            properties:
              t: {type: string, format: date-time}
              avg: {type: number, minimum: 0}
              max: {type: number, minimum: 0}
    LatestSample:
      allOf:
        - {$ref: '#/components/schemas/LatestSampleView'}
        - type: object
          required: [server_time]
          properties:
            server_time: {type: string, format: date-time, description: UTC 响应时钟；不改变接收或采样时间。}
      unevaluatedProperties: false
    LatestSampleView:
      type: object
      required: [received_at, sampled_at, seq, metrics, system, runtime]
      properties:
        received_at: {type: string, format: date-time}
        sampled_at: {type: string, format: date-time}
        seq: {type: integer, minimum: 1}
        metrics: {$ref: '#/components/schemas/Metrics'}
        runtime: {$ref: '#/components/schemas/RuntimeSettings'}
        system:
          oneOf:
            - {$ref: '#/components/schemas/System'}
            - {type: 'null'}
    PublicPageSettings:
      type: object
      additionalProperties: false
      required: [enabled]
      description: 全局公开访问开关，独立于各节点的发布。缺失的持久化键默认启用。PATCH 须显式提供此布尔值；null 与未知键无效。
      properties:
        enabled: {type: boolean, default: true}
    PublicSettings:
      type: object
      additionalProperties: false
      required: [enabled, name, region, provider]
      description: 管理员独立发布的文本；绝不来自内部元数据。文本去除首尾空白后须为有效 UTF-8 且不含控制字符，长度限制按 UTF-8 字节计算。启用时须有非空名称。已有的空设置解码为禁用与三个空字符串。
      properties:
        enabled: {type: boolean, default: false}
        name: {type: string, x-maxLengthBytes: 255, default: '', pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: 独立的公开名称；仅在发布禁用时允许为空。}
        region: {type: string, x-maxLengthBytes: 128, default: '', pattern: '^[^\u0000-\u001f\u007f-\u009f]*$'}
        provider: {type: string, x-maxLengthBytes: 128, default: '', pattern: '^[^\u0000-\u001f\u007f-\u009f]*$'}
      allOf:
        - if:
            properties:
              enabled: {const: true}
          then:
            properties:
              name: {x-minLengthBytes: 1}
    PublicSettingsPatch:
      type: object
      additionalProperties: false
      description: 四个字段均可选；省略或 null 保持存储值不变。空字符串清除文本。去除首尾空白后按 UTF-8 字节校验长度；无效 UTF-8 或控制字符会被拒绝，不会被静默移除。合并后的存储设置（而非仅本补丁）在启用时须有非空名称。空对象是有效的无变更补丁。
      properties:
        enabled: {type: [boolean, 'null'], description: 启用或禁用发布；null 保持不变。}
        name: {type: [string, 'null'], x-maxLengthBytes: 255, pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: 去除首尾空白后的公开名称；合并设置禁用时可用空字符串清除；null 保持不变。}
        region: {type: [string, 'null'], x-maxLengthBytes: 128, pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: 去除首尾空白后的公开区域；空字符串清除；null 保持不变。}
        provider: {type: [string, 'null'], x-maxLengthBytes: 128, pattern: '^[^\u0000-\u001f\u007f-\u009f]*$', description: 去除首尾空白后的公开服务商；空字符串清除；null 保持不变。}
    AvailabilityPercent:
      type: [number, 'null']
      minimum: 0
      maximum: 100
      description: 在线秒数除以已观测秒数的百分比，保留两位小数；无观测为 null，有离线秒数时最高 99.99。
    AvailabilitySummary:
      type: object
      additionalProperties: false
      required: [days, percent]
      properties:
        percent: {$ref: '#/components/schemas/AvailabilityPercent'}
        days:
          type: array
          minItems: 30
          maxItems: 90
          items:
            type: object
            additionalProperties: false
            required: [day, online_seconds, offline_seconds, unknown_seconds, percent]
            properties:
              day: {type: string, format: date}
              online_seconds: {type: integer, minimum: 0, maximum: 86400}
              offline_seconds: {type: integer, minimum: 0, maximum: 86400}
              unknown_seconds: {type: integer, minimum: 0, maximum: 86400}
              percent: {$ref: '#/components/schemas/AvailabilityPercent'}
    PublicAvailability:
      type: object
      additionalProperties: false
      required: [start_day, percent, days]
      properties:
        start_day: {type: string, format: date}
        percent: {$ref: '#/components/schemas/AvailabilityPercent'}
        days:
          type: array
          minItems: 30
          maxItems: 30
          items: {$ref: '#/components/schemas/AvailabilityPercent'}
    PublicNode:
      type: object
      additionalProperties: false
      required: [name, region, provider, status, last_seen, availability, metric_status, cpu_percent, memory_percent, load1, uptime_seconds]
      description: |
        最小公开投影，绝非内部节点或原始上报。
        公开文本为显式配置，绝不来自私有元数据。
        资源键始终存在；null 表示不可用，而非零。

        当前凭据无上报代次或会话，或 last_seen 缺失或晚于请求的 server_time 时，
        状态为 unknown。否则 online 表示 0 到 180 秒（含边界）内收到过接受的新上报；
        超过 180 秒为 offline。这是近期有效上报，非 ping、服务健康或可用性。
        拒绝、重复与旧序号的上报不刷新 last_seen。
        凭据轮换重置上报归属，在新上报前产生 unknown。

        当前进程按完全匹配的凭据、绑定版本（epoch）、代次与会话保留最后接受的快照。
        离线与来源过期不擦除可用数值，也不推进运行时长。不持久化完整上报；
        服务端重启保留资产与持久化的 last_seen，但在新上报前可能返回 null 资源。
        原始 ok/stale 状态加有效数值可用。原始 stale 或来源经过时间超过
        max(3*interval_ms,45000) 时产生 stale 但保留数值。相等仍为新鲜。
        来源间隔溢出使用协议的防溢出新鲜度规则。错误/不支持/缺失的值
        为 unavailable/null，绝不从更早的成功上报填充。原始上报状态不变，
        过期值不会成为告警/历史观测。
      properties:
        availability: {$ref: '#/components/schemas/PublicAvailability'}
        name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255, description: 显式的公开名称。}
        region: {type: string, x-maxLengthBytes: 128, description: 显式的公开区域；未设置时为空。}
        provider: {type: string, x-maxLengthBytes: 128, description: 显式的公开服务商；未设置时为空。}
        status: {type: string, enum: [online, offline, unknown]}
        last_seen: {type: [string, 'null'], format: date-time, description: 当前身份最近已知的服务端接收时间；重启后可能是合并的持久观测。上报前或身份重置后为 null。}
        metric_status:
          type: object
          additionalProperties: false
          required: [cpu_percent, memory_percent, load1, uptime_seconds]
          properties:
            cpu_percent: {$ref: '#/components/schemas/PublicMetricStatus'}
            memory_percent: {$ref: '#/components/schemas/PublicMetricStatus'}
            load1: {$ref: '#/components/schemas/PublicMetricStatus'}
            uptime_seconds: {$ref: '#/components/schemas/PublicMetricStatus'}
        cpu_percent: {type: [number, 'null'], minimum: 0, maximum: 100, description: CPU 使用率百分比；真实零值返回 0。}
        memory_percent: {type: [number, 'null'], minimum: 0, maximum: 100, description: '100 * (total - available) / total，无整数溢出；两个值须可用且 total 为正。'}
        load1: {type: [number, 'null'], minimum: 0, description: 一分钟系统负载均值；无单位，非百分比。}
        uptime_seconds: {type: [number, 'null'], minimum: 0, description: 系统运行时长（秒）。}
    PublicMetricStatus:
      type: string
      enum: [ok, stale, unavailable]
    LiveFrameClock:
      type: object
      required: [type, server_time, update_interval_seconds]
      properties:
        type: {type: string, enum: [snapshot, heartbeat, close, error]}
        server_time: {type: string, format: date-time, description: UTC 消息时钟；绝非新的采样或接收时间戳。}
        update_interval_seconds: {type: integer, minimum: 2, maximum: 60, description: 生效的服务器端浏览器更新间隔；配置变更须重启生效。}
    PublicSnapshotFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [data]
          properties:
            type: {const: snapshot}
            data: {$ref: '#/components/schemas/PublicNodeList'}
      unevaluatedProperties: false
    LiveHeartbeatFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          properties:
            type: {const: heartbeat}
      unevaluatedProperties: false
    LiveCloseFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [code]
          properties:
            type: {const: close}
            code: {type: string, enum: [renew, shutdown]}
      unevaluatedProperties: false
    LiveErrorFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [code]
          properties:
            type: {const: error}
            code: {type: string, const: unauthenticated}
      unevaluatedProperties: false
    PublicPageDisabledFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [code]
          properties:
            type: {const: error}
            code: {type: string, const: public_page_disabled}
      unevaluatedProperties: false
    PublicLiveFrame:
      oneOf:
        - {$ref: '#/components/schemas/PublicSnapshotFrame'}
        - {$ref: '#/components/schemas/LiveHeartbeatFrame'}
        - {$ref: '#/components/schemas/LiveCloseFrame'}
        - {$ref: '#/components/schemas/PublicPageDisabledFrame'}
    ConsoleFleetState:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          description: 完整的紧凑资产清单，含待注册、从未上报、离线与已禁用的节点；空为 []。
          items:
            type: object
            additionalProperties: false
            required: [id, status, presence, last_seen, agent_version, stopped, cpu_percent, memory_used_percent]
            properties:
              id: {$ref: '#/components/schemas/Node/properties/id'}
              status: {$ref: '#/components/schemas/Node/properties/status'}
              presence: {$ref: '#/components/schemas/Node/properties/presence'}
              last_seen:
                type: [string, 'null']
                format: date-time
                description: 当前身份最近已知的服务端接收，含合并的内存上报；上报前或身份重置后为 null。
              cpu_percent:
                type: [number, 'null']
                minimum: 0
                maximum: 100
                description: 当前身份最新已接受报告的 CPU 使用率；仅 presence 为 online 且 metric_status 为 ok 时提供，否则为 null。
              memory_used_percent:
                type: [number, 'null']
                minimum: 0
                maximum: 100
                description: '100 * (total - available) / total；仅在线且两个内存指标状态均为 ok、值齐全、total > 0 时提供，否则为 null。服务器重启后等待新上报。'
              agent_version: {$ref: '#/components/schemas/Node/properties/agent_version'}
              stopped: {$ref: '#/components/schemas/Node/properties/stopped'}
    ConsoleDetailState:
      type: object
      additionalProperties: false
      required: [node, latest, runtime]
      properties:
        node:
          oneOf:
            - {$ref: '#/components/schemas/Node'}
            - {type: 'null'}
          description: 仅当资产节点已删除时为 null。
        latest:
          oneOf:
            - allOf:
                - {$ref: '#/components/schemas/LatestSampleView'}
              unevaluatedProperties: false
            - {type: 'null'}
          description: 最新接受的进程本地采样；null 不表示已删除。不含凭据或进程身份。
        runtime:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeSettings'}
            - {type: 'null'}
          description: 当前身份最后观测到的 Agent 持有运行时；上报前或身份重置后为 null。
    ConsoleSnapshotFrame:
      allOf:
        - {$ref: '#/components/schemas/LiveFrameClock'}
        - type: object
          required: [data]
          properties:
            type: {const: snapshot}
            data:
              oneOf:
                - {$ref: '#/components/schemas/ConsoleFleetState'}
                - {$ref: '#/components/schemas/ConsoleDetailState'}
      unevaluatedProperties: false
    ConsoleLiveFrame:
      oneOf:
        - {$ref: '#/components/schemas/ConsoleSnapshotFrame'}
        - {$ref: '#/components/schemas/LiveHeartbeatFrame'}
        - {$ref: '#/components/schemas/LiveCloseFrame'}
        - {$ref: '#/components/schemas/LiveErrorFrame'}
    PublicNodeList:
      type: object
      additionalProperties: false
      required: [nodes, has_more, next_offset, generated_at]
      properties:
        nodes:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PublicNode'}
          description: 按候选顺序发布的投影；空为 []，绝不为 null。并发撤销可减少返回数量而不改变候选分页。
        has_more: {type: boolean, description: 是否还有其他候选页；非总数，也不保证下一页仍将发布。}
        next_offset: {type: [integer, 'null'], minimum: 0, description: has_more 为 true 时，为请求 offset 加上消耗的候选 ID 数（包括因并发撤销而跳过的候选）；否则为 null。绝不从返回节点数推导。}
        generated_at: {type: string, format: date-time, description: 状态与新鲜度判定共用的 UTC 投影时间；可按生效的服务器更新间隔缓存，心跳不刷新。}
      allOf:
        - if:
            properties:
              has_more: {const: true}
          then:
            properties:
              next_offset: {type: integer}
          else:
            properties:
              next_offset: {type: 'null'}
    InterfaceSelection:
      type: array
      maxItems: 8
      uniqueItems: true
      description: 唯一的非空接口名，每个 1–255 UTF-8 字节，不含 NUL、CR 或 LF；服务端/Agent/采集器共用校验。空选择使用默认路由。
      items:
        type: string
        x-minLengthBytes: 1
        x-maxLengthBytes: 255
        allOf:
          - {pattern: '^[^\u0000\r\n]+$'}
          - {pattern: '[^\u0009-\u000d\u0020\u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]'}
    ProbeTargets:
      type: array
      maxItems: 5
      uniqueItems: true
      description: 唯一的服务探测目标。每个目标最多 1024 UTF-8 字节，不含空白。支持格式：tcp://host:port、不含 userinfo 或 fragment 的 http:// 或 https:// URL、icmp://host、dns://host。目标对所有控制台用户可见；切勿在 URL（含查询字符串）中放入机密。
      items:
        type: string
        x-minLengthBytes: 1
        x-maxLengthBytes: 1024
        pattern: '^\S+$'
    RuntimeSettings:
      type: object
      additionalProperties: true
      required: [report_interval_seconds, disk_interval_seconds, interfaces, disk_paths, probe_targets, remote_commands, disabled_features]
      description: 由 Agent 管理的设置。本地 JSON 严格校验，默认上报/磁盘采集间隔分别为 10/60 秒，remote_commands 默认包含 upgrade、restart、stop，其余数组默认为空；上报须提供全部 runtime 字段，不接受 null，也不填充默认值。大小预算按路径/接口各出现四次、探测目标各出现两次的 JSON 转义后长度计算，为有大小上限的采集数据结构预留 13 KiB。最终编码上报仍以 64 KiB 为上限。空 interfaces 使用默认路由；空 disk_paths 使用 Agent 默认磁盘；空 probe_targets 禁用探测。
      properties:
        report_interval_seconds: {type: integer, minimum: 5, maximum: 60}
        disk_interval_seconds: {type: integer, minimum: 60, maximum: 3600}
        interfaces: {$ref: '#/components/schemas/InterfaceSelection'}
        disk_paths:
          type: array
          maxItems: 8
          uniqueItems: true
          description: 平台有效的绝对路径，每个最多 1024 字节，不含 NUL。服务端/Agent/采集器共用校验。
          items: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 1024, pattern: '^[^\u0000]+$'}
        probe_targets: {$ref: '#/components/schemas/ProbeTargets'}
        remote_commands:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [upgrade, restart, stop]}
        disabled_features:
          type: array
          maxItems: 7
          uniqueItems: true
          items: {type: string, enum: [disk, network, traffic, probes, disk_io, pressure, temperature]}
    BillingMode:
      type: string
      enum: [total, max, rx, tx]
      default: total
      description: 收发合计、收发较大值、仅接收或仅发送；按周期总量计算。
    TrafficSettings:
      type: object
      additionalProperties: false
      required: [billing_day, quota_bytes, billing_mode]
      properties:
        billing_mode: {$ref: '#/components/schemas/BillingMode'}
        billing_day: {type: integer, minimum: 1, maximum: 28}
        quota_bytes: {$ref: '#/components/schemas/DecimalCounter', description: 零表示不限；仅服务端业务设置。}
    Enrollment:
      type: object
      required: [id, expires_at, max_uses, uses]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: [string, 'null'], format: uuid}
        group_id: {type: [string, 'null'], format: uuid}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, const: 1, description: 当前有效上限；uses 保留历史实际使用次数。}
        uses: {type: integer, minimum: 0}
        revoked_at: {type: [string, 'null'], format: date-time}
    System:
      type: object
      properties:
        hostname: {type: string, x-maxLengthBytes: 255}
        os: {type: string, x-maxLengthBytes: 64}
        arch: {type: string, x-maxLengthBytes: 64}
        agent_version: {type: string, maxLength: 64, x-maxLengthBytes: 64, pattern: '^[A-Za-z0-9._+\-]*$', description: 可选的 Agent 构建版本；旧版 Agent 省略。}
    DecimalCounter:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: 0..18446744073709551615 的规范无符号十进制；拒绝 JSON 数字、符号、指数与前导零。
    TrafficTotal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: 十进制流量聚合；收、发、合计和计费用量均饱和至 9223372036854775807。
    TrafficDaily:
      type: object
      additionalProperties: false
      required: [day, rx_bytes, tx_bytes]
      properties:
        day: {type: string, format: date, description: UTC calendar day.}
        rx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        tx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
    TrafficCycle:
      type: object
      additionalProperties: false
      required: [start, end, rx_bytes, tx_bytes, total_bytes, used_bytes]
      properties:
        start: {type: string, format: date-time, description: Inclusive UTC billing-cycle start at 00:00.}
        end: {type: string, format: date-time, description: 下一计费周期的 UTC 起始（不含）。}
        rx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        tx_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        total_bytes: {$ref: '#/components/schemas/TrafficTotal'}
        used_bytes: {$ref: '#/components/schemas/TrafficTotal', description: 按 billing_mode 计算，饱和至 int64 上限。}
    TrafficSummary:
      type: object
      additionalProperties: false
      required: [billing_day, quota_bytes, billing_mode, cycle, daily, updated_at]
      properties:
        billing_mode: {$ref: '#/components/schemas/BillingMode'}
        billing_day: {type: [integer, 'null'], minimum: 1, maximum: 28}
        quota_bytes:
          description: 节点无配额时为 null；配置配额为 0 表示不限。
          oneOf:
            - {$ref: '#/components/schemas/DecimalCounter'}
            - {type: 'null'}
        cycle: {$ref: '#/components/schemas/TrafficCycle'}
        daily:
          type: array
          description: 有数据的升序 UTC 天，限于含今天的请求窗口。
          items: {$ref: '#/components/schemas/TrafficDaily'}
        updated_at: {type: [string, 'null'], format: date-time, description: 最新小时行更新时间；无小时行时为 null。}
    ProbeHistory:
      type: object
      additionalProperties: false
      required: [target, range, unit, step_seconds, points]
      properties:
        target: {type: string}
        range: {type: string, enum: [24h, 7d]}
        unit: {type: string, const: ms}
        step_seconds: {type: integer, const: 3600}
        points:
          type: array
          items: {$ref: '#/components/schemas/ProbeHistoryPoint'}
    ProbeHistoryPoint:
      type: object
      additionalProperties: false
      required: [t, avg, max, checks, failures]
      properties:
        t: {type: string, format: date-time}
        avg: {type: [number, 'null'], minimum: 0, maximum: 60000, description: Latency sum divided by successful checks.}
        max: {type: [number, 'null'], minimum: 0, maximum: 60000}
        checks: {type: integer, minimum: 0}
        failures: {type: integer, minimum: 0}
    ProbeSummary:
      type: object
      additionalProperties: false
      required: [probes]
      properties:
        probes:
          type: array
          maxItems: 5
          description: 每个配置目标一条，保持期望配置顺序。
          items: {$ref: '#/components/schemas/ProbeStatus'}
    ProbeStatus:
      type: object
      additionalProperties: false
      required: [target, status, latency_ms, error, status_code, checked_at, tls_expires_at, uptime_24h, checks_24h]
      properties:
        target: {type: string, x-maxLengthBytes: 1024}
        status: {type: string, enum: [up, down, pending], description: pending 表示尚无存储的最新结果。}
        latency_ms: {type: [number, 'null'], minimum: 0, maximum: 60000}
        error: {type: string, enum: ['', timeout, refused, dns, tls, http_status, unreachable, unsupported, error]}
        status_code: {type: [integer, 'null'], minimum: 100, maximum: 599, description: 适用时的 HTTP 响应状态码。}
        tls_expires_at: {type: [string, 'null'], format: date-time, description: HTTPS leaf certificate expiry when a response arrived.}
        checked_at: {type: [string, 'null'], format: date-time}
        uptime_24h: {type: [number, 'null'], minimum: 0, maximum: 100, description: 100 * (checks - failures) / checks；checks 为零时为 null。}
        checks_24h: {type: integer, minimum: 0}
    Source:
      type: object
      additionalProperties: true
      required: [sample_id, age_ms, source_interval_ms]
      properties:
        sample_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
        age_ms: {type: integer, minimum: 0}
        source_interval_ms: {type: integer, minimum: 1}
        measurement_window_ms: {type: integer, minimum: 0}
      description: age/window 使用单调时钟计算；age <= max(3*interval,45000) 时视为新鲜。重复的 sample_id 不是新观测。
    DifferentialSource:
      allOf:
        - {$ref: '#/components/schemas/Source'}
        - {required: [measurement_window_ms]}
      description: CPU 与每个网络来源在所有状态（含预热与失败）下均须非负测量窗口；允许零。
    Metrics:
      type: object
      additionalProperties: true
      required: [cpu_percent, load1, load5, load15, memory_total_bytes, memory_available_bytes, swap_total_bytes, swap_used_bytes, uptime_seconds, disks, networks, metric_status, sources]
      properties:
        disk_io:
          type: [object, 'null']
          required: [read_bytes_per_sec, write_bytes_per_sec, busy_percent]
          properties:
            read_bytes_per_sec: {type: number, minimum: 0, maximum: 1000000000000000}
            write_bytes_per_sec: {type: number, minimum: 0, maximum: 1000000000000000}
            busy_percent: {type: number, minimum: 0, maximum: 100}
        pressure:
          type: [object, 'null']
          properties:
            cpu: {type: [number, 'null'], minimum: 0, maximum: 100}
            memory: {type: [number, 'null'], minimum: 0, maximum: 100}
            io: {type: [number, 'null'], minimum: 0, maximum: 100}
        temperature_celsius: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 150}
        cpu_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        load1: {type: [number, 'null'], minimum: 0}
        load5: {type: [number, 'null'], minimum: 0}
        load15: {type: [number, 'null'], minimum: 0}
        memory_total_bytes: {type: [integer, 'null'], minimum: 0}
        memory_available_bytes: {type: [integer, 'null'], minimum: 0}
        swap_total_bytes: {type: [integer, 'null'], minimum: 0}
        swap_used_bytes: {type: [integer, 'null'], minimum: 0}
        uptime_seconds: {type: [number, 'null'], minimum: 0}
        disks:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: true
            required: [path, total_bytes, used_bytes, inodes_total, inodes_used, sampled_at]
            properties:
              path: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 1024}
              total_bytes: {type: [integer, 'null'], minimum: 0}
              used_bytes: {type: [integer, 'null'], minimum: 0}
              inodes_total: {type: [integer, 'null'], minimum: 0, description: 与 inodes_used 同时为 null 或有值；不支持 inode 时为 null。}
              inodes_used: {type: [integer, 'null'], minimum: 0, description: 不超过 inodes_total。}
              sampled_at: {type: string, format: date-time}
        networks:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: true
            required: [name, rx_bytes_per_sec, tx_bytes_per_sec]
            properties:
              name: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
              rx_bytes_per_sec: {type: [number, 'null'], minimum: 0}
              tx_bytes_per_sec: {type: [number, 'null'], minimum: 0}
        metric_status:
          type: object
          required: [cpu_percent, load1, load5, load15, memory_total_bytes, memory_available_bytes, swap_total_bytes, swap_used_bytes, uptime_seconds]
          description: '校验九个已知标量键与每个上报的 disk:/network: 键。丢弃未知扩展键与值；不匹配的 disk:/network: 键被拒绝。'
          properties:
            cpu_percent: {$ref: '#/components/schemas/MetricStatus'}
            load1: {$ref: '#/components/schemas/MetricStatus'}
            load5: {$ref: '#/components/schemas/MetricStatus'}
            load15: {$ref: '#/components/schemas/MetricStatus'}
            memory_total_bytes: {$ref: '#/components/schemas/MetricStatus'}
            memory_available_bytes: {$ref: '#/components/schemas/MetricStatus'}
            swap_total_bytes: {$ref: '#/components/schemas/MetricStatus'}
            swap_used_bytes: {$ref: '#/components/schemas/MetricStatus'}
            uptime_seconds: {$ref: '#/components/schemas/MetricStatus'}
          patternProperties:
            '^(disk:|network:)': {$ref: '#/components/schemas/MetricStatus'}
          additionalProperties: true
        sources:
          type: object
          required: [cpu, load, memory, swap, uptime]
          description: '已知来源族与每个上报的 disk:/network: 来源仍为必填并校验。丢弃未知族键与值；不匹配的 disk:/network: 键被拒绝。'
          properties:
            cpu: {$ref: '#/components/schemas/DifferentialSource'}
            load: {$ref: '#/components/schemas/Source'}
            memory: {$ref: '#/components/schemas/Source'}
            swap: {$ref: '#/components/schemas/Source'}
            uptime: {$ref: '#/components/schemas/Source'}
          patternProperties:
            '^network:': {$ref: '#/components/schemas/DifferentialSource'}
            '^disk:': {$ref: '#/components/schemas/Source'}
          additionalProperties: true
    MetricStatus:
      type: string
      enum: [ok, unsupported, permission_denied, disabled, error, stale]
    Traffic:
      type: object
      additionalProperties: true
      required: [epoch, period_start, rx_bytes, tx_bytes]
      properties:
        epoch: {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9a-f]{1,64}$'}
        period_start: {type: string, format: date-time, description: Hour-aligned UTC timestamp.}
        rx_bytes: {$ref: '#/components/schemas/DecimalCounter', description: Cumulative received bytes in 0..9223372036854775807.}
        tx_bytes: {$ref: '#/components/schemas/DecimalCounter', description: Cumulative sent bytes in 0..9223372036854775807.}
    ProbeResult:
      type: object
      additionalProperties: true
      required: [target, ok, latency_ms, error, status_code, checked_at]
      properties:
        target: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 1024, description: Validated service-probe target.}
        ok: {type: boolean}
        latency_ms: {type: [number, 'null'], minimum: 0, maximum: 60000, description: 成功结果非 null，失败为 null。}
        error: {type: string, enum: ['', timeout, refused, dns, tls, http_status, unreachable, unsupported, error], description: 当且仅当 ok 为 true 时为空；http_status 须附 status_code。}
        status_code: {type: [integer, 'null'], minimum: 100, maximum: 599, description: 仅 HTTP 探测时存在；error 为 http_status 时必填。}
        tls_expires_at: {type: [string, 'null'], format: date-time, description: HTTPS leaf certificate expiry when a response arrived; null on handshake failure.}
        checked_at: {type: string, format: date-time}
    Report:
      type: object
      additionalProperties: true
      required: [protocol_version, run_generation, session_id, seq, sampled_at, runtime, metrics, traffic]
      properties:
        command_results: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/CommandResult'}}
        protocol_version: {const: 1}
        run_generation: {type: integer, minimum: 1, description: 在当前节点凭据内单调递增；更换凭据重置服务端隔离标记（fence）。}
        session_id: {type: string, x-minLengthBytes: 1, x-maxLengthBytes: 255}
        seq: {type: integer, minimum: 1}
        sampled_at: {type: string, format: date-time}
        runtime: {$ref: '#/components/schemas/RuntimeSettings'}
        system: {$ref: '#/components/schemas/System'}
        metrics: {$ref: '#/components/schemas/Metrics'}
        traffic: {type: array, maxItems: 24, description: 唯一的 epoch/period_start 对，含每进程按小时累计的字节计数器。, items: {$ref: '#/components/schemas/Traffic'}}
        probe_results: {type: array, maxItems: 5, description: 每个当前配置目标的最新结果；目标值唯一。, items: {$ref: '#/components/schemas/ProbeResult'}}
    CommandTargetConstraint:
      if: {properties: {kind: {const: upgrade}}}
      then: {required: [target_version]}
      else: {not: {required: [target_version]}}
    Command:
      type: object
      additionalProperties: false
      required: [id, kind, expires_at]
      allOf: [{$ref: '#/components/schemas/CommandTargetConstraint'}]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [upgrade, restart, stop]}
        target_version: {type: string, minLength: 1, maxLength: 64, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$', description: 仅 upgrade 必填；其他指令禁止。}
        expires_at: {type: string, format: date-time}
    CommandResult:
      type: object
      additionalProperties: false
      required: [id, status, code]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [succeeded, failed, rejected]}
        code: {type: string, maxLength: 16, enum: [ok, disabled_locally, unsupported, expired, interrupted, failed, download, checksum, self_check, downgrade, rolled_back]}
    CommandRecord:
      type: object
      additionalProperties: false
      required: [id, kind, expires_at, node_id, state, result_code, requested_by, created_at, delivered_at, finished_at]
      properties:
        id: {$ref: '#/components/schemas/Command/properties/id'}
        kind: {$ref: '#/components/schemas/Command/properties/kind'}
        target_version: {$ref: '#/components/schemas/Command/properties/target_version'}
        expires_at: {$ref: '#/components/schemas/Command/properties/expires_at'}
        node_id: {type: string, format: uuid}
        state: {type: string, enum: [pending, delivered, succeeded, failed, rejected, expired, canceled]}
        result_code: {type: string, enum: ['', ok, disabled_locally, unsupported, expired, interrupted, failed, download, checksum, self_check, downgrade, rolled_back]}
        requested_by: {type: string, description: 请求人的用户名}
        created_at: {type: string, format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    ReportResponse:
      type: object
      additionalProperties: true
      required: [node_id, accepted_seq, server_time]
      properties:
        command: {$ref: '#/components/schemas/Command'}
        node_id: {type: string, format: uuid, description: 已认证的节点身份；绝非请求目标。}
        accepted_seq: {type: integer, minimum: 1}
        server_time: {type: string, format: date-time}
        traffic_acks: {type: array, maxItems: 24, description: 本次上报条目的已提交计数器；值可能滞后。超过 35 天的桶确认后丢弃。超过一小时的未来桶既不存储也不确认。, items: {$ref: '#/components/schemas/Traffic'}}
