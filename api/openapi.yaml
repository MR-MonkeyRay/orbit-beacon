openapi: 3.1.0
info:
  title: OrbitBeacon foundation control plane
  version: 0.1.0
  description: |
    Step 1 foundation control plane only: no agent enrollment, telemetry, alerts,
    backups or upgrades are implemented. All reads require a valid browser session
    unless explicitly marked public. Administrators and viewers can read users,
    groups, nodes and audit events; authenticated mutations require an administrator
    except logout and changing one's own password. Mutating requests require the canonical configured HTTPS
    Origin and a session-bound CSRF token; login requires Origin without prior CSRF.
    Canonical origins lowercase DNS names, normalize IPv6 and omit default port 443;
    request Host and forwarded headers do not establish trust.
    JSON requests must contain one object, reject unknown fields and are limited to
    64 KiB. String limits enforced by the server are UTF-8 byte limits.
    Unsupported methods return 405 with Allow before authentication is checked;
    unknown API routes return structured 404, never the UI shell.
    State changes and actor-attributed audit insertion share one transaction;
    failed audit insertion rolls back the change. Batch nodes use one transaction
    per node and report individual failures rather than committing unaudited changes.
    Sessions expire after 12 hours. Successful login and authenticated index access
    perform bounded expired-session cleanup. Password changes revoke every session
    of the affected user; user role changes also revoke that user's sessions.
    UI responses deny framing with CSP frame-ancestors 'none' and X-Frame-Options DENY.
    The data directory must be effective-user-owned and private (0700); SQLite,
    its sidecars and secrets.key must be owned regular 0600 files, never symlinks.
    Linux validates that the backing mount is local and writable.
  license:
    name: GNU General Public License v3.0
    identifier: GPL-3.0
servers:
  - url: https://beacon.example.test
security:
  - session: []
paths:
  /api/v1/session:
    post:
      operationId: login
      security: []
      description: Requires the configured public Origin. Argon2 work is serialized. After 60 invalid credentials in a minute, further invalid attempts are rate-limited; valid credentials remain admissible.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, maxLength: 128}
                password: {type: string, maxLength: 1024}
      responses:
        '200':
          description: Session established; Set-Cookie is __Host-orbitbeacon_session with Secure, HttpOnly, SameSite=Lax, Path=/ and a 12-hour expiry.
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token, expires_at, user]
                properties:
                  csrf_token: {type: string}
                  expires_at: {type: string, format: date-time}
                  user: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Session revoked and cookie expired. Available to either role.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current user, with no credential fields.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/password:
    patch:
      operationId: changeOwnPassword
      description: Available to either role. The old password proves ownership. A successful change atomically revokes every session of this user, including the current session; log in again.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [old_password, new_password]
              properties:
                old_password: {type: string, maxLength: 1024}
                new_password: {type: string, minLength: 8, maxLength: 1024}
      responses:
        '204': {description: Password changed and all of this user's sessions revoked.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users:
    get:
      operationId: listUsers
      description: Available to authenticated administrators and viewers; credential fields are never returned.
      responses:
        '200':
          description: User collection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createUser
      description: Administrator only.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, role]
              properties:
                username: {type: string, minLength: 1, maxLength: 128}
                password: {type: string, minLength: 8, maxLength: 1024}
                role: {type: string, enum: [admin, viewer]}
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getUser
      description: Available to authenticated administrators and viewers; no credential fields.
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateUser
      description: Administrator only. Username and role are optional; omitted fields remain unchanged. Changing role revokes all sessions of the affected user. The last administrator cannot be demoted.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: {type: string, minLength: 1, maxLength: 128}
                role: {type: string, enum: [admin, viewer]}
      responses:
        '200':
          description: Updated credential-free user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteUser
      description: Administrator only. Revokes the user's sessions and deletes the user atomically. The last administrator cannot be deleted.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: User deleted and sessions revoked.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups:
    get:
      operationId: listGroups
      description: Available to authenticated administrators and viewers.
      responses:
        '200':
          description: Group collection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createGroup
      description: Administrator only. Groups contain a name, not enrollment credentials or future policy settings.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        $ref: '#/components/requestBodies/GroupName'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getGroup
      description: Available to authenticated administrators and viewers.
      responses:
        '200':
          description: Group found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: renameGroup
      description: Administrator only. Updates the name only.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        $ref: '#/components/requestBodies/GroupName'
      responses:
        '200':
          description: Renamed group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteGroup
      description: Administrator only. Atomically deletes the group and detaches its nodes, setting their group_id to null without deleting the nodes.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Group removed and nodes detached.}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      description: Available to authenticated administrators and viewers. Returns persisted events, newest first, with UUID tie-breaking. Details are JSON objects and contain no credentials.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated audit events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes:
    get:
      operationId: listNodes
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Ordered by creation time then UUID; includes pending and disabled assets.
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createPendingNode
      description: Administrator only. Capacity counts all nodes, including pending and disabled.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '201':
          description: Persistent pending identity created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNode
      responses:
        '200':
          description: Credential-free node view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateNodeMetadata
      description: Administrator only. Omitted fields remain unchanged; null string fields also remain unchanged. Empty notes/region/provider strings clear those fields, group_id null detaches the group and tags [] clears all tags. Metadata changes do not replace node credentials or claim agent activity.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: [string, 'null'], minLength: 1, maxLength: 255, description: Non-whitespace name; null leaves unchanged.}
                notes: {type: [string, 'null'], description: Empty string clears; null leaves unchanged.}
                region: {type: [string, 'null'], description: Empty string clears; null leaves unchanged.}
                provider: {type: [string, 'null'], description: Empty string clears; null leaves unchanged.}
                group_id:
                  type: [string, 'null']
                  format: uuid
                  description: Existing group UUID, or null to clear membership.
                tags:
                  type: [array, 'null']
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 255, description: Non-whitespace tag; strings are not trimmed or normalized.}
                  description: Replaces all tags; [] clears and null leaves unchanged. Duplicate exact strings are rejected. Responses sort tags lexicographically.
      responses:
        '200':
          description: Complete updated node metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNode
      description: Administrator only. Atomically revoke identity, cancel active queued work and delete the asset. Update results retain its ID.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
        - name: confirm
          in: query
          required: true
          schema: {type: boolean, const: true}
      responses:
        '204': {description: Asset removed and identity revoked.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/config:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getDesiredConfig
      responses:
        '200':
          description: Persistent desired configuration, not a claim of agent application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DesiredConfig'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patchDesiredConfig
      description: Administrator only. Valid changes increment revision atomically. All invalid supported fields are returned together. Probe scheduling is not implemented and probe_targets cannot be changed in this slice.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                report_interval_seconds: {type: integer, minimum: 5, maximum: 60}
                disk_interval_seconds: {type: integer, minimum: 60, maximum: 3600}
                interfaces:
                  type: array
                  maxItems: 8
                  items: {type: string, minLength: 1, maxLength: 1024}
                disk_paths:
                  type: array
                  maxItems: 8
                  items: {type: string, minLength: 1, maxLength: 1024}
                billing_day: {type: integer, minimum: 1, maximum: 28}
                quota_bytes: {type: string, pattern: '^[0-9]+$', description: Unsigned 64-bit decimal bytes.}
      responses:
        '200':
          description: Updated desired configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DesiredConfig'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/batch:
    post:
      operationId: batchNodes
      description: Administrator only. Explicit unique UUIDs required, no implicit all-nodes selection. Each node is a separate transaction and results preserve request order.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node_ids, action]
              properties:
                node_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: {type: string, format: uuid}
                action: {type: string, enum: [disable, enable, delete]}
                confirm: {type: boolean, default: false, description: Must be true for delete.}
      responses:
        '200':
          description: One result per selected ID, including missing nodes and storage failures.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [node_id, status]
                      properties:
                        node_id: {type: string, format: uuid}
                        status: {type: string, enum: [succeeded, failed]}
                        error_code: {type: string, enum: [node_not_found, storage_error]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/enrollments:
    post:
      operationId: unavailableEnrollment
      description: Reserved admission boundary. Viewers receive 403; administrators receive explicit 501. No token is issued in this slice.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '501': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-orbitbeacon_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: Must match the canonical configured HTTPS public origin (DNS lowercase, normalized IPv6, default port 443 omitted), never request Host or forwarded headers.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      description: Token returned by this session's login.
    NodeID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  requestBodies:
    GroupName:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 255}
  responses:
    Error:
      description: Structured failure. Invalid JSON or input returns 400, missing/expired sessions 401, role/Origin/CSRF failures 403, missing resources 404, and protected-last-administrator or capacity conflicts 409. Unsupported methods return 405 with Allow before authentication; unknown API routes return 404. No API error returns the SPA shell.
      headers:
        X-Request-ID:
          schema: {type: string, format: uuid}
        Allow:
          description: Present on 405; lists supported methods for the route.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Machine-readable failure code; validation_failed may include per-field messages. Clients must tolerate new error codes.
          examples: [unauthenticated, forbidden, not_found, node_not_found, node_capacity_reached, last_administrator, invalid_json, validation_failed, method_not_allowed, rate_limited, not_available, internal_error]
        message: {type: string, minLength: 1}
        request_id: {type: string, format: uuid}
        fields:
          type: object
          additionalProperties: {type: string}
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {type: string, enum: [admin, viewer]}
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
    Group:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, target_id, created_at, details]
      properties:
        id: {type: string, format: uuid}
        actor_id:
          type: [string, 'null']
          format: uuid
          description: Acting user UUID; null for local bootstrap or events without a user actor.
        action: {type: string}
        target_id:
          type: [string, 'null']
          format: uuid
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
        details:
          type: object
          additionalProperties: true
          example: {}
    Node:
      type: object
      additionalProperties: false
      required: [id, name, status, notes, region, provider, group_id, tags, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [pending, online, offline, unknown, disabled]}
        notes: {type: string}
        region: {type: string}
        provider: {type: string}
        group_id:
          type: [string, 'null']
          format: uuid
        tags:
          type: array
          description: Sorted tag strings; an untagged node returns [], never null.
          items: {type: string}
        created_at: {type: string, format: date-time, description: UTC RFC3339.}
    DesiredConfig:
      type: object
      additionalProperties: false
      required: [revision, report_interval_seconds, disk_interval_seconds, interfaces, disk_paths, probe_targets, billing_day, quota_bytes]
      properties:
        revision: {type: integer, minimum: 1}
        report_interval_seconds: {type: integer, minimum: 5, maximum: 60}
        disk_interval_seconds: {type: integer, minimum: 60, maximum: 3600}
        interfaces:
          type: array
          maxItems: 8
          items: {type: string}
        disk_paths:
          type: array
          maxItems: 8
          items: {type: string}
        probe_targets:
          type: array
          maxItems: 0
          items: {type: string}
        billing_day: {type: integer, minimum: 1, maximum: 28}
        quota_bytes: {type: string, pattern: '^[0-9]+$'}
