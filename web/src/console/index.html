<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OrbitBeacon console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' transform='rotate(-25 16 16)' fill='none' stroke='%237C9CFF' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4.6' fill='%23F2B53A'/%3E%3Ccircle cx='27.9' cy='12.7' r='2.8' fill='%237C9CFF'/%3E%3C/svg%3E">
<script>(function(d){try{var t=localStorage.getItem('orbitbeacon-theme');if(t==='light'||t==='dark')d.dataset.theme=t}catch(e){}if(location.pathname==='/login'||location.pathname==='/change-password')d.classList.add('route-login')})(document.documentElement)</script>
<link rel="stylesheet" href="%STYLE%">
<script type="module" src="%SCRIPT%"></script>
</head>
<body>
<!--icons-->
<a class="skip" href="#view">Skip to content</a>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Console">
<a class="brand" href="/overview" data-link><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><ellipse class="mark-orbit" cx="16" cy="16" rx="13" ry="6" transform="rotate(-25 16 16)"/><circle class="mark-core" cx="16" cy="16" r="4.6"/><circle class="mark-sat" cx="27.9" cy="12.7" r="2.8"/></svg><span class="nav-label">OrbitBeacon</span></a>
<nav class="nav" aria-label="Main">
<a href="/overview" data-link data-nav="/overview"><svg class="icon" aria-hidden="true"><use href="#i-overview"/></svg><span class="nav-label">Overview</span></a>
<a href="/nodes" data-link data-nav="/nodes"><svg class="icon" aria-hidden="true"><use href="#i-server"/></svg><span class="nav-label">Nodes</span></a>
<a href="/settings" data-link data-nav="/settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span class="nav-label">Settings</span></a>
<a href="/alerts" data-link data-nav="/alerts"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span class="nav-label">Alerts</span></a>
<button class="notification-entry" id="notifications" type="button" aria-haspopup="dialog" aria-label="Notifications, unread count loading"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span class="nav-label">Notifications</span><span class="notification-count" aria-hidden="true">…</span><small class="notification-freshness"></small></button>
</nav>
<a class="nav-public" href="/"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><span class="nav-label">Public page</span></a>
<div class="account" id="account"></div>
</aside>
<main class="main" id="view" tabindex="-1"><noscript><p class="noscript">The OrbitBeacon console requires JavaScript.</p></noscript></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
