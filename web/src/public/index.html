<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" data-i18n-content="public.description" content="Availability and resource usage of public nodes">
<title data-i18n="public.title">Node status – OrbitBeacon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' transform='rotate(-25 16 16)' fill='none' stroke='%237C9CFF' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4.6' fill='%23F2B53A'/%3E%3Ccircle cx='27.9' cy='12.7' r='2.8' fill='%237C9CFF'/%3E%3C/svg%3E">
<script>(function(d){try{var t=localStorage.getItem('orbitbeacon-theme');if(t==='light'||t==='dark')d.dataset.theme=t}catch(e){}})(document.documentElement)</script>
<link rel="stylesheet" href="%STYLE%">
<script type="module" src="%SCRIPT%"></script>
</head>
<body>
<!--icons-->
<div class="page">
<header class="top">
<a class="brand" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><ellipse class="mark-orbit" cx="16" cy="16" rx="13" ry="6" transform="rotate(-25 16 16)"/><circle class="mark-core" cx="16" cy="16" r="4.6"/><circle class="mark-sat" cx="27.9" cy="12.7" r="2.8"/></svg><span>OrbitBeacon</span></a>
<div class="top-actions" id="top-actions"><button id="theme" class="icon-button" type="button"></button><a class="login" href="/login" data-i18n="public.signIn">Admin sign in</a></div>
</header>
<p id="locale-error" class="locale-error" role="alert" hidden></p>
<main>
<section class="hero" aria-labelledby="headline">
<div class="hero-copy">
<h1 id="headline" data-i18n="public.heading">Node status</h1>
<p id="summary" class="summary" data-i18n="public.loading">Loading nodes…</p>
<div class="live">
<svg class="countdown" id="countdown" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle class="arc" cx="18" cy="18" r="15" pathLength="100"/><circle class="dot" cx="18" cy="18" r="4"/></svg>
<div class="live-text"><p id="updated" data-i18n="public.notUpdated">Not updated yet</p></div>
<button id="refresh" class="refresh" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span data-i18n="public.refresh">Refresh</span></button>
</div>
</div>
<div class="constellation" id="constellation" aria-hidden="true"></div>
</section>
<div class="filters" id="filters" role="group" data-i18n-aria-label="public.filterLabel" aria-label="Filter nodes on this page by status" hidden></div>
<p id="announcement" class="sr" role="status" aria-live="polite" data-i18n="public.loading">Loading nodes…</p>
<div id="empty" class="empty" hidden><p id="empty-text"></p><button id="retry" class="retry" type="button" data-i18n="public.retry" hidden>Retry</button></div>
<ul id="nodes" class="nodes" data-i18n-aria-label="public.nodesLabel" aria-label="Public nodes"></ul>
<nav class="pagination" id="pagination" data-i18n-aria-label="public.paginationLabel" aria-label="Node pages" hidden><button id="previous" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg><span data-i18n="public.previous">Previous</span></button><span id="page">Page 1</span><button id="next" type="button" disabled><span data-i18n="public.next">Next</span><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button></nav>
<noscript><p class="empty">请启用 JavaScript 以获取公开节点信息。 / Enable JavaScript to view public node information.</p></noscript>
</main>
<footer><p data-i18n="public.presenceNote">Online means a valid report was received within the last 3 minutes. Resource data may be unavailable and shown as —.</p><p data-i18n="public.poweredBy">Powered by OrbitBeacon</p></footer>
</div>
</body>
</html>
