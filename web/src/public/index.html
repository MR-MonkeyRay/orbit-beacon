<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="已公开节点的在线状态与资源概览">
<title>节点状态 – OrbitBeacon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' transform='rotate(-25 16 16)' fill='none' stroke='%237C9CFF' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4.6' fill='%23F2B53A'/%3E%3Ccircle cx='27.9' cy='12.7' r='2.8' fill='%237C9CFF'/%3E%3C/svg%3E">
<script>(function(d){try{var t=localStorage.getItem('orbitbeacon-theme');if(t==='light'||t==='dark')d.dataset.theme=t}catch(e){}})(document.documentElement)</script>
<link rel="stylesheet" href="%STYLE%">
<script type="module" src="%SCRIPT%"></script>
</head>
<body>
<!--icons-->
<div class="page">
<header class="top">
<a class="brand" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><ellipse class="mark-orbit" cx="16" cy="16" rx="13" ry="6" transform="rotate(-25 16 16)"/><circle class="mark-core" cx="16" cy="16" r="4.6"/><circle class="mark-sat" cx="27.9" cy="12.7" r="2.8"/></svg><span>OrbitBeacon</span></a>
<div class="top-actions"><button id="theme" class="icon-button" type="button" aria-label="切换主题"></button><a class="login" href="/login">管理登录</a></div>
</header>
<main>
<section class="hero" aria-labelledby="headline">
<div class="hero-copy">
<h1 id="headline">节点状态</h1>
<p id="summary" class="summary">正在加载节点…</p>
<div class="live">
<svg class="countdown" id="countdown" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle class="arc" cx="18" cy="18" r="15" pathLength="100"/><circle class="dot" cx="18" cy="18" r="4"/></svg>
<div class="live-text"><p id="updated">尚未成功更新</p><p class="muted">每 10 秒自动刷新</p></div>
<button id="refresh" class="refresh" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>刷新</span></button>
</div>
</div>
<div class="constellation" id="constellation" aria-hidden="true"></div>
</section>
<div class="filters" id="filters" role="group" aria-label="按状态筛选本页节点" hidden></div>
<p id="announcement" class="sr" role="status" aria-live="polite">正在加载节点…</p>
<div id="empty" class="empty" hidden><p id="empty-text"></p><button id="retry" class="retry" type="button" hidden>重试</button></div>
<ul id="nodes" class="nodes" aria-label="公开节点"></ul>
<nav class="pagination" id="pagination" aria-label="节点分页" hidden><button id="previous" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg>上一页</button><span id="page">第 1 页</span><button id="next" type="button" disabled>下一页<svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button></nav>
<noscript><p class="empty">请启用 JavaScript 以获取公开节点信息。</p></noscript>
</main>
<footer><p>在线表示最近 3 分钟内收到有效上报；资源数据可能暂不可用，显示为 —。</p><p>由 OrbitBeacon 提供</p></footer>
</div>
</body>
</html>
